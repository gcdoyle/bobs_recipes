# SQLite. Each environment's database is a single file in storage/
# (ignored by git along with uploaded files). Back up production by copying
# storage/production.sqlite3, or with: sqlite3 storage/production.sqlite3 ".backup backup.sqlite3"
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: storage/production.sqlite3
