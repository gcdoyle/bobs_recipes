  - name: Ellie Krieger's Crab Cakes
    categories: [Seafood]
    prep_time: 30
    cooking_time: 20
    servings: 4
    description:
      - Recipe by Ellie Krieger, 2005. Makes 8 baked crab cakes, 2 per serving. Serve with Smarter Tartar Sauce (its own recipe).
      - "Inactive prep: 30 minutes."
    ingredients:
      - { ingredient: Cooking spray }
      - { qty: 1, ingredient: Egg, note: lightly beaten }
      - { qty: 2, measure: tsp, ingredient: Dijon mustard }
      - { qty: 1, measure: tsp, ingredient: Worcestershire sauce }
      - { qty: 1, measure: tbsp, ingredient: Lemon juice, note: fresh }
      - { measure: dash, ingredient: Hot sauce }
      - { qty: "1/2", measure: tsp, ingredient: Old Bay seasoning }
      - { qty: "1/2", measure: cup, ingredient: Red bell pepper, note: finely chopped }
      - { qty: 1, ingredient: Green onion, note: "including the green top, finely chopped" }
      - { qty: 1, measure: lb, ingredient: Crab, note: "lump, picked over for cartilage" }
      - { qty: "3/4", measure: cup, ingredient: Bread crumbs, note: "dry, divided" }
      - { qty: "1/4", measure: tsp, ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { ingredient: Smarter Tartar Sauce }
    directions:
      - Preheat the oven to 400 degrees F and coat a baking sheet with cooking spray.
      - Mix the egg, mustard, Worcestershire, lemon juice, Old Bay and hot sauce. Stir in the bell pepper and scallion. Gently fold in the crab, 1/4 cup of the bread crumbs, and salt and pepper to taste. Put the remaining crumbs in a shallow dish.
      - Divide into 8 mounds. Shape each into a round, coat in crumbs, set on the baking sheet and flatten to a patty about 1 inch high.
      - Bake until golden on the bottom, about 10 minutes. Flip gently and bake until the second side is golden, 5 to 10 minutes longer.

