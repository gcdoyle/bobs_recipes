    categories: [Soups, Beans]
    ingredients:
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: plus more for drizzling }
      - { qty: 1, ingredient: Onion, note: "medium, chopped" }
      - { qty: 2, ingredient: Carrot, note: peeled and chopped }
      - { qty: 2, measure: stalk, ingredient: Celery, note: chopped }
      - { qty: 2, measure: clove, ingredient: Garlic, note: chopped }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 1, measure: can, ingredient: Diced tomatoes, note: 14 1/2-ounce }
      - { qty: 1, measure: lb, ingredient: Lentils }
      - { qty: 11, measure: cup, ingredient: Chicken broth, note: low-salt }
      - { qty: 6, measure: sprig, ingredient: Thyme, note: "4 to 6, fresh" }
      - { qty: "2/3", measure: cup, ingredient: Elbow macaroni, note: dried }
      - { qty: 1, measure: cup, ingredient: Parmesan, note: shredded }
    directions:
