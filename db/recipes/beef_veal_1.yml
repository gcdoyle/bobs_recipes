    directions:
      - Brown the meat in hot oil. Add the water, Worcestershire, garlic, bay leaves, onion, salt, sugar, pepper, paprika, and allspice. Cover and simmer 1 1/2 hours.
      - Remove the bay leaves and garlic. Add the carrots and celery. Cover and cook 30 to 40 minutes longer.
      - To thicken the gravy, remove 2 cups of the hot liquid. In a separate bowl, combine 1/4 cup water and the cornstarch until smooth. Mix with a little of the hot liquid and return to the pot. Stir and cook until bubbly.

  - name: Beef Stew
    categories: [Beef, Stews]
    description:
      - From Food Network Kitchens. Beef chuck, from the shoulder, is the choice for any stew because of its marbling; if you can't find it cubed, buy a thick chuck steak and cut it into 2-inch cubes.
    ingredients:
      - { ingredient: Vegetable oil, note: for searing }
      - { qty: "2 1/2", measure: lb, ingredient: Beef chuck, note: cut into 2-inch cubes }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 2, measure: tbsp, ingredient: Unsalted butter }
      - { qty: 2, ingredient: Onion, note: "medium, cut into sixths" }
      - { qty: 5, measure: clove, ingredient: Garlic, note: crushed }
      - { qty: 1, measure: tbsp, ingredient: Tomato paste }
      - { qty: "1/3", measure: cup, ingredient: Flour, note: "all-purpose, or enough to coat" }
      - { qty: 10, measure: cup, ingredient: Water, note: "cold, or chicken or beef broth" }
      - { qty: 6, measure: sprig, ingredient: Parsley }
      - { qty: 6, measure: sprig, ingredient: Thyme, note: fresh }
      - { qty: 2, ingredient: Bay leaf }
      - { qty: "1 1/4", measure: lb, ingredient: Red potatoes, note: "medium, quartered" }
      - { qty: 4, ingredient: Carrot, note: "medium, cut into 2-inch pieces" }
      - { qty: 2, measure: stalk, ingredient: Celery, note: cut into 2-inch pieces }
      - { qty: 7, ingredient: Tomato, note: "canned whole peeled, lightly crushed" }
      - { qty: 2, measure: tsp, ingredient: Red wine vinegar, note: "2 to 3 teaspoons, or to taste" }
    directions:
      - Heat a large Dutch oven with a tight-fitting lid over medium-high heat. Pour in oil about 1/4 inch deep. Season the beef generously with salt and pepper. Saute half the meat, uncovered, stirring only occasionally, until well browned, about 8 minutes. Transfer to a plate with a slotted spoon and repeat. Discard the oil and wipe out the pan.
      - Preheat the oven to 325 degrees F. Melt the butter in the pot over medium-high heat. Add the onion and cook until lightly browned, about 5 minutes. Add the garlic and cook until fragrant, about 1 minute. Add the tomato paste and cook until lightly browned, about 1 minute more.
      - Add the beef, scatter the flour over to lightly coat, and cook, stirring, until lightly toasted. Add the water or broth and bring to a simmer. Tie the parsley, thyme, and bay leaves together with kitchen twine and add to the pot. Season with 2 teaspoons salt, or to taste. Cover and cook in the oven until the meat is just tender, about 1 1/2 hours (or simmer on the stove).
      - Skim the fat from the liquid. Add the potatoes, carrots, celery and tomatoes and bring to a simmer on top of the stove. Cook, uncovered, stirring occasionally, until the liquid thickens and the vegetables are tender, about 1 hour.
      - Discard the herb bundle. Stir in the vinegar and season with salt and pepper. Serve immediately.

  - name: Beef, Mushroom, and Broccoli Stir-Fry
    categories: [Beef, Asian]
    ingredients:
      - { qty: 1, measure: lb, ingredient: Flank steak }
      - { qty: 3, measure: tbsp, ingredient: Water }
      - { qty: 7, measure: tbsp, ingredient: Vegetable oil, note: divided }
      - { qty: 4, measure: tbsp, ingredient: Soy sauce, note: divided }
      - { qty: 8, measure: tsp, ingredient: Corn starch, note: divided }
      - { qty: 1, measure: cup, ingredient: Chicken broth, note: "canned low-salt, plus 6 tablespoons" }
      - { qty: "1/4", measure: cup, ingredient: White wine, note: "the source says just \"1/4\"" }
      - { qty: 2, measure: tbsp, ingredient: Oyster sauce }
      - { qty: 4, measure: tsp, ingredient: Sesame oil, note: Asian }
      - { qty: "1/2", measure: tsp, ingredient: Sugar }
      - { qty: 6, measure: slice, ingredient: Ginger, note: "quarter-size, peeled and minced" }
      - { qty: 2, measure: lb, ingredient: Broccoli, note: "cut into florets, stems discarded" }
      - { qty: 1, measure: lb, ingredient: Mushroom, note: sliced }
      - { ingredient: Rice, note: "steamed, for serving" }
    directions:
      - Cut the steak with the grain into 2-inch-wide pieces, then slice thinly across the grain. Combine 3 tablespoons water, 2 tablespoons vegetable oil, 2 tablespoons soy sauce, and 2 teaspoons cornstarch in a large bowl. Add the steak and stir to coat. Refrigerate at least 30 minutes.
      - Combine 6 tablespoons broth, the remaining 2 tablespoons soy sauce and 6 teaspoons cornstarch, the wine, oyster sauce, sesame oil and sugar in a small bowl, stirring to dissolve the cornstarch completely.
      - Heat 2 tablespoons vegetable oil in a wok or heavy large skillet over high heat. Add the steak with its marinade and stir-fry until no longer pink, about 2 minutes. Transfer to a platter.
      - Add 2 tablespoons vegetable oil to the wok. Add the ginger and stir until aromatic, about 30 seconds. Add the broccoli and stir-fry 1 minute. Add 1 cup broth, cover, reduce the heat and simmer 2 1/2 minutes. Transfer the broccoli to a bowl.
      - Add 1 tablespoon vegetable oil to the wok. Add the mushrooms and cook 2 minutes. Return the steak and broccoli to the wok. Stir the sauce, add to the wok and stir until it thickens, about 30 seconds. Serve immediately with steamed rice.

  - name: Beef Stroganoff for Noodles
    categories: [Beef]
    prep_time: 5
    cooking_time: 30
    servings: 4
    description:
      - Recipe courtesy of Michele Urvater.
    ingredients:
      - { qty: 1, measure: lb, ingredient: Beef tenderloin, note: "filet mignon or mignon tips, cut 2 inches long and 1/4 inch wide" }
      - { qty: 3, measure: tbsp, ingredient: Butter }
      - { qty: 1, ingredient: Onion, note: "small, finely chopped" }
      - { qty: 1, measure: lb, ingredient: Mushroom, note: "domestic or wild, caps only, thinly sliced" }
      - { qty: "1/2", measure: cup, ingredient: Beef broth }
      - { qty: 1, measure: tbsp, ingredient: Dijon mustard }
      - { qty: "1/4", measure: cup, ingredient: Heavy cream }
      - { qty: "1/2", measure: cup, ingredient: Sour cream }
      - { qty: 2, measure: tsp, ingredient: Flour }
      - { qty: 2, measure: tbsp, ingredient: Dill, note: "fresh, minced" }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: minced }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 8, measure: oz, ingredient: Egg noodles, note: "medium, cooked" }
    directions:
      - Heat a large nonstick skillet over high heat and sear the meat on all sides for about a minute, working in small batches so it doesn't give off liquid. Remove to a plate.
      - In a clean wide skillet, heat the butter. Sweat the onions, add the mushrooms and saute until deep golden, about 20 minutes. Meanwhile, blend the broth, mustard, heavy cream and sour cream together.
      - Lower the heat, add the flour and cook, stirring, for a minute. Whisk in the liquids and any meat juices and simmer, without boiling, until the sauce thickens, about 5 minutes.
      - Return the meat to the sauce and heat, without boiling, until warmed through. Season with salt and pepper, stir in the dill and parsley, and spoon over the noodles.
