  - name: Tomato Red Sauce (Gravy)
    categories: [Sauces, Pork, Pasta]
    description:
      - A pork and tomato Sunday gravy made with Chianti. Simmer 2 hours.
    ingredients:
      - { qty: 1, ingredient: Pork shoulder, note: pork butt or shoulder }
      - { ingredient: Salt, note: gray }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1/2", measure: cup, ingredient: Olive oil }
      - { qty: 1, ingredient: Carrot, note: chopped }
      - { qty: 1, measure: stalk, ingredient: Celery, note: chopped }
      - { qty: 1, ingredient: Onion, note: chopped }
      - { qty: 1, measure: tbsp, ingredient: Rosemary, note: "fresh leaves, minced" }
      - { qty: 4, measure: clove, ingredient: Garlic, note: minced }
      - { ingredient: Red wine, note: "Chianti, 1 1/2 glasses" }
      - { qty: 1, measure: can, ingredient: Tomato paste, note: small }
      - { qty: 4, measure: can, ingredient: Diced tomatoes, note: 28-ounce chopped tomatoes }
    directions:
      - Cut the pork into roughly 1-inch cubes and season with salt and pepper.
      - Heat the oil in a large soup pot over medium-high heat and brown the pork on all sides, about 2 minutes more after turning. Set aside in a bowl.
      - In the same pot saute the carrot, celery, onion and garlic with a pinch of salt until lightly browned. Stir in the rosemary and return the pork.
      - Add the Chianti and bring to a boil, then add the tomato paste and tomatoes. Simmer 2 hours, skimming off scum occasionally.

  - name: Summer Stuffed Tomatoes
    categories: [Vegetables]
    servings: 2
    ingredients:
      - { qty: 2, ingredient: Tomato, note: large }
      - { qty: 1, measure: tbsp, ingredient: Olive oil }
      - { qty: "1/4", measure: cup, ingredient: Onion, note: chopped }
      - { qty: 2, measure: tsp, ingredient: Garlic, note: minced }
      - { qty: 1, ingredient: Zucchini, note: "small, diced" }
      - { qty: 1, ingredient: Yellow squash, note: "small, diced" }
      - { qty: 2, measure: tsp, ingredient: Basil, note: "chopped, divided" }
      - { qty: "1/2", measure: tsp, ingredient: Thyme, note: chopped }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 2, measure: tbsp, ingredient: Parmesan, note: freshly grated }
    directions:
      - Preheat the oven to 450 degrees F.
      - Cut the top 1/2 inch off the tomatoes and finely chop the tops. Scoop out the seeds, juice and pulp, leaving 1/2-inch shells. Lightly salt the insides and rest cut side down on paper towels.
      - Heat the oil in a skillet over medium heat and cook the onions until soft, about 5 minutes. Add the garlic for 30 seconds, then the chopped tomato tops, zucchini and squash and saute until just soft and most of the juice has evaporated, about 3 minutes.
      - Stir in 1 teaspoon basil and the thyme, season and cool slightly.
      - Set the shells in an oiled baking dish and spoon in the filling, letting any extra spill into the pan. Top each with 1 tablespoon cheese.
      - Bake on the upper rack until heated through, tender and the cheese is turning golden, about 10 minutes. Garnish with the remaining basil and serve hot.
