    ingredients:
      - { qty: 1, measure: lb, ingredient: Chicken gizzards }
      - { qty: 24, measure: oz, ingredient: Italian dressing, note: any type }
      - { qty: 6, measure: oz, ingredient: Beer, note: half a 12-ounce bottle }
      - { qty: "1/4", measure: cup, ingredient: White wine }
      - { qty: "1/2", ingredient: White onion, note: minced }
      - { qty: 4, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 1, measure: tbsp, ingredient: Steak sauce, note: A-1 }
      - { qty: 1, measure: tbsp, ingredient: Worcestershire sauce }
      - { qty: 1, measure: tbsp, ingredient: Pickapeppa sauce }
      - { qty: 1, measure: tbsp, ingredient: Soy sauce }
      - { qty: 2, measure: tbsp, ingredient: White wine vinegar }
      - { qty: 1, measure: tsp, ingredient: Creole seasoning, note: "Tony Chachere's" }
