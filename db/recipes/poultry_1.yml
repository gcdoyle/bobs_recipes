  - name: Arroz con Pollo with Chorizo
    categories: [Cuban, Poultry, Rice]
    ingredients:
      - { qty: 1, ingredient: Chicken, note: "3 pounds, cut into 10 serving pieces" }
      - { qty: 4, measure: tbsp, ingredient: Olive oil, note: divided }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 4, measure: tsp, ingredient: Ground cumin }
      - { qty: "1 1/2", measure: tbsp, ingredient: Oregano, note: dried }
      - { qty: 2, measure: tsp, ingredient: Paprika, note: sweet }
      - { qty: "1/2", measure: tsp, ingredient: Cayenne pepper }
      - { qty: 2, ingredient: Chorizo, note: "dried sausages, about 1 1/4 pounds, cut into 1-inch chunks" }
      - { qty: 1, ingredient: Onion, note: "Spanish, chopped" }
      - { qty: 2, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 1, ingredient: Red bell pepper, note: seeded and chopped }
      - { qty: 2, ingredient: Bay leaf }
      - { qty: 2, measure: cup, ingredient: Long grain rice, note: white }
      - { qty: 1, measure: can, ingredient: Diced tomatoes, note: "15-ounce, with liquid" }
      - { qty: 3, measure: cup, ingredient: Chicken broth, note: "low-sodium, warm" }
      - { qty: 1, measure: cup, ingredient: Green olives, note: pimento-stuffed }
    directions:
      - Preheat the oven to 350 degrees F.
      - Rinse the chicken and pat dry. Blend 2 tablespoons oil with salt, pepper, cumin, oregano, paprika and cayenne. Rub each piece with the paste and refrigerate at least 20 minutes.
      - In a heavy ovenproof casserole with a lid, heat the remaining 2 tablespoons oil. Fry the chorizo over medium heat until crispy and its fat renders. Drain on paper towels.
      - Brown the chicken skin side down, then on all sides, about 10 minutes. Set aside.
      - Make a sofrito by sauteing the onion, garlic, bell pepper and bay leaves until very soft and almost dissolved. Stir in the rice to coat the grains.
      - Add the tomatoes and broth and season with salt and pepper. Return the chorizo and chicken, bring to a boil and simmer 5 minutes.
      - Cover and bake 20 minutes, until the chicken is done and the rice is tender and has absorbed the liquid. Scatter the olives on top before serving.

  - name: Chicken and Yellow Rice (Arroz con Pollo)
    categories: [Cuban, Poultry, Rice]
    ingredients:
      - { qty: 1, ingredient: Chicken, note: "3 pounds, cut into 8 pieces, skin removed" }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
      - { qty: 1, ingredient: Lime, note: juiced }
      - { qty: "1/2", measure: cup, ingredient: Olive oil, note: pure Spanish }
      - { qty: 1, ingredient: Onion, note: small dice }
      - { qty: 1, ingredient: Green bell pepper, note: small dice }
      - { qty: 1, ingredient: Roasted red pepper, note: small dice }
      - { qty: 3, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 1, measure: cup, ingredient: Tomato sauce, note: prepared }
      - { qty: 1, measure: tsp, ingredient: Ground cumin }
      - { qty: 1, ingredient: Bay leaf }
      - { qty: "1/2", measure: cup, ingredient: White wine, note: dry }
      - { qty: 12, measure: oz, ingredient: Beer }
      - { qty: "1/2", measure: cup, ingredient: Sherry }
      - { qty: 3, measure: cup, ingredient: Chicken stock }
      - { qty: "1 1/2", measure: cup, ingredient: Valencia rice, note: soaked in cold water for 1 hour }
      - { qty: 5, ingredient: Saffron, note: threads }
      - { qty: 1, measure: cup, ingredient: Pea, note: frozen sweet peas }
    directions:
      - Preheat the oven to 350 degrees F.
      - Season the chicken with salt, pepper, and lime juice. Heat the olive oil in a large casserole or Dutch oven, brown the chicken and set aside.
      - Cook the onions, peppers, and garlic until translucent. Add the tomato sauce, cumin, and bay leaf and cook 5 minutes.
      - Add the chicken, wine, beer, and sherry and cook 5 to 8 minutes. Add the stock, bring to a boil and adjust the seasoning. Add the drained rice and the saffron.
      - Bring to a boil, cover, and bake 20 minutes.
      - Add the peas, fluffing the rice to mix them in. Serve hot.

  - name: Chicken Boudine
    categories: [Poultry, Casseroles]
    description:
      - Recipe courtesy Paula Deen.
    ingredients:
      - { qty: 2, measure: cup, ingredient: Egg noodles, note: cooked }
      - { qty: 2, measure: can, ingredient: Cream of mushroom soup, note: 10 3/4-ounce }
      - { qty: "1/2", measure: cup, ingredient: Chicken broth }
      - { qty: "1/4", measure: cup, ingredient: Sherry, note: dry }
      - { qty: 4, measure: cup, ingredient: Chicken, note: "cooked, chopped" }
      - { qty: 3, measure: cup, ingredient: Sharp cheddar cheese, note: "or other sharp cheese, grated, divided" }
      - { qty: "2 1/4", measure: oz, ingredient: Almond, note: "slivered, toasted (1 package)" }
      - { qty: "1/4", measure: cup, ingredient: Pimentos, note: "drained, chopped" }
      - { qty: 1, measure: can, ingredient: Mushroom, note: "4-ounce can sliced, drained" }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
    directions:
      - Preheat the oven to 350 degrees F.
      - In a large bowl, toss the noodles, soup, broth, and sherry. Add the chicken, 2 cups of the cheese, the almonds, pimento, mushrooms, and salt and pepper to taste and toss gently.
      - Transfer to a greased 13 by 9 by 2-inch casserole and top with the remaining cup of cheese. Bake 30 minutes, until bubbly.

  - name: Chicken Cacciatore
    categories: [Poultry]
    ingredients:
      - { qty: 4, ingredient: Chicken thigh }
      - { qty: 2, ingredient: Chicken breast, note: "with skin and backbone, halved crosswise" }
      - { qty: 2, measure: tsp, ingredient: Salt, note: plus more to taste }
      - { qty: 1, measure: tsp, ingredient: Black pepper, note: "freshly ground, plus more to taste" }
      - { qty: "1/2", measure: cup, ingredient: Flour, note: "all-purpose, for dredging" }
      - { qty: 3, measure: tbsp, ingredient: Olive oil }
      - { qty: 1, ingredient: Red bell pepper, note: "large, chopped" }
      - { qty: 1, ingredient: Onion, note: chopped }
      - { qty: 3, measure: clove, ingredient: Garlic, note: finely chopped }
      - { qty: "3/4", measure: cup, ingredient: White wine, note: dry }
      - { qty: 1, measure: can, ingredient: Diced tomatoes, note: "28-ounce, with juice" }
      - { qty: "3/4", measure: cup, ingredient: Chicken broth, note: reduced-sodium }
      - { qty: 3, measure: tbsp, ingredient: Capers, note: drained }
      - { qty: "1 1/2", measure: tsp, ingredient: Oregano, note: dried leaves }
      - { qty: "1/4", measure: cup, ingredient: Basil, note: "fresh leaves, coarsely chopped" }
    directions:
      - Sprinkle the chicken with 1 teaspoon each salt and pepper and dredge lightly in the flour.
      - Heat the oil in a large heavy saute pan over medium-high heat and brown the chicken, about 5 minutes per side, in 2 batches if needed. Set aside.
      - Saute the bell pepper, onion and garlic over medium heat until the onion is tender, about 5 minutes. Season with salt and pepper. Add the wine and simmer until reduced by half, about 3 minutes.
      - Add the tomatoes and juice, broth, capers and oregano. Return the chicken, turn to coat and bring to a simmer. Simmer over medium-low until just cooked through, about 20 minutes for the thighs and 30 for the breasts.
      - Transfer the chicken to a platter. Boil the sauce until slightly thickened if needed, about 3 minutes, and skim the fat. Spoon over the chicken and sprinkle with basil.

  - name: Chicken Chasseur
    categories: [Poultry]
    description:
      - Hunter-style chicken. Recipe courtesy Bobby Flay.
    ingredients:
      - { qty: 1, ingredient: Chicken, note: "4 pounds, quartered" }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
      - { ingredient: Clarified butter }
      - { qty: 5, measure: oz, ingredient: Cremini mushroom, note: thinly sliced }
      - { qty: 1, ingredient: Shallot, note: "large, finely diced" }
      - { qty: 2, measure: oz, ingredient: Cognac }
      - { qty: 2, measure: oz, ingredient: White wine, note: dry }
      - { qty: "1 1/2", measure: cup, ingredient: Chicken stock, note: enriched }
      - { qty: "1/4", measure: cup, ingredient: Tomato, note: "concasse (peeled, seeded and diced)" }
      - { qty: 1, measure: oz, ingredient: Butter, note: cold }
      - { qty: 1, measure: tsp, ingredient: Tarragon, note: "fresh leaves, finely chopped" }
      - { qty: 1, measure: tsp, ingredient: Chervil, note: "fresh leaves, finely chopped, or flat-leaf parsley" }
    directions:
      - Preheat the oven to 375 degrees F.
      - Season the chicken on both sides with salt and pepper. Heat a few tablespoons of clarified butter in a Dutch oven over high heat. Brown the chicken skin side down, then the other side. Move to a baking sheet and bake until just cooked through, 12 to 15 minutes.
      - Pour off all but 2 tablespoons of fat. Season and saute the mushrooms until golden brown, add the shallots and cook 30 seconds.
      - Off the heat, add the Cognac and cook until completely reduced; repeat with the wine. Add the stock and tomato and simmer until the sauce coats the back of a spoon.
      - Swirl in the cold butter; don't reduce the sauce after this or it will break. Season and stir in the tarragon and chervil.
      - Rest the chicken 5 minutes. Remove the breastbone and cut each breast in 2 on the bias; cut the legs in 2 at the joint and remove the thighbones. Serve 1 leg piece and 1 breast piece per plate (only one with a bone), on hot plates with the sauce.

  - name: Bob's Braised Chicken Thighs
    categories: [Poultry]
    description:
      - Serve over rice or pasta topped with a fried egg.
    ingredients:
      - { qty: 5, ingredient: Chicken thigh, note: 4 to 5 }
      - { qty: 1, measure: tbsp, ingredient: Anise seed }
      - { qty: 1, measure: tbsp, ingredient: Oregano }
      - { ingredient: Garlic, note: cloves }
      - { qty: 1, measure: can, ingredient: Diced tomatoes, note: "14-ounce, diced or stewed" }
      - { qty: "1/2", measure: cup, ingredient: White wine }
      - { qty: 1, ingredient: Mushroom, note: "box, sliced" }
      - { ingredient: Black olive, note: pitted }
      - { ingredient: Adobo seasoning, note: Goya with cumin }
      - { qty: 1, ingredient: Onion, note: "large, frenched" }
      - { qty: 2, measure: stalk, ingredient: Celery, note: "1 to 2, diced" }
      - { qty: 1, measure: can, ingredient: Tomato sauce, note: 8-ounce }
      - { qty: 1, ingredient: Jalapeno, note: "small, julienned, or 1/2 cup hot or medium picante sauce" }
      - { qty: "1/2", ingredient: Green bell pepper, note: "large, julienned" }
      - { measure: dash, ingredient: Worcestershire sauce }
      - { ingredient: Black pepper, note: freshly ground }
      - { ingredient: Parsley }
      - { ingredient: Olive oil }
    directions:
      - Brown the thighs skin side down in olive oil, then remove and hold. Drain the excess fat.
      - Add the onions, green pepper, celery and jalapeno and sweat until just beginning to soften. Add the mushrooms and garlic.
      - After a few minutes, add the tomatoes, tomato sauce, picante (if using), olives, wine, anise seed, oregano, Worcestershire and pepper.
      - Add the thighs and parsley, cover and simmer 30 to 45 minutes.

  - name: Chicken Cordon Bleu
    categories: [Poultry]
    servings: 4
    ingredients:
      - { qty: 4, ingredient: Chicken breast, note: "double breasts, about 7 ounces each, skinless and boneless" }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 8, measure: slice, ingredient: Ham, note: "thin, deli" }
      - { qty: 16, measure: slice, ingredient: Gruyere cheese, note: "thin, or Swiss" }
      - { qty: 2, measure: tsp, ingredient: Thyme, note: fresh leaves }
      - { qty: "1/4", measure: cup, ingredient: Flour }
      - { qty: 1, measure: cup, ingredient: Panko }
      - { qty: 1, measure: tsp, ingredient: Olive oil }
      - { qty: 2, ingredient: Egg }
      - { qty: 2, measure: tsp, ingredient: Water }
    directions:
      - Preheat the oven to 350 degrees F. Gently pound the chicken between sheets of plastic wrap to 1/4 inch thick, taking care not to tear it.
      - Layer 2 slices of cheese, 2 of ham and 2 more of cheese on each breast, leaving a 1/2-inch margin. Tuck in the sides and roll up tight like a jelly roll, squeezing gently to seal.
      - Season the flour with salt and pepper. Mix the bread crumbs with the thyme, salt, pepper and oil (it helps the crust brown). Beat the eggs and water until fluid.
      - Dust the rolls with flour, dip in the egg and coat gently in the crumbs. Bake in a baking pan 20 minutes, until browned and cooked through. Cut into pinwheels to serve.

  - name: Garlic Chicken in Casserole with Israeli Couscous
    categories: [Poultry]
    prep_time: 30
    cooking_time: 100
    servings: 6
    description:
      - Recipe courtesy Anne Burrell. Serves 6 to 8.
      - "Inactive prep: 1 hour."
    ingredients:
      - { qty: 2, measure: head, ingredient: Garlic, note: whole bulbs }
      - { qty: 1, ingredient: Lemon, note: zested and juiced }
      - { qty: 1, measure: bunch, ingredient: Thyme, note: "large, leaves only" }
      - { qty: 1, measure: tbsp, ingredient: Cumin seeds, note: toasted and ground }
      - { qty: 1, measure: pinch, ingredient: Red pepper flakes, note: crushed }
      - { ingredient: Kosher salt }
      - { ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, ingredient: Chicken, note: "4 to 5 pounds, cut into 8 to 10 parts" }
      - { qty: 2, measure: cup, ingredient: Couscous, note: medium-size Israeli }
      - { qty: 1, ingredient: Onion, note: "large, sliced" }
      - { qty: 3, measure: rib, ingredient: Celery, note: sliced thin on the bias }
      - { qty: 1, measure: pinch, ingredient: Red pepper flakes, note: "crushed, for the couscous" }
      - { qty: "1 1/2", measure: cup, ingredient: White wine, note: dry }
      - { qty: 3, measure: tbsp, ingredient: Tomato paste }
      - { qty: 1, measure: pinch, ingredient: Saffron, note: large pinch }
      - { qty: 2, ingredient: Zucchini, note: "green part only, cut into 1/2-inch dice" }
      - { qty: 3, measure: cup, ingredient: Chicken stock, note: 2 to 3 cups }
      - { qty: "1/2", measure: cup, ingredient: Pine nuts, note: toasted }
      - { qty: 3, ingredient: Green onion, note: "white and green, sliced thinly on the bias" }
    directions:
      - Preheat the oven to 375 degrees F. Roast the garlic bulbs in a small tin until soft when squeezed, about 30 minutes. Let cool.
      - Slice the tops off and squeeze out the garlic. Mash or puree it with the lemon zest and juice, thyme, cumin, crushed red pepper, salt to taste and a little olive oil into a loose paste. Massage it all over the chicken and let sit at least 1 hour.
      - Cook the couscous in well-salted boiling water until about 2/3 cooked, 5 to 6 minutes. Drain and reserve.
      - Coat a large saute pan with olive oil over medium-high heat and brown the chicken on all sides. Remove it, drain the fat and add the onions and celery. Season with salt and the crushed red pepper.
      - Deglaze with the wine, scraping up the bottom, and cook 7 to 8 minutes. Stir in the tomato paste and cook 2 minutes. Add the saffron, zucchini, couscous and stock, stir, and adjust the seasoning.
      - Transfer to an ovenproof dish and nestle the chicken in skin side up, adding more stock to keep it moist. Sprinkle with pine nuts, cover with foil and set on a sheet pan.
      - Roast 20 minutes covered, then 10 to 15 minutes uncovered. Top with scallions before serving.

  - name: Balsamic Chicken Drumettes
    categories: [Poultry]
    description:
      - Brushing on the reduced marinade helps the flavors along, and re-moistening helps the parsley and seeds stick. The rosemary and garlic stay in the background.
    ingredients:
      - { qty: "1/2", measure: cup, ingredient: Balsamic vinegar }
      - { qty: "1/2", measure: cup, ingredient: Honey }
      - { qty: "1/2", measure: cup, ingredient: Brown sugar }
      - { qty: "1/4", measure: cup, ingredient: Soy sauce }
      - { qty: 5, measure: sprig, ingredient: Rosemary }
      - { qty: 5, measure: clove, ingredient: Garlic, note: halved }
      - { qty: 12, ingredient: Chicken drumsticks, note: 10 to 12 }
      - { qty: 2, measure: tbsp, ingredient: Sesame seeds, note: toasted }
      - { qty: "1/4", measure: cup, ingredient: Parsley, note: "fresh flat-leaf, chopped" }
    directions:
      - Combine the balsamic, honey, brown sugar, soy sauce, rosemary and garlic in a large resealable bag and squeeze until the honey and sugar dissolve. Add the drumsticks, seal with little air and refrigerate 2 hours.
      - Preheat the oven to 450 degrees F. Bake the drumsticks on a foil-lined baking sheet until caramelized and very dark in spots, 30 to 35 minutes.
      - Meanwhile, bring the marinade to a boil in a small saucepan, then simmer over low heat until thick, about 15 minutes.
      - Brush the chicken with the cooked marinade and sprinkle with the sesame seeds and parsley.

