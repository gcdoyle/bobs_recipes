  - name: Ring of Fire Grilled Chicken
    categories: [Poultry, BBQ]
    prep_time: 30
    cooking_time: 20
    servings: 4
    description:
      - Recipe courtesy Alton Brown, 2010.
      - "Special equipment: 2 sheets of newspaper, vegetable oil, 2 to 3 pounds natural chunk charcoal, a chimney starter, 8 feet of heavy-duty aluminum foil and 2 aluminum pie pans."
      - "Inactive prep: 2 hours."
    ingredients:
      - { qty: 1, ingredient: Chicken, note: "broiler-fryer, 4 to 5 pounds" }
      - { qty: 1, measure: qt, ingredient: Water }
      - { qty: "1/2", measure: cup, ingredient: Honey }
      - { qty: "3 1/2", measure: oz, ingredient: Kosher salt, note: about 3/4 cup }
      - { qty: 1, measure: tbsp, ingredient: Curry powder }
      - { qty: 1, measure: tbsp, ingredient: Chili powder }
      - { qty: 2, measure: tsp, ingredient: Cocoa powder }
      - { qty: 1, measure: tsp, ingredient: Adobo seasoning, note: "powder, without pepper" }
      - { qty: 1, measure: tsp, ingredient: Ground cumin }
      - { qty: 1, measure: tsp, ingredient: Smoked paprika, note: hot }
    directions:
      - Cut up the chicken into 2 wings, 2 thighs, 2 drumsticks and 2 boneless breasts with the drumettes attached. Freeze the carcass for stock or discard.
      - Put the pieces in a 1-gallon resealable bag with the water, honey and salt. Seal and move it around vigorously 1 to 2 minutes to dissolve. Refrigerate in a leak-proof container 1 1/2 hours.
      - Meanwhile, combine the curry powder, chili powder, cocoa, adobo, cumin and paprika in another 1-gallon bag.
      - Pat the chicken very dry with paper towels; don't rinse. Shake the pieces in the spice bag to coat and rest on a rack over a half sheet pan 30 minutes.
      - Spritz 2 sheets of newspaper with oil, put them in the bottom of a chimney starter, fill it with 2 to 3 pounds of chunk charcoal and set it on the kettle's charcoal grate until hot and ashy, 15 to 20 minutes. Make a ring of heavy-duty foil with a 9-inch center, set it over the chimney and lay it on the grate.
      - Spread the hot coals evenly outside the ring and set a pie pan in the center to catch drippings. Heat the cooking grate 2 to 3 minutes and oil it lightly.
      - Arrange the chicken skin side down over the coals. Give the legs a quarter turn every 3 to 4 minutes and turn the thighs, wings and breasts after 4 to 5 minutes; the skin should blister and darken. Rotate the grate to avoid flare-ups.
      - After 9 to 10 minutes, move the breasts to the center and cover with the second pie pan. After 10 to 11 minutes, put the wings on top of the pan and lean the thighs and legs against it away from direct heat, turning every 2 minutes. Move finished pieces on top of the pan.
      - After 18 to 20 minutes total, check that the deepest part of each piece reads 155 degrees F. Cover with a towel in a bowl and rest 5 minutes before serving.

  - name: Maple and Cayenne Glazed Chicken
    categories: [Poultry]
    prep_time: 20
    cooking_time: 40
    servings: 4
    description:
      - Recipe courtesy Anne Burrell.
    ingredients:
      - { qty: 2, ingredient: Chicken, note: "3 pounds each, wing tips, spine and breast plate removed, cut in half" }
      - { ingredient: Olive oil, note: extra-virgin }
      - { ingredient: Kosher salt }
      - { qty: 1, measure: cup, ingredient: Maple syrup, note: real }
      - { qty: 2, measure: tsp, ingredient: Cayenne pepper }
    directions:
      - Preheat the oven to 400 degrees F.
      - Poke the end of each drumstick through a small hole in the extra skin on the leg to make a neat package. Toss the chicken with olive oil and salt and arrange on a parchment- or silpat-lined sheet tray.
      - Roast until about 3/4 done and the skin starts to brown and crisp, 20 to 25 minutes.
      - Meanwhile, reduce the maple syrup and cayenne in a small saucepan over medium heat by 1/2 to 3/4, until very thick.
      - Brush the chicken generously with the syrup and roast another 10 to 12 minutes, brushing 1 or 2 more times, until the skin is very dark and sticky. Cover loosely with foil if it gets too dark. Rest 10 minutes before serving.

  - name: Chicken Marsala
    categories: [Poultry]
    servings: 2
    description:
      - Recipe courtesy Emeril Lagasse. Uses Emeril's Essence Creole Seasoning (its own recipe).
    ingredients:
      - { qty: "1/2", measure: cup, ingredient: Flour, note: all-purpose }
      - { qty: 1, measure: tbsp, ingredient: Creole seasoning, note: Emeril's Essence }
      - { qty: 2, ingredient: Chicken breast, note: "boneless skinless, 6 to 8 ounces, halved and pounded thin" }
      - { qty: 1, measure: tbsp, ingredient: Olive oil }
      - { qty: 4, measure: tbsp, ingredient: Butter, note: divided }
      - { qty: 3, measure: cup, ingredient: Mushroom, note: "sliced (cremini, oyster, shiitake)" }
      - { qty: "3/4", measure: cup, ingredient: Marsala wine }
      - { qty: 1, measure: cup, ingredient: Chicken stock }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { ingredient: Chives, note: "chopped, for garnish" }
    directions:
      - Combine the flour and Essence. Quickly dredge the chicken, shaking off the excess.
      - Heat the oil in a large skillet over medium-high heat until very hot. Add 1 tablespoon butter and cook the chicken until golden, about 3 minutes per side. Set aside.
      - Add another tablespoon of butter and the mushrooms and cook, stirring, until golden at the edges and their liquid is released.
      - Add the Marsala, bring to a boil and scrape up the browned bits. When reduced by half, add the stock and cook 3 minutes, until slightly thickened.
      - Lower to medium, return the chicken and cook until cooked through and the sauce thickens, 5 to 6 minutes. Swirl in the remaining 2 tablespoons butter, season, garnish with chives and serve immediately.

  - name: Creamy Chicken and Noodles
    categories: [Poultry, Pasta]
    prep_time: 15
    cooking_time: 30
    servings: 4
    description:
      - Recipe courtesy Rachael Ray. The sauce makes ahead well; bring it to room temperature before reheating over medium heat, and cook the noodles right before serving.
    ingredients:
      - { qty: 3, measure: tbsp, ingredient: Butter }
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: 12, measure: oz, ingredient: Mushroom, note: "white, sliced" }
      - { qty: 2, measure: tbsp, ingredient: Thyme, note: "fresh, finely chopped" }
      - { qty: 2, ingredient: Leek, note: thinly sliced }
      - { qty: 1, ingredient: Carrot, note: "small, finely chopped" }
      - { qty: 1, measure: rib, ingredient: Celery, note: "small, finely chopped" }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 3, measure: tbsp, ingredient: Flour, note: all-purpose }
      - { qty: "1/2", measure: cup, ingredient: White wine, note: dry }
      - { qty: 2, measure: cup, ingredient: Chicken stock, note: 1 1/2 to 2 cups }
      - { qty: "1/2", measure: cup, ingredient: Heavy cream }
      - { ingredient: Nutmeg, note: a few grates }
      - { qty: 3, measure: cup, ingredient: Chicken, note: "2 to 3 cups cooked poached breast or rotisserie chicken, pulled or chopped" }
      - { qty: "1/2", measure: lb, ingredient: Egg noodles, note: extra-wide }
      - { qty: 2, measure: tbsp, ingredient: Dijon mustard }
      - { qty: 2, measure: tbsp, ingredient: Dill, note: "fresh, chopped, or tarragon" }
    directions:
      - Heat the butter and olive oil in a large deep skillet over medium to medium-high heat and lightly brown the mushrooms, 10 to 12 minutes.
      - Stir in the thyme, leeks, carrot and celery, season with salt and pepper and cook, partially covered, until soft, 10 minutes.
      - Sprinkle in the flour and stir 1 minute, then add the wine and let it absorb. Add the stock and bring to a bubble. Stir in the cream, season with a little nutmeg and let it thicken a bit. Add the chicken and heat through.
      - Cook the noodles in salted boiling water to al dente. Stir the mustard into the chicken, then toss with the noodles and herbs.
