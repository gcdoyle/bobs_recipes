# Recipes from "Poultry & Game.txt", part 1. Already in from other files:
# Daisy Martinez's Arroz con Pollo (as "Arroz con Pollo"), The Ultimate Jerk
# Chicken, Jamaican Jerk Chicken, Cheryl Smith's Jerk Chicken.
recipes:
  - name: Chicken in Garlic Sauce (Pollo al Ajillo)
    categories: [Poultry]
    description:
      - Recipe courtesy Daisy Martinez. Thighs won't dry out; a paella pan's wide, shallow shape is handy here. In a smaller Dutch oven, brown in batches and rotate the pieces as they simmer so they cook evenly.
    ingredients:
      - { qty: 12, ingredient: Chicken thigh, note: "large, about 4 pounds" }
      - { ingredient: Sea salt, note: "fine, or kosher salt" }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1/4", measure: cup, ingredient: Canola oil }
      - { qty: 10, measure: clove, ingredient: Garlic, note: sliced }
      - { qty: 2, measure: tsp, ingredient: Thyme, note: "fresh leaves, chopped" }
      - { qty: "1/2", measure: cup, ingredient: Sherry, note: dry }
      - { qty: "1/2", measure: cup, ingredient: Chicken broth, note: homemade or canned }
    directions:
      - Wash the chicken thighs and pat dry. Season generously with salt and pepper. Heat the oil in a large heavy skillet over medium-high heat and add as many thighs, skin side down, as fit without touching.
      - Cook until the skin is golden brown, about 10 minutes. Flip and cook until the other side is golden, about 5 minutes more.
      - Off the heat, spoon off all but about 2 tablespoons of fat, leaving the brown bits. Return to low heat, stir in the garlic and thyme and cook until the garlic starts to turn golden, 1 to 2 minutes.
      - Pour in the sherry, raise to medium and boil a minute or 2. Return the chicken skin side up, reduce to low, pour in the broth and bring to a simmer. Cover tightly and cook 20 minutes.
      - Flip the chicken (or rotate top to bottom in a smaller pan) and cook until very tender, about 20 minutes. Serve hot.
    notes:
      - "For white and dark meat, use a 4-pound chicken cut into 10 pieces: let the thighs, drumsticks and wings cook in the sauce 15 minutes before adding the browned breast pieces. For all white meat, cut the breasts in half crosswise, brown them, and let the sauce cook down 10 to 15 minutes before adding them."

  - name: Michael's Manly Chicken Stew
    categories: [Poultry, Stews]
    description:
      - Contributed by Michael Symon. "There's nothing like chicken stew on a wet spring day." The file's last step only lists its ingredients (the chicken, peas, seasoning, tarragon, nutmeg and biscuits) without wording.
    ingredients:
      - { qty: 5, measure: lb, ingredient: Chicken, note: "whole, roasted and picked" }
      - { qty: 8, measure: tbsp, ingredient: Unsalted butter, note: 1 stick }
      - { qty: 3, measure: clove, ingredient: Garlic }
      - { qty: "3/4", measure: cup, ingredient: Flour }
      - { qty: 12, measure: cup, ingredient: Chicken stock }
      - { qty: 4, measure: cup, ingredient: Leek, note: "white part only, small diced" }
      - { qty: 2, measure: cup, ingredient: Carrot, note: small diced }
      - { qty: 2, measure: cup, ingredient: Celery, note: small diced }
      - { qty: 2, measure: cup, ingredient: Pea }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1/4", measure: cup, ingredient: Tarragon, note: roughly chopped }
      - { measure: dash, ingredient: Nutmeg, note: optional }
      - { qty: 1, measure: tbsp, ingredient: Olive oil }
      - { ingredient: Buttermilk Biscuits, note: for serving }
    directions:
      - Place a Dutch oven over medium heat. When hot, add the butter, garlic, carrots and celery with a large pinch of salt and the olive oil. Sweat until tender, about 8 minutes.
      - Whisk in the flour, then add the chicken stock. Bring to a gentle boil, stirring occasionally, until slightly thickened.
      - Season with salt and pepper, add the leeks and simmer 10 minutes.
      - Add the chicken and peas, season with salt, pepper, tarragon and a dash of nutmeg if you like, and serve with biscuits.

  - name: Buffalo Wings
    categories: [Poultry]
    prep_time: 15
    cooking_time: 40
    servings: 4
    description:
      - Recipe courtesy Alton Brown, 2007. 4 appetizer servings. Steamed, chilled, then roasted.
      - "Inactive prep: 1 hour."
    ingredients:
      - { qty: 12, ingredient: Chicken wings, note: whole }
      - { qty: 3, measure: oz, ingredient: Unsalted butter }
      - { qty: 1, measure: clove, ingredient: Garlic, note: "small, minced" }
      - { qty: "1/4", measure: cup, ingredient: Hot sauce }
      - { qty: "1/2", measure: tsp, ingredient: Kosher salt }
    directions:
      - Bring 1 inch of water to a boil in a covered 6-quart saucepan fitted with a steamer basket.
      - Remove the wing tips (discard or save for stock) and separate the wings at the joint. Steam, covered, over medium heat for 10 minutes. Pat dry, lay on a cooling rack set in a paper-towel-lined half sheet pan and refrigerate 1 hour.
      - Preheat the oven to 425 degrees F. Replace the paper towels with parchment and roast on the middle rack 20 minutes. Turn and roast another 20 minutes, until cooked through and golden.
      - While they roast, melt the butter with the garlic and stir with the hot sauce and salt in a bowl big enough for the wings.
      - Toss the wings in the sauce and serve warm.

  - name: Orange Glazed Chicken Wings
    categories: [Poultry, Asian]
    prep_time: 20
    cooking_time: 40
    servings: 4
    description:
      - Recipe courtesy Alton Brown, 2007. Bob's "Asian Wings". 4 appetizer servings.
      - "Inactive prep: 1 hour."
    ingredients:
      - { qty: 12, ingredient: Chicken wings, note: whole }
      - { qty: 1, measure: can, ingredient: Orange juice concentrate, note: "6-ounce, frozen" }
      - { qty: 3, measure: tbsp, ingredient: Hoisin sauce }
      - { qty: 2, measure: tsp, ingredient: Honey }
      - { qty: 1, measure: tbsp, ingredient: Soy sauce }
      - { qty: 1, measure: tsp, ingredient: Rice vinegar }
      - { qty: "1/2", measure: tsp, ingredient: Red pepper flakes, note: crushed }
    directions:
      - Steam, chill and roast the wings exactly as for Buffalo Wings - 10 minutes steaming, 1 hour in the refrigerator on a rack, then 20 minutes per side at 425 degrees F on parchment.
      - During the last 20 minutes of roasting, simmer the orange juice concentrate, hoisin, honey, soy sauce, vinegar and red pepper flakes over medium-high heat until reduced to about 1/2 cup, 5 to 10 minutes. Let cool at least 5 minutes.
      - Toss the wings with the glaze in a large bowl and serve warm.

  - name: Michael Symon's Orange Jalapeno Glazed Chicken Wings
    categories: [Poultry]
    ingredients:
      - { qty: 3, measure: lb, ingredient: Chicken wings }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 2, measure: tbsp, ingredient: Coriander seeds, note: "toasted and crushed, divided" }
      - { qty: 2, measure: tbsp, ingredient: Cumin seeds, note: "toasted and crushed, divided" }
      - { qty: 1, ingredient: Orange, note: juiced }
      - { qty: "1/4", measure: cup, ingredient: Sherry vinegar }
      - { qty: 1, ingredient: Jalapeno, note: sliced }
      - { qty: 1, measure: tbsp, ingredient: Butter }
      - { ingredient: Vegetable oil, note: for frying }
    directions:
      - Season the wings with salt, pepper, and half the coriander and cumin.
      - Preheat the oven to 350 degrees F. Spread the wings on a baking tray and bake 15 to 20 minutes, until just about cooked through. Let cool slightly.
      - In a saucepot over medium-high heat, combine the orange juice, sherry vinegar, jalapeno, and the rest of the coriander and cumin. Reduce by half, about 10 minutes. Off the heat, stir in the butter.
      - Heat the oil to 360 degrees F and deep-fry the wings until golden and crispy. Drain on paper towels and season with salt.
      - Pour the sauce over the wings in a bowl and toss to coat evenly.

  - name: Dionne Lewis' Blue Cheese Buffalo Wings
    categories: [Poultry]
    ingredients:
      - { qty: 10, ingredient: Chicken wings }
      - { qty: 1, measure: cup, ingredient: Buttermilk }
      - { qty: "1/2", measure: cup, ingredient: Blue cheese, note: crumbled }
      - { qty: 1, measure: cup, ingredient: Flour, note: "sifted, not in the bag" }
      - { qty: "1/2", measure: tbsp, ingredient: Seasoned salt }
      - { qty: 1, measure: tbsp, ingredient: Garlic and herb seasoning, note: "roasted garlic and herb (Mrs. Dash)" }
      - { qty: 1, measure: tbsp, ingredient: Black pepper }
      - { qty: "1/2", measure: tsp, ingredient: Cayenne pepper }
      - { qty: 1, measure: cup, ingredient: Hot sauce }
      - { qty: 1, measure: tbsp, ingredient: Butter, note: 1/8 stick }
      - { ingredient: Vegetable oil, note: for frying }
    directions:
      - Blend the blue cheese and buttermilk. Marinate the wings in it for a few hours in the refrigerator.
      - Combine the dry seasonings. Drain the chicken and lay flat on a cookie sheet. Sprinkle both sides with the seasoning, then sift the flour over until lightly coated on both sides.
      - Heat enough oil in a skillet to cover the wings and fry until crispy and golden. Drain.
      - Melt the butter in a saucepan and stir in the hot sauce.
      - Put the wings in a baking dish, pour the sauce over to coat, cover with foil and bake about 10 minutes at 350 degrees F.

  - name: Bob's Arroz con Pollo
    categories: [Cuban, Poultry, Rice]
    description:
      - Bob's ingredient list; there are no directions in the file beyond "check for more liquid".
    ingredients:
      - { qty: 1, ingredient: Chicken breast, note: cut in half }
      - { qty: 2, ingredient: Chicken thigh }
      - { qty: "1/2", ingredient: Bell pepper }
      - { qty: 1, ingredient: Onion, note: rough dice }
      - { ingredient: Annatto oil }
      - { qty: 4, measure: clove, ingredient: Garlic, note: diced }
      - { qty: 2, ingredient: Bay leaf }
      - { ingredient: Oregano }
      - { ingredient: Ground cumin }
      - { ingredient: Paprika }
      - { qty: 4, measure: oz, ingredient: Tomato sauce }
      - { ingredient: Chicken broth }
      - { ingredient: White wine }
      - { ingredient: Chorizo }
      - { qty: "1 1/4", measure: cup, ingredient: Valencia rice }
