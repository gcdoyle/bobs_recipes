      - { qty: 1, measure: tsp, ingredient: Garlic powder }
      - { qty: 2, measure: tsp, ingredient: Worcestershire sauce }
      - { qty: "1/4", ingredient: Onion, note: "small white, finely chopped or grated" }
      - { ingredient: Salt }
      - { ingredient: White pepper }
    notes:
      - Ingredients only; the file has no directions.

  - name: Homemade Hoisin Sauce
    categories: [Sauces, Asian]
    description:
      - The file lists only the ingredients, and "1/4 soy sauce" with no unit; 1/4 cup is assumed.
    ingredients:
      - { qty: "1/4", measure: cup, ingredient: Soy sauce }
      - { qty: 2, measure: tbsp, ingredient: Tomato paste }
      - { qty: 1, measure: tsp, ingredient: Ginger, note: chopped }
      - { qty: 1, measure: tsp, ingredient: Garlic, note: chopped }
      - { qty: 1, measure: tsp, ingredient: Hot sauce }
      - { qty: "1/4", measure: cup, ingredient: Light brown sugar }
      - { qty: 2, measure: tbsp, ingredient: Cider vinegar }
      - { qty: "1/8", measure: tsp, ingredient: Black pepper }
    notes:
      - Ingredients only; the file has no directions.

  - name: Mustard Horseradish Sauce
    categories: [Sauces]
    description:
      - Serve at room temperature.
    ingredients:
      - { qty: "3/4", measure: cup, ingredient: Mayonnaise, note: good }
      - { qty: "1 1/2", measure: tbsp, ingredient: Dijon mustard }
      - { qty: 1, measure: tbsp, ingredient: Whole grain mustard }
      - { qty: "1/2", measure: tbsp, ingredient: Prepared horseradish }
      - { qty: 2, measure: tbsp, ingredient: Sour cream }
      - { qty: 1, measure: pinch, ingredient: Kosher salt }
    directions:
      - Whisk everything together in a small bowl.

  - name: Warm Horseradish Cream Sauce
    categories: [Sauces, Beef]
    description:
      - Untitled in the file, after Mustard Horseradish Sauce.
    ingredients:
      - { qty: "3/4", measure: cup, ingredient: Horseradish, note: "freshly grated, or bottled if not prepared with cream" }
      - { qty: 3, measure: tbsp, ingredient: Shallot, note: minced }
      - { qty: 2, measure: tsp, ingredient: Garlic, note: minced }
      - { qty: 2, measure: tsp, ingredient: Dijon mustard }
      - { qty: "1 1/2", measure: cup, ingredient: Heavy cream }
      - { ingredient: Salt }
      - { ingredient: White pepper }
    directions:
      - Combine everything in a saucepan, season and bring to a boil, whisking gently.
      - Simmer, stirring occasionally, until thick enough to coat a spoon, about 12 minutes. Keep warm.

  - name: Garlic Lover's Hot Sauce
    categories: [Sauces]
    description:
      - Makes about 5 ounces. Bob's note on hot sauce spices - ground cumin, ground coriander, ground black pepper and garlic.
    ingredients:
      - { qty: 6, ingredient: Cayenne pepper, note: fresh peppers }
      - { qty: 4, measure: clove, ingredient: Garlic }
      - { qty: "1/4", measure: cup, ingredient: Distilled white vinegar, note: plus more for blanching }
      - { qty: 1, ingredient: Plum tomatoes }
      - { qty: 1, measure: tsp, ingredient: Cumin seeds, note: black cumin }
      - { qty: "1/2", measure: tsp, ingredient: Curry powder }
      - { qty: 1, measure: tsp, ingredient: Allspice }
      - { qty: 1, measure: tbsp, ingredient: Sugar }
      - { qty: "1/2", measure: tsp, ingredient: Salt }
    directions:
      - Clean the peppers of stems, veins and seeds (this tames the bitterness and heat), then blanch them 2 to 3 minutes in boiling distilled vinegar - not in aluminum, and don't breathe the steam. Drain, saving the vinegar.
      - Stem and seed the tomato by halving it and squeezing out the seeds and liquid.
      - Puree everything except the vinegar in a food processor until smooth. Put in a microwaveable glass measuring cup and add vinegar to make 5 ounces.
      - Microwave until it starts to steam, stir well, then heat again.
      - Hot-pack into bottles that have boiled at least 5 minutes on a rack in boiling water (don't wet the paper-sealed caps). Fill with the boiling sauce, cap tightly and turn upside down 10 minutes to sanitize the lid. Cool completely before refrigerating.
    notes:
      - For roasted-pepper sauces, roast peppers over a gas flame until blistered and black, steam in a paper bag 10 to 15 minutes, peel and seed; roasted peppers don't need blanching. Canned tomato juice is the best substitute for fresh tomato.

  - name: Blender Hollandaise Sauce
    categories: [Sauces]
    description:
      - Keep it warm by setting the whole blender jar in a bowl of warm water.
    ingredients:
      - { qty: 5, ingredient: Egg yolk }
      - { qty: 1, ingredient: Lemon, note: juiced }
      - { qty: 2, measure: tbsp, ingredient: Water }
      - { ingredient: Salt }
      - { qty: 1, measure: pinch, ingredient: Cayenne pepper }
      - { qty: 1, measure: lb, ingredient: Butter, note: "hot, melted" }
    directions:
      - Blend the yolks, lemon juice, water, salt and cayenne until light and fluffy, about 1 minute.
      - With the blender running, drizzle in the hot butter in a thin stream. Taste for salt and lemon.
