      - { qty: "1/2", measure: tsp, ingredient: Paprika }
      - { qty: "1/3", measure: cup, ingredient: Vegetable oil }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
    directions:
      - Combine the first 8 ingredients in a small bowl. Slowly whisk in the oil and season with salt and pepper.

  - name: Sweet French Dressing
    categories: [Sauces, Salads]
    description:
