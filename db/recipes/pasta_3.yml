# Recipes from "Pasta,Rice,Dumplings,Manicotti.txt", part 3. Anne Burrell's
# Risotto Milanese appears twice; once here.
recipes:
  - name: Nonna Ninetta's Ricotta Ball Hero
    categories: [Sandwiches, Pasta]
    servings: 6
    description:
      - Makes 6 to 8 heroes. Space the ricotta balls at least an inch apart in the sauce - they expand.
    ingredients:
      - { qty: 2, measure: lb, ingredient: Ricotta }
      - { qty: 2, measure: cup, ingredient: Bread crumbs, note: 1 to 2 cups }
      - { qty: 2, ingredient: Egg, note: medium }
      - { qty: "1/4", measure: cup, ingredient: Parsley, note: "fresh, finely chopped" }
      - { qty: 1, measure: clove, ingredient: Garlic, note: crushed and finely diced }
      - { qty: "1/2", measure: cup, ingredient: Pecorino Romano, note: "grated Italian cheese - Parmigiano or Locatelli, plus more for topping" }
      - { ingredient: Black pepper }
      - { ingredient: Salt }
      - { ingredient: Milk, note: if needed }
      - { ingredient: Flour, note: for coating }
      - { ingredient: Olive oil, note: for frying }
      - { qty: 4, measure: cup, ingredient: Marinara sauce }
      - { qty: 8, ingredient: Hero roll, note: 6 to 8 }
    directions:
      - Beat the eggs in a large bowl and gently stir in the ricotta, parsley, garlic and pepper, then the bread crumbs and cheese. Add a little milk if too thick and salt if needed.
      - Form meatball-size balls, coat in flour, flatten slightly and fry in olive oil until light golden.
      - Spread a layer of marinara in a baking pan or large frying pan, arrange the balls an inch apart and cover with sauce and grated cheese.
      - Bake covered at 375 degrees F for 20 to 25 minutes, or cook covered on the stove over a low flame about 15 minutes.
      - Fill the hero rolls with the ricotta balls, cheese and sauce and serve warm.

  - name: Risotto Milanese
    categories: [Rice]
    servings: 4
    description:
      - Recipe courtesy Anne Burrell. Serves 4 to 6. It should be creamy but still flow and hold its shape.
    ingredients:
      - { ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, ingredient: Onion, note: "large, 1/4-inch dice" }
      - { ingredient: Kosher salt }
      - { qty: 2, measure: cup, ingredient: Arborio rice, note: or Carnaroli }
      - { qty: 2, measure: pinch, ingredient: Saffron, note: large pinches }
      - { qty: 4, measure: cup, ingredient: Chicken stock, note: "3 to 4 cups, kept HOT" }
      - { qty: 2, measure: cup, ingredient: White wine, note: "1 1/2 to 2 cups, dry" }
      - { qty: 2, measure: tbsp, ingredient: Butter }
      - { qty: "3/4", measure: cup, ingredient: Parmesan, note: "1/2 to 3/4 cup Parmigiano-Reggiano, grated" }
    directions:
      - Coat a large saucepan generously with olive oil over medium heat and sweat the onions with salt until translucent, about 5 minutes.
      - Raise to medium-high, add the rice and cook 3 to 4 minutes, letting it stick slightly and scraping it off; it should sound crackly.
      - Add the saffron to the hot stock; it should turn bright yellow.
      - Add wine to cover the rice, season and stir continuously until absorbed. Add stock to cover and stir until absorbed. Repeat with stock two more times.
      - When it's very creamy, taste a few grains; if still crunchy, add a little more stock and cook a couple minutes. Off the heat, add the butter and cheese and "whip the heck out of it."

  - name: Mario Batali's Stromboli
    categories: [Breads, Vegetables]
    description:
      - The file calls for 1 recipe pizza dough and 2 cups basic tomato sauce, which aren't included.
    ingredients:
      - { ingredient: Pizza dough, note: 1 recipe }
      - { qty: 2, measure: cup, ingredient: Marinara sauce, note: basic tomato sauce }
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: "extra-virgin, plus more for drizzling" }
      - { qty: 2, measure: cup, ingredient: Broccoli, note: sliced finely as if shaved }
      - { qty: 2, measure: cup, ingredient: Cauliflower, note: sliced finely as if shaved }
      - { qty: 3, ingredient: Green onion, note: "spring onions, sliced thinly" }
      - { qty: 1, measure: tsp, ingredient: Red pepper flakes, note: plus more for the top }
      - { qty: 2, measure: clove, ingredient: Garlic, note: sliced }
      - { qty: 1, measure: lb, ingredient: Mozzarella, note: cubed }
      - { ingredient: Parmesan, note: for garnish }
    directions:
      - Preheat the oven to 450 degrees F.
      - Heat the olive oil in a skillet over medium-high heat and saute the onions, cauliflower, broccoli, garlic and pepper flakes until soft and fragrant.
      - Roll and stretch the dough into a large rectangle and spread the vegetables, sauce and mozzarella evenly over it.
      - Roll up carefully, top with more pepper flakes, Parmesan and a drizzle of oil, and bake on a lightly greased baking sheet until golden, 10 to 15 minutes. Rest 10 minutes before serving.

  - name: Dirty Rice
    categories: [Rice, Cajun]
    description:
      - Recipe courtesy Paula Deen.
    ingredients:
      - { qty: 1, measure: lb, ingredient: Pork sausage, note: bulk }
      - { qty: 1, measure: lb, ingredient: Chicken liver, note: finely chopped }
      - { qty: 1, measure: cup, ingredient: Onion, note: chopped }
      - { qty: "1/2", measure: cup, ingredient: Celery, note: chopped }
      - { qty: "1/2", measure: cup, ingredient: Green bell pepper, note: chopped }
      - { qty: 4, measure: cup, ingredient: Cooked rice, note: hot }
      - { qty: "1/4", measure: cup, ingredient: Parsley, note: "fresh leaves, chopped" }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
    directions:
      - Brown the sausage and chicken livers in a large skillet. Add the vegetables and saute until soft.
      - Gently fold in the rice and parsley and season.

  - name: Pigeon Pea Rice (Arroz con Gandules)
    categories: [Rice, Caribbean]
    servings: 8
    description:
      - Recipe courtesy Ingrid Hoffmann, 2008.
    ingredients:
      - { qty: 1, measure: tsp, ingredient: Vegetable oil }
      - { qty: 8, measure: slice, ingredient: Bacon, note: finely chopped }
      - { qty: "1/2", measure: cup, ingredient: Onion, note: finely chopped }
      - { qty: "1/2", measure: cup, ingredient: Cilantro, note: "leaves, finely chopped, plus more for garnish" }
      - { qty: 2, measure: cup, ingredient: Long grain rice, note: white }
      - { qty: 1, measure: can, ingredient: Ro-Tel, note: "10-ounce chopped tomatoes and green chiles" }
      - { qty: 1, measure: tsp, ingredient: Oregano, note: dried }
      - { qty: 1, measure: tsp, ingredient: Ground cumin }
      - { qty: 1, measure: tsp, ingredient: Kosher salt }
      - { qty: 1, measure: pinch, ingredient: Achiote powder, note: optional }
      - { qty: 1, measure: can, ingredient: Pigeon peas, note: "15-ounce green gandules, rinsed and drained" }
      - { qty: 2, measure: tbsp, ingredient: Tomato paste }
      - { qty: 4, measure: cup, ingredient: Water }
    directions:
      - Fry the bacon in the oil in a 3-quart saucepan over medium heat until crisp. Add the onion and cilantro and cook 5 minutes, until soft.
      - Add the rice, tomatoes, oregano, cumin, salt, achiote and pigeon peas and cook 5 to 7 minutes, until the rice is opaque.
      - Stir in the tomato paste and water and bring to a boil. When the water is absorbed, cover tightly, reduce to low and cook 25 to 30 minutes, until tender. Garnish with cilantro.

  - name: Pigeon Pea Rice with Dried Peas
    categories: [Rice, Caribbean]
    description:
      - Bob's "Arroz de Grandules", made with dried pigeon peas and baked. Uses Achiote Oil (its own recipe).
    ingredients:
      - { qty: 1, measure: lb, ingredient: Pigeon peas, note: "dried, picked through and rinsed" }
      - { qty: 3, ingredient: Bay leaf }
      - { qty: 7, measure: clove, ingredient: Garlic, note: "5 unpeeled, plus 2 minced" }
      - { qty: 3, measure: qt, ingredient: Water }
      - { qty: "1/4", measure: cup, ingredient: Achiote oil }
      - { qty: 1, ingredient: White onion, note: "medium, diced" }
      - { qty: 1, ingredient: Green bell pepper, note: cored and diced }
      - { qty: 1, measure: tsp, ingredient: Ground cumin }
      - { qty: 1, measure: tsp, ingredient: Coriander, note: ground }
      - { qty: 1, measure: tsp, ingredient: Cayenne pepper }
      - { qty: 2, measure: cup, ingredient: Long grain rice }
      - { qty: 1, measure: tbsp, ingredient: Salt }
      - { qty: 1, ingredient: Lime, note: juiced }
    directions:
      - Cover the peas, bay leaves and unpeeled garlic with the cold water in a large pot, cover and cook over medium heat until tender, about 1 1/2 hours, keeping them covered with water. Drain, saving 4 cups of the liquid.
      - Preheat the oven to 375 degrees F.
      - Heat the achiote oil in a large Dutch oven over medium heat until it smokes. Cook the onion, minced garlic and pepper 10 minutes, until soft but not browned. Stir in the cumin, coriander and cayenne, then the rice.
      - Add the reserved cooking liquid, the peas, salt and lime juice. Cover and bake 20 to 30 minutes, until the rice is tender and the liquid absorbed.

  - name: BBQ Pork Fried Rice
    categories: [Rice, Asian, Pork]
    description:
      - Recipe courtesy Guy Fieri.
    ingredients:
      - { qty: "1/2", measure: cup, ingredient: Soy sauce, note: "1/4 cup for the pork, 1/4 cup for the rice" }
      - { qty: "1/2", measure: cup, ingredient: Oyster sauce, note: "1/4 cup for the pork, 1/4 cup for the rice" }
      - { qty: 2, measure: tbsp, ingredient: Ginger, note: "fresh, minced, divided" }
      - { qty: 2, measure: tbsp, ingredient: Garlic, note: "minced, divided" }
      - { qty: 2, measure: tbsp, ingredient: Sesame oil, note: divided }
      - { qty: 1, measure: lb, ingredient: Pork tenderloin }
      - { qty: "1/4", measure: cup, ingredient: Sweet and sour sauce }
      - { qty: 4, measure: tbsp, ingredient: Canola oil }
      - { qty: "1/2", measure: cup, ingredient: Red bell pepper, note: diced }
      - { qty: "1/2", measure: cup, ingredient: Yellow bell pepper, note: diced }
      - { qty: 1, measure: cup, ingredient: Red onion, note: diced }
      - { qty: "1/2", measure: cup, ingredient: Green cabbage, note: thinly sliced }
      - { qty: "1/2", measure: cup, ingredient: Snap pea, note: thinly sliced }
      - { qty: "1/2", measure: cup, ingredient: Carrot, note: "peeled, diced" }
      - { qty: "1/2", measure: cup, ingredient: Celery, note: diced }
      - { qty: 6, measure: cup, ingredient: Cooked rice, note: "short-grain white, cooked and cooled" }
      - { qty: 3, ingredient: Egg, note: beaten }
      - { qty: "1/2", measure: cup, ingredient: Green onion, note: chopped }
      - { qty: 2, measure: tbsp, ingredient: Sesame seeds, note: toasted }
    directions:
      - "Pork: mix 1/4 cup each soy and oyster sauce, 1 tablespoon each ginger and garlic, and 1 tablespoon sesame oil. Marinate the pork in it 1 hour in the refrigerator."
      - Heat the grill to medium-high and grill the pork on both sides, basting with the leftover marinade heated to 165 degrees F. When almost cooked, glaze both sides with sweet and sour sauce and let it caramelize. Rest 10 minutes and cut into 1/2-inch pieces.
      - "Rice: heat the canola oil in a wok over high heat until almost smoking. Add the remaining ginger and all the vegetables except the garlic and cook 3 minutes. Add the remaining garlic, and before it browns add the rice, mixing rapidly so it doesn't stick."
      - Pour the eggs over and toss rapidly until cooked. Add the remaining soy sauce, oyster sauce and sesame oil, mix thoroughly, then add the pork.
      - Garnish with green onions and sesame seeds and serve immediately.

  - name: Red Beans and Rice
    categories: [Rice, Beans, Cajun]
    ingredients:
      - { qty: 1, measure: lb, ingredient: Red beans, note: "dried, rinsed and sorted" }
      - { qty: 3, measure: tbsp, ingredient: Bacon fat }
      - { qty: "1/4", measure: cup, ingredient: Tasso, note: "chopped, or chopped ham" }
      - { qty: "1 1/2", measure: cup, ingredient: Yellow onion, note: chopped }
      - { qty: "3/4", measure: cup, ingredient: Celery, note: chopped }
      - { qty: "3/4", measure: cup, ingredient: Green bell pepper, note: chopped }
      - { qty: "1/2", measure: tsp, ingredient: Salt }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: 1, measure: pinch, ingredient: Cayenne pepper }
      - { qty: 3, ingredient: Bay leaf }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: "fresh, chopped" }
      - { qty: 2, measure: tsp, ingredient: Thyme, note: fresh }
      - { qty: "1/2", measure: lb, ingredient: Smoked sausage, note: "split lengthwise, 1-inch pieces" }
      - { qty: 1, measure: lb, ingredient: Ham hock, note: smoked }
      - { qty: 3, measure: tbsp, ingredient: Garlic, note: chopped }
      - { qty: 10, measure: cup, ingredient: Chicken stock, note: or water }
      - { qty: 4, measure: cup, ingredient: Cooked rice, note: white }
      - { qty: "1/4", measure: cup, ingredient: Green onion, note: "chopped, for garnish" }
    directions:
      - Cover the beans with water by 2 inches and soak 8 hours or overnight. Drain.
      - Heat the bacon grease in a large pot over medium-high heat and cook the tasso 1 minute. Add the onions, celery and peppers, season with the salt, pepper and cayenne and cook until soft, about 4 minutes.
      - Add the bay leaves, parsley, thyme, sausage and ham hocks and cook to brown the meat, about 4 minutes. Add the garlic for 1 minute.
      - Add the beans and stock, bring to a boil, then simmer uncovered over medium-low, stirring occasionally, until tender and starting to thicken, about 2 hours. Add water 1/4 cup at a time if too thick.
      - Mash about a quarter of the beans against the side of the pot and cook until creamy, 15 to 20 minutes more. Remove the bay leaves and serve over rice with green onions.

  - name: Mushroom Risotto
    categories: [Rice]
    description:
      - Untitled in the file, labeled only "Risotto". A covered, no-stir method.
    ingredients:
      - { qty: 1, measure: oz, ingredient: Dried porcini, note: dried mushrooms }
      - { qty: 1, measure: cup, ingredient: Water, note: boiling }
      - { qty: 3, measure: tbsp, ingredient: Olive oil }
      - { qty: 1, ingredient: Shallot, note: minced }
      - { qty: 1, measure: cup, ingredient: Arborio rice }
      - { qty: 1, measure: cup, ingredient: Chicken stock, note: heated }
      - { qty: "1/2", measure: cup, ingredient: White wine, note: dry }
      - { qty: 2, measure: pinch, ingredient: Salt, note: a few pinches }
      - { qty: 2, measure: tbsp, ingredient: Butter }
      - { qty: "1/2", measure: cup, ingredient: Pecorino Romano, note: grated }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: "fresh leaves, chopped" }
    directions:
      - Pour the boiling water over the mushrooms, cover and let sit 10 minutes.
      - Heat the oil in a large saucepan over medium heat and sweat the shallots until they start to turn translucent. Stir in the rice to coat with oil.
      - Add the stock and wine. Chop the mushrooms and add them with their soaking liquid and the salt. Bring to a simmer over medium-high heat, stir well, then cover and cook over low heat 20 minutes, stirring once after 10 minutes.
      - Off the heat, stir in the butter, cheese and parsley.

  - name: Super Stuffed Shells
    categories: [Pasta, Casseroles]
    description:
      - Recipe courtesy Emeril Lagasse, 2002. Uses Emeril's Essence Creole Seasoning (its own recipe). The file says "Basic Red Sauce, recipe follows" but doesn't include it; use your favorite marinara.
    ingredients:
      - { qty: 4, measure: tsp, ingredient: Olive oil, note: "1 tablespoon plus 1 teaspoon, divided" }
      - { qty: 2, measure: tsp, ingredient: Salt, note: divided }
      - { qty: 6, measure: oz, ingredient: Pasta, note: "jumbo shells, 1/2 of a 12-ounce box (18 to 20 shells)" }
      - { qty: 2, measure: cup, ingredient: Onion, note: finely chopped }
      - { qty: 2, measure: tsp, ingredient: Garlic, note: minced }
      - { qty: 1, measure: lb, ingredient: Ground veal }
      - { qty: 10, measure: oz, ingredient: Spinach, note: "frozen, thawed and squeezed dry" }
      - { qty: 15, measure: oz, ingredient: Ricotta }
      - { qty: 2, ingredient: Egg, note: large }
      - { qty: 1, measure: cup, ingredient: Parmesan, note: grated }
      - { qty: 2, measure: cup, ingredient: Mozzarella, note: "grated, divided" }
      - { qty: 1, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, measure: tsp, ingredient: Creole seasoning, note: Emeril's Essence }
      - { qty: 1, measure: tsp, ingredient: Dried basil }
      - { qty: 1, measure: tsp, ingredient: Oregano, note: dried }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: ground }
      - { ingredient: Marinara sauce, note: basic red sauce }
    directions:
      - Preheat the oven to 350 degrees F and grease a 2-quart casserole with 1 teaspoon oil.
      - Boil the shells with 1 teaspoon salt until al dente, 10 to 12 minutes, stirring so they don't stick. Drain, rinse in cold water and drain.
      - Heat the tablespoon of olive oil in a medium skillet over medium heat and cook the onions and garlic until very soft, 6 to 7 minutes. Add the veal and cook until browned, then the spinach for 3 minutes. Season.
      - Combine the ricotta, eggs, Parmesan and 1 cup mozzarella. Stir in the spinach mixture, extra-virgin olive oil, Essence, remaining salt, basil, oregano and pepper.
      - Fill each shell with about 2 tablespoons and arrange in the dish. Pour the sauce over and top with the remaining mozzarella.
      - Bake uncovered until bubbly, about 20 minutes. Rest 5 minutes.

  - name: Creamy Spaghetti and Beans
    categories: [Pasta, Beans]
    description:
      - Risotto meets pasta e fagioli in this Tuscan classic.
    ingredients:
      - { qty: 6, measure: cup, ingredient: Chicken stock, note: 5 to 6 cups }
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: 2, measure: tbsp, ingredient: Butter }
      - { qty: "1/4", measure: lb, ingredient: Pancetta, note: "chunk, small dice" }
      - { qty: 4, measure: clove, ingredient: Garlic, note: chopped }
      - { qty: 1, measure: lb, ingredient: Spaghetti }
      - { qty: 1, ingredient: Onion, note: "medium, chopped" }
      - { qty: 2, ingredient: Carrot, note: small dice }
      - { qty: 1, ingredient: Bay leaf, note: fresh }
      - { qty: 6, measure: sprig, ingredient: Thyme, note: "5 to 6, fresh" }
      - { qty: 1, measure: can, ingredient: Cannellini beans, note: "15-ounce Roman beans or small white beans (recommended: Goya)" }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 1, measure: cup, ingredient: White wine, note: dry }
      - { qty: 1, measure: cup, ingredient: Parmesan, note: "Parmigiano-Reggiano, grated" }
      - { qty: 1, measure: handful, ingredient: Parsley, note: "flat-leaf, finely chopped, generous" }
    directions:
      - Warm the stock in a sauce pot over medium heat, then keep at a simmer.
      - Heat the olive oil and butter in a large deep skillet over medium to medium-high heat and brown the pancetta slightly. Add the garlic and spaghetti and toast the noodles lightly, 3 to 4 minutes.
      - Add the onions, carrots, bay and thyme, season and soften 5 minutes. Add the wine and let it absorb completely.
      - Add the beans and a few ladles of stock and stir. Keep adding stock a few ladles at a time as it's absorbed, like a risotto, until the spaghetti is al dente, 12 to 15 minutes.
      - Stir in the cheese, adjust the seasoning and stir another minute off the heat. Remove the bay and thyme stems and serve in shallow bowls with lots of parsley.

  - name: Pomodoro Sauce
    categories: [Sauces]
    description:
      - Tyler Florence's, for Spaghetti and Meatballs. Makes 4 cups.
    ingredients:
      - { qty: "1/2", measure: cup, ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, ingredient: Onion, note: "medium, chopped" }
      - { qty: 3, measure: clove, ingredient: Garlic, note: chopped }
      - { qty: 2, measure: can, ingredient: Tomato, note: "28-ounce whole peeled San Marzano, drained and crushed by hand, liquid reserved" }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1/4", measure: cup, ingredient: Basil, note: "fresh leaves, torn" }
    directions:
      - Heat the olive oil in a large saucepan over medium-low heat and cook the onion and garlic until soft, 4 to 5 minutes.
      - Carefully add the tomatoes with about 1/2 cup of their liquid and season. Cook until thick, about 15 minutes, then bring to a boil, stirring to break up the tomatoes.
      - Simmer 20 to 25 minutes, stir in the basil and season again.

  - name: Spaghetti and Meatballs
    categories: [Pasta, Beef]
    description:
      - Recipe courtesy Tyler Florence. Uses Pomodoro Sauce (its own recipe), or good jarred sauce. Don't overwork the meat or the meatballs will be tough.
    ingredients:
      - { ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, ingredient: Onion, note: chopped }
      - { qty: 2, measure: clove, ingredient: Garlic, note: smashed }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: "fresh leaves, roughly chopped" }
      - { qty: 1, measure: cup, ingredient: Milk }
      - { qty: 4, measure: slice, ingredient: White bread, note: "thick, firm, crust removed" }
      - { qty: "1 1/2", measure: lb, ingredient: Ground beef }
      - { qty: "1 1/2", measure: lb, ingredient: Ground pork }
      - { qty: 1, ingredient: Egg, note: large }
      - { qty: "1/2", measure: cup, ingredient: Parmesan, note: "Parmigiano-Reggiano, freshly grated, plus more for serving" }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 4, measure: cup, ingredient: Pomodoro Sauce, note: heated }
      - { qty: "1/2", measure: lb, ingredient: Mozzarella, note: cut into chunks }
      - { qty: 3, measure: sprig, ingredient: Basil, note: fresh leaves }
      - { qty: 1, measure: lb, ingredient: Spaghetti }
    directions:
      - Bring a big pot of salted water to a boil. Heat 3 tablespoons oil in an ovenproof skillet over medium heat and cook the onion, garlic and parsley until soft but translucent, about 10 minutes. Let cool.
      - Pour enough milk over the bread to moisten and let it soak.
      - Combine the meats, add the egg and Parmigiano and season generously. Squeeze the milk out of the bread and add it with the cooled onions. Combine gently until just mixed and shape into 10 meatballs.
      - Preheat the oven to 350 degrees F. Heat a little more oil in the skillet over medium heat and brown the meatballs on all sides, about 10 minutes.
      - Put them in a baking dish, spoon about half the sauce over, shower with mozzarella and drizzle with oil. Bake until cooked through, about 15 minutes.
      - Meanwhile, cook the spaghetti until al dente, about 8 minutes. Toss on a platter with the rest of the sauce, top with the meatballs and basil and serve with extra cheese.

  - name: Real Meatballs and Spaghetti
    categories: [Pasta, Beef]
    description:
      - Makes 14 to 16 two-inch meatballs. Serve with grated Parmesan.
    ingredients:
      - { qty: "1/2", measure: lb, ingredient: Ground veal }
      - { qty: "1/2", measure: lb, ingredient: Ground pork }
      - { qty: 1, measure: lb, ingredient: Ground beef }
      - { qty: 1, measure: cup, ingredient: Bread crumbs, note: "fresh white (4 slices, crusts removed)" }
      - { qty: "1/4", measure: cup, ingredient: Seasoned bread crumbs, note: dry }
      - { qty: 3, measure: tbsp, ingredient: Parsley, note: "fresh flat-leaf, chopped - 2 for the meatballs, 1 for the sauce" }
      - { qty: "1/2", measure: cup, ingredient: Parmesan, note: "freshly grated, plus more for serving" }
      - { qty: "3 1/2", measure: tsp, ingredient: Kosher salt, note: "2 for the meatballs, 1 1/2 for the sauce" }
      - { qty: 1, measure: tsp, ingredient: Black pepper, note: "freshly ground, divided" }
      - { qty: "1/4", measure: tsp, ingredient: Nutmeg, note: ground }
      - { qty: 1, ingredient: Egg, note: "extra-large, beaten" }
      - { qty: "3/4", measure: cup, ingredient: Water, note: warm }
      - { ingredient: Vegetable oil, note: for frying }
      - { ingredient: Olive oil, note: "for frying, plus 1 tablespoon good olive oil for the sauce" }
      - { qty: 1, measure: cup, ingredient: Yellow onion, note: "chopped (1 onion)" }
      - { qty: "1 1/2", measure: tsp, ingredient: Garlic, note: minced }
      - { qty: "1/2", measure: cup, ingredient: Red wine, note: "good, such as Chianti" }
      - { qty: 1, measure: can, ingredient: Crushed tomato, note: "28-ounce, or plum tomatoes in puree, chopped" }
      - { qty: "1 1/2", measure: lb, ingredient: Spaghetti, note: cooked per the package }
    directions:
      - Combine the meats, both bread crumbs, 2 tablespoons parsley, Parmesan, 2 teaspoons salt, 1/2 teaspoon pepper, nutmeg, egg and warm water very lightly with a fork. Form loosely into 2-inch meatballs.
      - Heat equal amounts of vegetable and olive oil 1/4 inch deep in a large (12-inch) skillet. Brown the meatballs well on all sides in batches over medium-low heat, about 10 minutes per batch, without crowding. Drain on paper towels. Discard the oil but don't clean the pan.
      - "Sauce: heat the tablespoon of olive oil in the pan and saute the onion over medium heat until translucent, 5 to 10 minutes. Add the garlic for 1 minute. Add the wine and cook on high, scraping up the browned bits, until almost evaporated, about 3 minutes. Stir in the tomatoes, remaining parsley, salt and pepper."
      - Return the meatballs, cover and simmer on the lowest heat 25 to 30 minutes, until cooked through. Serve over spaghetti with Parmesan.

  - name: Spaghetti Pie
    categories: [Pasta, Casseroles]
    description:
      - Recipe courtesy Emeril Lagasse, 2001. Uses Emeril's Essence Creole Seasoning (its own recipe). The file mentions "Basic Red Sauce, recipe follows," which isn't included; store-bought pasta sauce works.
    ingredients:
      - { qty: 1, measure: tsp, ingredient: Salt }
      - { qty: "1/2", measure: lb, ingredient: Spaghetti, note: dried }
      - { qty: 5, measure: tsp, ingredient: Olive oil, note: "2 teaspoons plus 1 tablespoon, divided" }
