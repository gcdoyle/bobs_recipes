# Recipes from "Beef & Veal.txt", part 2. Mike Mills' Beef Ribs and Paula Deen's
# House Seasoning are already in.
recipes:
  - name: Sirloin Beef Stroganoff
    categories: [Beef]
    servings: 4
    ingredients:
      - { qty: "1 1/2", measure: lb, ingredient: Sirloin steak }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: divided }
      - { qty: 8, measure: oz, ingredient: Mushroom, note: button }
      - { qty: "1/2", ingredient: Onion, note: chopped }
      - { qty: 1, measure: tbsp, ingredient: Brandy }
      - { qty: "1 1/4", measure: cup, ingredient: Beef broth }
      - { qty: 2, measure: tbsp, ingredient: Thyme, note: "fresh leaves, chopped" }
      - { qty: 1, measure: tbsp, ingredient: Dijon mustard }
      - { qty: "1/2", measure: cup, ingredient: Heavy cream }
      - { qty: 8, measure: oz, ingredient: Egg noodles, note: 1 package }
      - { qty: 2, measure: tbsp, ingredient: Butter }
      - { qty: "1/4", measure: cup, ingredient: Parsley, note: "flat-leaf, leaves chopped" }
      - { qty: "1/2", measure: cup, ingredient: Sour cream }
    directions:
      - Season the steaks generously with salt and pepper.
      - In a large nonstick skillet over medium-high heat, add a tablespoon of olive oil. When hot, cook the steaks to desired doneness, about 4 minutes per side for medium-rare. Remove to a platter and cover with foil.
      - Add another tablespoon of olive oil, the onion, and the mushrooms, and cook until brown, about 2 minutes. Deglaze the pan with the broth and brandy and bring to a boil.
      - Let reduce for 2 minutes, then add the cream, whisk in the mustard, add the thyme, and cook another 3 to 5 minutes, until the sauce has thickened.
      - Cook the noodles until al dente. Drain and return to the pot with the butter and half of the parsley; toss to melt the butter.
      - Slice the steaks 1/2 inch thick. Divide the noodles among plates, top with the steak, the sauce, a dollop of sour cream and a sprinkle of parsley.

  - name: Roast Beef with Spicy Parsley Tomato Sauce
    categories: [Beef]
    description:
      - Recipe courtesy Giada De Laurentiis.
    ingredients:
      - { qty: 1, ingredient: Beef roast, note: "2 to 2 1/2-pound sirloin tip or chuck roast" }
      - { qty: 3, measure: tbsp, ingredient: Olive oil }
      - { qty: 4, ingredient: Roma tomato, note: cut in half }
      - { qty: 2, measure: tsp, ingredient: Herbes de Provence }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1 1/2", measure: cup, ingredient: Parsley, note: "fresh flat-leaf, for the sauce" }
      - { qty: 2, measure: clove, ingredient: Garlic, note: for the sauce }
      - { qty: "1/2", measure: tsp, ingredient: Red pepper flakes, note: for the sauce }
      - { qty: "3/4", measure: tsp, ingredient: Kosher salt, note: for the sauce }
      - { qty: "3/4", measure: tsp, ingredient: Black pepper, note: "freshly ground, for the sauce" }
      - { qty: 2, measure: tbsp, ingredient: Red wine vinegar, note: for the sauce }
      - { qty: "1/2", measure: cup, ingredient: Olive oil, note: "extra-virgin, for the sauce" }
    directions:
      - Preheat the oven to 375 degrees F. Season the beef with salt and pepper. Season the tomatoes with salt, pepper, and herbes de Provence.
      - Heat the olive oil in a medium heavy roasting pan or Dutch oven over high heat. Sear the beef on all sides. Turn off the heat, place the tomatoes around the beef and put the pan in the oven.
      - Roast until a meat thermometer reads 130 degrees F for medium-rare (135 for medium), about 30 to 40 minutes. Tent loosely with foil and rest 10 to 15 minutes; the temperature will rise about 5 degrees more.
      - "For the sauce: pulse the parsley and garlic in a food processor until finely chopped. Add the red pepper flakes, salt, vinegar and the roasted tomatoes from the beef pan and process until pureed. With the machine running, add the olive oil in a steady stream."
      - Slice the roast onto a platter, drizzle with a little sauce, and serve the rest alongside.

  - name: Easy Rice
    categories: [Rice]
    description:
      - Emeril's side for Sunday Night Roast Beef and Gravy.
    ingredients:
      - { qty: 2, measure: cup, ingredient: Long grain rice, note: white }
      - { qty: 4, measure: cup, ingredient: Water, note: or low-sodium chicken broth }
      - { qty: 1, measure: tbsp, ingredient: Unsalted butter }
      - { qty: "1 1/2", measure: tsp, ingredient: Salt }
    directions:
      - In a 2-quart saucepan, combine the rice, water, butter and salt, and bring to a boil over high heat.
      - Reduce the heat to low, cover, and simmer until all the liquid is absorbed, about 20 minutes. Let sit, covered, for 10 minutes, then fluff with a fork.

  - name: Sunday Night Roast Beef and Gravy
    categories: [Beef]
    prep_time: 5
    cooking_time: 125
    servings: 6
    description:
      - Recipe courtesy Emeril Lagasse, 2005. Serves 6 to 8. Serve with Easy Rice; uses Emeril's Essence Creole Seasoning (both their own recipes).
      - "Inactive prep: 15 minutes."
    ingredients:
      - { qty: 1, ingredient: Bottom round, note: "3 to 3 1/2-pound rump roast, at room temperature" }
      - { qty: 1, measure: tsp, ingredient: Creole seasoning, note: Emeril's Essence }
      - { qty: "1/2", measure: tsp, ingredient: Salt }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: 3, measure: tbsp, ingredient: Olive oil }
      - { qty: "1/2", ingredient: Yellow onion, note: "large, sliced" }
      - { qty: 3, measure: sprig, ingredient: Thyme, note: fresh }
      - { qty: 3, measure: cup, ingredient: Beef broth, note: low-sodium }
      - { qty: 2, measure: tbsp, ingredient: Corn starch }
      - { qty: "1/4", measure: cup, ingredient: Water }
    directions:
      - Preheat the oven to 275 degrees F.
      - Season the meat on all sides with the Essence, salt, and pepper. Heat the oil in a large Dutch oven and brown on all sides, about 4 minutes per side.
      - Remove the roast and add the onion and thyme. Place the roast on top, fat side up. Add the broth and roast, uncovered, until tender and 130 to 135 degrees F inside, about 1 1/2 to 2 hours. Rest 15 minutes before carving.
      - Meanwhile, discard the onions and thyme. Heat the drippings in the Dutch oven over medium-high heat. Dissolve the cornstarch in the water, add to the drippings and bring to a boil, stirring constantly, until slightly thickened, 2 to 3 minutes.
      - Carve the beef thinly and serve with gravy and Easy Rice.

  - name: Chia Burger
    categories: [Burgers]
    servings: 5
    description:
      - Originally topped with Acai Special Sauce and Spicy Home-Cured Pickles and served with asparagus fries; those recipes aren't in the file.
    ingredients:
      - { qty: "1/2", measure: oz, ingredient: Chia seed, note: ground }
      - { qty: 4, measure: oz, ingredient: Beef broth, note: organic }
      - { qty: 16, measure: oz, ingredient: Ground beef, note: 93% lean }
      - { measure: drizzle, ingredient: Olive oil }
      - { qty: 4, ingredient: Sandwich thins, note: multigrain }
      - { ingredient: Pickles, note: spicy }
      - { ingredient: Lettuce, note: optional }
      - { ingredient: Tomato, note: optional }
    directions:
      - In a small bowl, mix the ground chia seeds and beef broth. Stir well and let stand 15 minutes until thickened.
      - In a second bowl, mix the ground beef with the chia mixture. Form 5 even patties and refrigerate on a sheet pan for at least 1 hour.
      - Heat a nonstick saute pan with a drizzle of olive oil over medium-high heat. Cook the patties until medium-rare, about 3 minutes per side (longer if you like them more done).
      - Spread sauce on both sides of the sandwich thins, add the burger and top with pickles, lettuce and tomato.

  - name: Chicken Fried Steak and Gravy
    categories: [Beef]
    prep_time: 15
    cooking_time: 20
    servings: 4
    description:
      - Recipe courtesy Tyler Florence. Serves 4 to 6.
      - "Inactive prep: 25 minutes."
    ingredients:
      - { qty: 2, measure: lb, ingredient: Bottom round, note: "beef, trimmed of excess fat" }
      - { qty: 2, measure: cup, ingredient: Flour, note: "2 to 2 1/2 cups, all-purpose" }
      - { qty: 2, measure: tbsp, ingredient: Garlic powder }
      - { qty: 2, measure: tbsp, ingredient: Onion powder }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 3, ingredient: Egg, note: beaten }
      - { qty: 2, measure: cup, ingredient: Buttermilk, note: or whole milk }
      - { ingredient: Hot sauce, note: to taste }
      - { ingredient: Vegetable oil, note: for frying }
      - { qty: 3, measure: tbsp, ingredient: Flour, note: "heaping, for the gravy" }
      - { qty: 1, measure: cup, ingredient: Buttermilk, note: for the gravy }
      - { qty: 1, measure: cup, ingredient: Milk, note: "whole, for the gravy" }
    directions:
      - In a flat dish combine the flour, garlic powder, onion powder, salt and pepper. In another flat dish stir together the eggs, buttermilk and hot sauce and season well with salt and pepper.
      - Cut the beef into 4 (1/2-inch) slices and pound them out with the toothed side of a meat mallet to tenderize. Dredge each piece in the flour, then the buttermilk, then back in the flour. Set on a rack over a baking sheet and refrigerate 20 to 25 minutes.
      - Heat about 2 inches of oil in a large cast iron pan over medium-high heat to 365 degrees F. Fry the steaks 2 to 3 at a time until golden brown, about 3 to 4 minutes per side. Drain on paper towels.
      - Pour off all but 1/4 cup of the fat. Over medium heat, sprinkle in the 3 tablespoons flour and whisk into a roux, scraping up the browned bits. Slowly whisk in the buttermilk and milk until the gravy is nice and thick. Season with salt, plenty of pepper and hot sauce. Serve the steaks topped with gravy.

  - name: Country Fried Steak with Biscuits and Gravy
    categories: [Beef]
    servings: 8
    description:
      - Recipe courtesy Paula Deen. Uses Paula Deen's House Seasoning (its own recipe).
    ingredients:
      - { qty: "1 1/2", measure: cup, ingredient: Flour, note: "all-purpose, plus 2 tablespoons" }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: 8, ingredient: Round steak, note: "4-ounce, tenderized (have the butcher run them through a cubing machine)" }
      - { qty: 1, measure: tsp, ingredient: House seasoning }
      - { qty: 1, measure: tsp, ingredient: Seasoned salt }
      - { qty: 2, measure: cup, ingredient: Buttermilk }
      - { qty: "2/3", measure: cup, ingredient: Vegetable oil }
      - { qty: "1 1/2", measure: tsp, ingredient: Salt }
      - { qty: 1, measure: qt, ingredient: Milk, note: whole }
      - { qty: "1/2", measure: tsp, ingredient: MSG, note: "Ac'cent, optional" }
      - { qty: 1, measure: bunch, ingredient: Green onion, note: "or 1 medium yellow onion, sliced" }
      - { qty: 1, ingredient: Active dry yeast, note: "package, for the biscuits" }
      - { qty: "1/2", measure: cup, ingredient: Water, note: "lukewarm, for the biscuits" }
      - { qty: 5, measure: cup, ingredient: Flour, note: "all-purpose, for the biscuits" }
      - { qty: 1, measure: tsp, ingredient: Baking soda, note: for the biscuits }
      - { qty: "1/2", measure: tsp, ingredient: Salt, note: for the biscuits }
      - { qty: 1, measure: tbsp, ingredient: Baking powder, note: for the biscuits }
      - { qty: 2, measure: tbsp, ingredient: Sugar, note: for the biscuits }
      - { qty: "3/4", measure: cup, ingredient: Vegetable shortening, note: "Crisco, for the biscuits" }
      - { qty: 2, measure: cup, ingredient: Buttermilk, note: for the biscuits }
    directions:
      - "Steak and gravy: combine 1 1/2 cups flour and 1/4 teaspoon pepper. Sprinkle one side of the meat with House Seasoning and the other with seasoning salt, then dredge in buttermilk and then flour."
      - Heat 1/2 cup oil in a heavy skillet over medium-high heat. Fry 2 to 4 steaks at a time until browned, about 5 to 6 minutes per side. Drain on paper towels. Repeat, adding up to 1/4 cup more oil as needed.
      - For the gravy, add the remaining 2 tablespoons flour to the pan drippings, scraping the bottom. Stir in the remaining 1/4 teaspoon pepper and the salt. Reduce to medium and cook, stirring, until the flour is medium brown and bubbly. Slowly add the milk and the Ac'cent, if using, stirring constantly.
      - Return the steaks to the skillet and bring to a boil over medium-high heat. Reduce to low, put the onions on top of the steaks, cover and simmer 30 minutes.
      - "Biscuits: preheat the oven to 400 degrees F. Dissolve the yeast in the warm water. Mix the dry ingredients and cut in the shortening. Add the yeast and buttermilk and mix well. Roll out on a lightly floured surface to the desired thickness, cut with a small biscuit cutter and place on a greased baking sheet. Bake 12 minutes or until golden brown."
      - Split the biscuits, top with country fried steak and drizzle with gravy.

  - name: Paula Deen's Beef Stroganoff
    categories: [Beef]
    description:
      - Recipe courtesy Paula Deen, 2008. Uses Paula Deen's House Seasoning (its own recipe).
    ingredients:
      - { qty: "1 1/2", measure: lb, ingredient: Round steak, note: "cubed, cut into thin strips" }
      - { ingredient: House seasoning }
      - { ingredient: Flour, note: "all-purpose, for dusting plus 1 teaspoon" }
      - { qty: 2, measure: tbsp, ingredient: Olive oil }
      - { qty: 2, measure: tbsp, ingredient: Butter }
      - { qty: 1, ingredient: Onion, note: "medium, sliced" }
      - { qty: 8, measure: oz, ingredient: Mushroom, note: "fresh, sliced" }
      - { qty: 1, measure: can, ingredient: Beef broth, note: 10 3/4-ounce }
      - { qty: 1, measure: can, ingredient: Cream of mushroom soup, note: 10 3/4-ounce }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
      - { qty: 1, measure: cup, ingredient: Sour cream }
      - { ingredient: Egg noodles, note: "cooked, for serving" }
    directions:
      - Season the steak strips with House Seasoning, then dust with flour. In a large skillet, quickly brown them on both sides in the olive oil and butter. Remove from the pan.
      - Add the onion and mushrooms to the drippings and saute a few minutes, until the onion is tender. Sprinkle with 1 teaspoon flour.
      - Return the steak to the pan. Add the mushroom soup and beef broth. Cover and cook over low heat for about 30 minutes. Season with salt and pepper.
      - Stir in the sour cream for the last few minutes. Serve over noodles.

  - name: Grillades
    categories: [Beef, Cajun]
    ingredients:
      - { qty: 1, ingredient: Beef chuck, note: "3-pound chuck roast, cut into 1-inch pieces" }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper }
      - { ingredient: Garlic powder }
      - { ingredient: Cooking spray }
      - { qty: "1/3", measure: cup, ingredient: Flour, note: "all-purpose, plus 1/4 cup for the roux" }
      - { qty: 4, measure: tbsp, ingredient: Bacon fat }
      - { qty: 4, measure: tbsp, ingredient: Vegetable oil }
      - { qty: 1, ingredient: Green bell pepper, note: "large, chopped" }
      - { qty: 2, ingredient: Onion, note: "medium, chopped" }
      - { qty: 1, measure: cup, ingredient: Celery, note: diced }
      - { qty: 3, measure: clove, ingredient: Garlic, note: "large, minced" }
      - { qty: 4, measure: cup, ingredient: Beef broth, note: or water }
      - { qty: 3, ingredient: Bay leaf }
      - { qty: 1, measure: tsp, ingredient: Dried thyme }
      - { qty: 2, measure: tbsp, ingredient: Hot sauce, note: "recommended: Texas Pete" }
      - { qty: 1, measure: tbsp, ingredient: Worcestershire sauce }
      - { qty: 1, measure: tsp, ingredient: Salt }
      - { qty: 1, measure: tsp, ingredient: Dried basil }
      - { qty: 5, ingredient: Tomato, note: "medium (or 4 large), peeled and quartered" }
      - { qty: 1, measure: can, ingredient: Stewed tomatoes, note: "10-ounce extra-hot (Ro-Tel)" }
      - { qty: "1/2", measure: cup, ingredient: Parsley, note: "fresh leaves, chopped" }
    directions:
      - Season the beef with kosher salt, pepper and garlic powder. Dust with about 1/3 cup flour and toss lightly.
      - Spray a cast iron Dutch oven with cooking spray. Heat the bacon grease and oil (or all bacon grease, shortening, or oil). Brown the meat in the hot fat and remove to a large bowl with a slotted spoon.
      - In the same fat, saute the bell pepper, onions, celery, and garlic until browned and remove to the bowl.
      - Adjust the fat to about 3 tablespoons. For the roux, add about 1/4 cup flour, stirring constantly and slowly until it is a nice deep brown, being careful not to burn it.
      - Slowly stir in the broth or water. Bring to a simmer and return the beef and vegetables. Add the bay leaves, thyme, hot sauce, Worcestershire, salt and basil. Add the fresh tomatoes and the can of tomatoes.
      - Simmer about 1 hour 15 minutes, stirring occasionally. Just before serving, remove the bay leaves and stir in the parsley.

  - name: Baked Meatballs
    categories: [Beef]
    description:
      - Makes 10 meatballs. The directions top them with mozzarella, which the original ingredient list leaves out.
    ingredients:
      - { ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, ingredient: Onion, note: chopped }
      - { qty: 2, measure: clove, ingredient: Garlic, note: smashed }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: "fresh leaves, roughly chopped" }
      - { qty: 1, measure: cup, ingredient: Milk }
      - { qty: 4, measure: slice, ingredient: White bread, note: "thick, firm, crust removed" }
      - { qty: "1 1/2", measure: lb, ingredient: Ground beef }
      - { qty: "1 1/2", measure: lb, ingredient: Ground pork }
      - { qty: 1, ingredient: Egg, note: large }
      - { qty: "1/2", measure: cup, ingredient: Parmesan, note: "Parmigiano-Reggiano, freshly grated, plus more for serving" }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { ingredient: Mozzarella, note: for topping }
    directions:
      - Heat 3 tablespoons oil in an ovenproof skillet over medium heat. Add the onion, garlic, and parsley and cook until soft but still translucent, about 10 minutes. Let cool.
      - Pour enough milk over the bread in a bowl to moisten and let it soak while the onions cool.
      - Combine the meats in a large bowl. Add the egg and Parmigiano and season generously with salt and pepper. Squeeze the excess milk out of the bread and add it with the cooled onion mixture. Gently combine until just mixed; don't overwork or the meatballs will be tough. Shape into 10 meatballs.
      - Preheat the oven to 350 degrees F. Heat a little more oil in the skillet over medium heat and brown the meatballs on all sides, about 10 minutes.
      - Put them in a baking dish, shower with mozzarella and drizzle with olive oil. Bake until cooked through, about 15 minutes.

  - name: Swedish Meatballs
    categories: [Beef]
    prep_time: 30
    cooking_time: 25
    servings: 4
    description:
      - Recipe courtesy Alton Brown, 2005. Makes about 30 meatballs; serves 4 to 6.
    ingredients:
      - { qty: 2, measure: slice, ingredient: White bread, note: fresh }
      - { qty: "1/4", measure: cup, ingredient: Milk }
      - { qty: 3, measure: tbsp, ingredient: Clarified butter, note: divided }
      - { qty: "1/2", measure: cup, ingredient: Onion, note: finely chopped }
      - { qty: 1, measure: tsp, ingredient: Kosher salt, note: plus a pinch }
      - { qty: "3/4", measure: lb, ingredient: Ground chuck }
      - { qty: "3/4", measure: lb, ingredient: Ground pork }
      - { qty: 2, ingredient: Egg yolk, note: large }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper }
      - { qty: "1/4", measure: tsp, ingredient: Allspice, note: ground }
      - { qty: "1/4", measure: tsp, ingredient: Nutmeg, note: freshly grated }
      - { qty: "1/4", measure: cup, ingredient: Flour, note: all-purpose }
      - { qty: 3, measure: cup, ingredient: Beef broth }
      - { qty: "1/4", measure: cup, ingredient: Heavy cream }
    directions:
      - Preheat the oven to 200 degrees F. Tear the bread into pieces and soak in the milk in a small bowl.
      - In a 12-inch straight-sided saute pan over medium heat, melt 1 tablespoon of the butter. Add the onion and a pinch of salt and sweat until soft. Set aside.
      - In a stand mixer, combine the bread and milk, ground chuck, pork, egg yolks, 1 teaspoon salt, pepper, allspice, nutmeg, and onions. Beat on medium for 1 to 2 minutes.
      - Using a scale, portion the meat into 1-ounce meatballs and shape into rounds.
      - Heat the remaining butter in the pan over medium-low heat (or an electric skillet at 250 degrees F). Saute the meatballs until golden brown on all sides, 7 to 10 minutes. Move them to an ovenproof dish in the warm oven.
      - Reduce the heat to low and whisk the flour into the pan until lightly browned, 1 to 2 minutes. Gradually whisk in the broth until the sauce begins to thicken. Add the cream and cook until the gravy reaches the desired consistency. Pour over the meatballs and serve.

  - name: Justin Wilson's Italian Meatloaf
    categories: [Beef]
    ingredients:
      - { qty: 2, ingredient: Egg, note: beaten }
      - { qty: "3/4", measure: cup, ingredient: Seasoned bread crumbs }
      - { qty: "1 1/2", measure: cup, ingredient: Tomato juice, note: divided }
      - { qty: "1/2", measure: tsp, ingredient: Mint, note: "dried, crushed" }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: "fresh, chopped" }
      - { qty: "1/2", measure: tsp, ingredient: Oregano, note: dried }
      - { ingredient: Salt, note: to taste }
      - { ingredient: Hot sauce, note: to taste }
      - { qty: 1, measure: cup, ingredient: Parmesan, note: "grated, divided" }
      - { qty: 2, measure: tsp, ingredient: Garlic, note: minced }
      - { qty: 2, measure: lb, ingredient: Ground beef, note: lean }
      - { qty: "1/4", measure: lb, ingredient: Ham, note: finely chopped }
      - { qty: "1/4", measure: cup, ingredient: Mozzarella, note: grated }
      - { qty: "1/2", measure: cup, ingredient: Pepperoncini, note: finely chopped }
      - { qty: "1/2", measure: cup, ingredient: Green olives, note: chopped }
      - { qty: "1/2", measure: cup, ingredient: Black olive, note: chopped }
      - { qty: 1, measure: cup, ingredient: Onion, note: finely chopped }
      - { qty: 1, measure: tsp, ingredient: Garlic powder }
      - { qty: "1/2", measure: tsp, ingredient: Cayenne pepper, note: ground }
      - { qty: 1, measure: cup, ingredient: Red wine, note: dry }
      - { qty: 2, measure: tbsp, ingredient: Olive oil }
    directions:
      - Preheat the oven to 350 degrees F.
      - In a large bowl mix the eggs, bread crumbs, 1/2 cup of the tomato juice, parsley, mint, oregano, salt, hot sauce, half the Parmesan, and the minced garlic. Using your hands, mix in the ground beef and ham.
      - Turn the meat onto a piece of wax paper and form into a rectangle about 1 inch thick and roughly 9 by 13 inches.
      - In a separate bowl, mix the mozzarella, pepperoncini, olives and onion. Spread on top of the meat, leaving a small margin. Lift the end of the paper and roll the meat up like a jelly roll. Put seam side down in a baking dish.
      - Mix the garlic powder, salt, cayenne, wine, remaining tomato juice, and olive oil and pour over the loaf, placing any remaining cheese mixture on top. Sprinkle with the remaining Parmesan and bake for 1 to 1 1/2 hours.

  - name: Good Eats Meatloaf
    categories: [Beef]
    description:
      - Alton Brown's meatloaf, cooked to 155 degrees F with a probe thermometer.
    ingredients:
      - { qty: 6, measure: oz, ingredient: Crouton, note: garlic-flavored }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: ground }
      - { qty: "1/2", measure: tsp, ingredient: Cayenne pepper }
      - { qty: 1, measure: tsp, ingredient: Chili powder }
      - { qty: 1, measure: tsp, ingredient: Dried thyme }
      - { qty: "1/2", ingredient: Onion, note: roughly chopped }
      - { qty: 1, ingredient: Carrot, note: peeled and broken }
      - { qty: 3, measure: clove, ingredient: Garlic, note: whole }
      - { qty: "1/2", ingredient: Red bell pepper }
      - { qty: 18, measure: oz, ingredient: Ground chuck }
      - { qty: 18, measure: oz, ingredient: Ground sirloin }
      - { qty: "1 1/2", measure: tsp, ingredient: Kosher salt }
      - { qty: 1, ingredient: Egg }
      - { qty: "1/2", measure: cup, ingredient: Ketchup, note: for the glaze }
      - { qty: 1, measure: tsp, ingredient: Ground cumin, note: for the glaze }
      - { measure: dash, ingredient: Worcestershire sauce, note: for the glaze }
      - { measure: dash, ingredient: Hot sauce, note: for the glaze }
      - { qty: 1, measure: tbsp, ingredient: Honey, note: for the glaze }
    directions:
      - Heat the oven to 325 degrees F.
      - In a food processor, pulse the croutons, black pepper, cayenne, chili powder, and thyme to a fine texture. Place in a large bowl.
      - Pulse the onion, carrot, garlic, and red pepper in the food processor until finely chopped but not pureed. Combine the vegetables, ground sirloin, and ground chuck with the crumb mixture. Season with the kosher salt. Add the egg and combine thoroughly without squeezing the meat.
      - Pack the mixture into a 10-inch loaf pan to shape it, then turn it out onto the center of a parchment-lined baking sheet. Insert a temperature probe at a 45-degree angle into the top, not touching the tray, and set it for 155 degrees F.
      - Combine the glaze ingredients. Brush the glaze onto the meatloaf after about 10 minutes of cooking, then bake until the probe reaches 155 degrees F.

  - name: Meatloaf with Tomato Gravy
    categories: [Beef]
    description:
      - From Food Network Kitchens.
    ingredients:
      - { qty: "1/2", measure: cup, ingredient: Bread crumbs, note: dry }
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: "1/2", ingredient: Onion, note: "medium, diced" }
      - { qty: 2, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 2, measure: tsp, ingredient: Oregano, note: dried }
      - { qty: "2 1/2", measure: tsp, ingredient: Kosher salt }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: "2 1/2", measure: lb, ingredient: Meatloaf mix, note: or a pork and beef combination }
      - { qty: "1/3", measure: cup, ingredient: Parmesan, note: grated }
      - { qty: 2, measure: tsp, ingredient: Worcestershire sauce }
      - { qty: 2, ingredient: Egg, note: "large, beaten" }
      - { qty: "1/2", ingredient: Onion, note: "medium, diced, for the gravy" }
      - { qty: 3, measure: clove, ingredient: Garlic, note: "smashed, for the gravy" }
      - { qty: 1, measure: tsp, ingredient: Oregano, note: "dried, for the gravy" }
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: "extra-virgin, for the gravy" }
      - { qty: 1, measure: tbsp, ingredient: Unsalted butter }
      - { qty: 3, measure: tbsp, ingredient: Tomato paste }
      - { qty: 1, ingredient: Bay leaf }
      - { qty: 1, measure: can, ingredient: Chicken broth, note: "15-ounce, low-sodium" }
      - { qty: 1, measure: can, ingredient: Crushed tomato, note: 15 1/2-ounce }
      - { qty: "1/4", measure: cup, ingredient: Parmesan, note: "grated, for the gravy" }
      - { qty: 1, measure: tsp, ingredient: Red wine vinegar }
      - { qty: 1, measure: tsp, ingredient: Kosher salt, note: for the gravy }
      - { ingredient: Black pepper, note: freshly ground }
    directions:
      - Preheat the oven to 350 degrees F.
      - Toast the bread crumbs in a dry skillet over medium heat until browned and fragrant, about 1 minute. Transfer to a large bowl.
      - Add the olive oil, onions, garlic, oregano, salt, and pepper to the skillet and cook until the onions are tender, about 8 minutes. Let cool slightly, then add to the bread crumbs with the meat, cheese, and Worcestershire. Toss and mix gently. Add the eggs and stir to coat the meat completely.
      - Transfer to a foil-lined sheet pan and gently press into shape. Bake until an instant-read thermometer reads 160 degrees F in the center, about 45 minutes. Tent with foil and rest 15 minutes.
      - "Gravy: cook the onions, garlic, and oregano in the olive oil and butter in a large skillet over medium-high heat until browned, about 6 minutes. Add the tomato paste and bay leaf and stir until the paste turns brick red, about 3 minutes. Add the broth and crushed tomatoes and bring to a boil. Simmer until thickened, about 5 minutes. Whisk in the Parmesan, vinegar, salt, and pepper. Discard the bay leaf."
      - Slice the meatloaf and serve with the gravy.

  - name: Simple Meatloaf
    categories: [Beef]
    ingredients:
      - { qty: 1, measure: lb, ingredient: Ground beef }
      - { qty: "1 1/4", measure: tsp, ingredient: Salt }
