    servings: 16
    description:
      - Shredded steak with peppers, onions and tomatoes. Recipe courtesy Ingrid Hoffmann, 2008. Her Delicioso Adobo here is the same blend as Adobo Seasoning (its own recipe).
      - "Inactive prep: 15 minutes."
    ingredients:
      - { qty: 6, measure: lb, ingredient: Flank steak }
      - { qty: "3/4", measure: cup, ingredient: Adobo seasoning, note: Delicioso Adobo }
      - { qty: "1/2", measure: cup, ingredient: Worcestershire sauce }
