  - name: Yucca with Cuban Mojo
    categories: [Cuban, Vegetables]
    ingredients:
      - { qty: 4, measure: lb, ingredient: Cassava, note: frozen yucca }
      - { qty: 4, ingredient: Yellow onion, note: "medium, thinly sliced" }
      - { qty: 24, measure: clove, ingredient: Garlic, note: thinly sliced }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1/2", measure: cup, ingredient: Lime juice, note: about 6 limes }
      - { qty: "1/2", measure: cup, ingredient: Vegetable oil }
      - { qty: "1/4", measure: cup, ingredient: Oregano, note: "fresh leaves, chopped" }
    directions:
      - Bring a large pot of salted water to a boil. Add the yucca and boil until tender, about 30 minutes. Drain and place on a serving platter.
      - Heat the oil in a small skillet over high heat, add the onions and garlic and cook about 1 minute, making sure they don't start to brown; season with salt and pepper.
      - Pour the onions and garlic directly over the yucca. Pour the lime juice on top and sprinkle with oregano.
