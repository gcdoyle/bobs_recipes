  - name: Ingrid Hoffmann's Cuban Roasted Pork Leg (Pernil)
    categories: [Cuban, Pork]
    prep_time: 25
    cooking_time: 330
    servings: 10
    description:
      - Recipe courtesy Ingrid Hoffmann, 2008. Her Delicioso Adobo is the same blend as Adobo Seasoning with Salt (its own recipe).
      - "Inactive prep: 50 minutes, plus at least 4 hours marinating."
    ingredients:
      - { qty: 12, measure: clove, ingredient: Garlic }
      - { qty: 1, measure: tbsp, ingredient: Salt, note: coarse }
      - { qty: 6, measure: sprig, ingredient: Oregano, note: fresh leaves }
      - { qty: "1/2", measure: cup, ingredient: Adobo seasoning, note: "Delicioso Adobo" }
      - { qty: 1, measure: cup, ingredient: Mojo, note: store-bought mojo sauce }
      - { qty: 2, measure: cup, ingredient: Orange juice }
      - { qty: 4, ingredient: Lime, note: juiced }
      - { qty: 1, ingredient: Pork leg, note: "bone-in whole fresh, 14 to 16 pounds" }
    directions:
      - Place the garlic cloves on a cutting board. Slice them in half lengthwise and smash with the side of a chef's knife. Sprinkle the salt over the garlic and chop and smear the garlic against the board until it makes a paste (or use a mortar and pestle). Add the oregano, chop it into the garlic paste and mix together.
      - Put the garlic paste in a large bowl. Add the adobo, mojo, and the orange and lime juices. Mix well to combine.
      - Place the pork in a roasting pan and, using a sharp knife, score the surface in a crosshatch pattern. Pour the marinade over the pork, making sure it gets into the incisions. Cover and marinate in the refrigerator for at least 4 hours or up to 1 day, turning once or twice.
      - Preheat the oven to 450 degrees F. Uncover the pork and let stand at room temperature for 30 minutes before cooking.
      - Roast the pork for 30 minutes. Lower the oven to 350 degrees F and continue to roast until the meat is falling apart and an instant-read thermometer reads 160 degrees F in the thickest part, basting with the marinade every 30 minutes. Total roasting time is approximately 5 to 5 1/2 hours.
      - Remove from the oven and let stand 20 to 30 minutes, covered loosely with foil, before slicing.

  - name: Cuban Style Crispy Roast Pork
    categories: [Cuban, Pork]
    description:
      - Several fractions in the source file were unreadable (shown as ?); those amounts are left blank with a note.
    ingredients:
      - { qty: 2, measure: lb, ingredient: Pork loin, note: "2 to 3 pounds, trimmed roast" }
      - { qty: 2, measure: tbsp, ingredient: Olive oil }
      - { ingredient: Distilled white vinegar, note: "amount unreadable in the source (a fraction of a cup)" }
      - { qty: 4, measure: clove, ingredient: Garlic, note: "peeled, mashed and chopped" }
      - { ingredient: Yellow onion, note: "finely minced; amount unreadable in the source (a fraction of a cup)" }
      - { qty: 1, measure: tbsp, ingredient: Ground cumin }
      - { qty: 1, measure: tsp, ingredient: Garlic powder }
      - { qty: 1, measure: tsp, ingredient: Onion powder }
      - { ingredient: Cayenne pepper, note: "amount unreadable in the source (a fraction of a tablespoon)" }
      - { qty: 3, measure: tbsp, ingredient: Parsley, note: "fresh, chopped" }
      - { ingredient: Salt, note: to taste }
      - { qty: 1, measure: tbsp, ingredient: Black pepper, note: ground }
      - { qty: 6, measure: tbsp, ingredient: Dark brown sugar, note: light is OK }
    directions:
      - Combine all the dry ingredients and mash and mix them together fully. Rub the cleaned and trimmed roast vigorously and firmly with the dry mix to coat.
      - Place the rubbed roast in a zip-top bag and carefully add the olive oil and vinegar. Close the bag tightly around the roast and refrigerate overnight, turning and kneading every couple of hours.
      - Preheat the oven to 325 degrees F. Remove the roast from the bag, discarding the marinating liquid. Cake-coat the entire roast with the brown sugar.
      - Roast on a rack at 325 degrees F until done, about 1 1/2 hours (also good grilled to an internal temperature of 160 degrees F). Let rest for 15 minutes at room temperature, then slice about 1/2 inch thick.

  - name: Cuban Roast Pork with Mojo Criollo
    categories: [Cuban, Pork]
    servings: 8
    description:
      - This hearty pork dish is as indigenous to Cuba as black beans. Serve it hot with Mojo Criollo, the powerful garlic sauce; add it cold to a platter of entremeses variados, or use it to build a Media Noche sandwich. From Maria Urrutia, Memories of a Cuban Kitchen.
    ingredients:
      - { qty: 6, measure: lb, ingredient: Pork leg, note: or shoulder }
      - { qty: 6, measure: clove, ingredient: Garlic }
      - { qty: 1, measure: tsp, ingredient: Oregano, note: dried }
      - { qty: 1, measure: tbsp, ingredient: Salt }
      - { qty: "1/2", measure: tsp, ingredient: Ground cumin }
      - { ingredient: Black pepper, note: "freshly ground, to taste" }
      - { qty: "1/2", measure: cup, ingredient: Sour orange juice, note: "Seville, or 1/4 cup sweet orange juice plus 1/8 cup each fresh lime and lemon juice" }
      - { qty: "1/2", measure: cup, ingredient: Sherry, note: "dry, plus more if needed" }
      - { qty: 2, ingredient: Onion, note: "large, thinly sliced" }
      - { qty: 8, measure: clove, ingredient: Garlic, note: for the mojo criollo }
      - { qty: 1, measure: tsp, ingredient: Salt, note: for the mojo criollo }
      - { qty: 1, ingredient: Onion, note: "medium, very thinly sliced, for the mojo criollo" }
      - { qty: "1/2", measure: cup, ingredient: Sour orange juice, note: "or sweet orange juice with lime and lemon juice, for the mojo criollo" }
      - { qty: "1/2", measure: cup, ingredient: Olive oil, note: "pure Spanish, for the mojo criollo" }
    directions:
      - The night before serving, remove any excess fat from the pork and pierce the meat all over with the tip of a knife. In a mortar, mash the garlic, oregano, salt, and cumin into a paste. Place the pork in a nonreactive pan and rub it well with the paste, sprinkle liberally with pepper, add the orange juice, sherry and onions, cover with plastic wrap, and refrigerate overnight, turning the meat several times.
      - About 4 1/2 hours before serving, preheat the oven to 350 degrees F. Remove the meat from the marinade, pat it dry, and reserve the marinade. Place the pork in a foil-lined roasting pan and roast 1 hour, turning to brown on all sides.
      - Insert a meat thermometer, not touching the bone. Lower the oven to 325 degrees F, pour the reserved marinade over the pork, cover loosely with foil, and cook another 3 hours or so, turning once and basting frequently, until the meat reaches 180 degrees F. Remove the foil for the last 30 minutes, adding sherry if the meat becomes dry.
      - Remove the pork to a serving platter and let stand, covered with foil, 15 minutes before carving.
      - "For the mojo criollo: crush the garlic with the salt into a thick paste using a mortar and pestle or food processor. In a bowl, combine the garlic paste, onion, and juice, and let sit at room temperature for 30 minutes or longer. Just before serving, heat the oil in a medium pan over medium-high heat until very hot, add the garlic mixture quickly (it will splatter), stir, and serve immediately. The sauce keeps several weeks refrigerated; reheat over low heat 6 to 8 minutes."

