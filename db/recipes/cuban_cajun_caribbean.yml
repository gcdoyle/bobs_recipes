  - name: Cajun Shrimp and Rice
    categories: [Cajun, Seafood]
    prep_time: 14
    cooking_time: 6
    servings: 4
    description:
      - Courtesy Food Network Magazine.
    ingredients:
      - { qty: 1, measure: tbsp, ingredient: Unsalted butter }
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: 3, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 2, measure: tsp, ingredient: Cajun seasoning }
      - { qty: 1, measure: lb, ingredient: Shrimp, note: "large, peeled and deveined, tails intact" }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 4, ingredient: Plum tomatoes, note: chopped }
      - { qty: 2, measure: bunch, ingredient: Green onion, note: chopped }
      - { qty: 3, measure: cup, ingredient: White rice, note: cooked }
      - { qty: 3, measure: tbsp, ingredient: Parsley, note: "fresh, chopped" }
      - { ingredient: Lemon, note: "wedges, for serving (optional)" }
    directions:
      - Heat the butter, olive oil and garlic in a large skillet over medium-high heat until fragrant, about 1 minute. Add the Cajun seasoning and shrimp and cook, stirring, until the shrimp begin to curl, about 1 minute. Season with salt and pepper.
      - Add the tomatoes and scallions and cook, stirring, about 1 minute. Add the rice and 1/4 cup water and continue to cook until the rice is warmed through and the shrimp are opaque, about 3 more minutes. Stir in the parsley and serve with lemon, if desired.

  - name: Palomilla Steak
    categories: [Cuban, Beef]
    servings: 6
    description:
      - From Three Guys From Miami, contributed by Patricia Perez, Tampa. The most typical steak served in Cuban restaurants. If you don't have a Cuban butcher, have your butcher slice sirloin no more than 1/4 inch thick, or pound out a thicker slice with a meat hammer or rolling pin.
    ingredients:
      - { qty: 6, ingredient: Sirloin steak, note: "thin-sliced, boneless" }
      - { qty: 4, measure: tbsp, ingredient: Butter }
      - { qty: 1, ingredient: Lime, note: "large, juice of" }
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: for frying }
      - { qty: 3, measure: clove, ingredient: Garlic, note: peeled and minced }
      - { ingredient: Salt, note: to taste }
      - { ingredient: Black pepper, note: "freshly ground, to taste" }
    directions:
      - In a large frying pan, heat the olive oil over high heat. Just before the oil starts to smoke, add the steaks two or three at a time. Be very quick; cook each side no more than one minute, less if you like your meat rare.
      - Remove the steaks, take the pan off the heat and quickly add the lime juice to deglaze. Add the butter and garlic. Return to low heat and cook just long enough to heat through, without browning the garlic.
      - Pour the sauce over the steaks and serve with fresh lime sections.
    notes:
      - "Marble's note: I cook my steaks with slices of onion added to the sauce, for about two minutes in the sauce, to get the lime flavor into the meat."

