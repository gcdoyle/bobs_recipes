  - name: Paula's Vegetable Beef Soup
    categories: [Soups, Beef]
    description:
      - Recipe courtesy Paula Deen. Uses Paula Deen's House Seasoning (its own recipe). Chuck roast yields more meat, but short rib bones give incredible flavor. Swirl a lettuce leaf over the surface to pick up the excess fat.
    ingredients:
      - { qty: 2, measure: tbsp, ingredient: Vegetable oil, note: if using chuck roast }
      - { qty: 3, measure: lb, ingredient: Beef short ribs, note: "2 1/2 to 3 pounds, or boneless chuck roast" }
      - { qty: 4, measure: qt, ingredient: Water, note: cold }
      - { qty: 1, measure: can, ingredient: Diced tomatoes, note: 28-ounce }
      - { qty: "1 1/2", measure: cup, ingredient: Onion, note: chopped }
      - { qty: 3, measure: tbsp, ingredient: Parsley, note: "dried, plus fresh chopped for serving" }
      - { qty: 2, measure: tbsp, ingredient: Beef bouillon, note: granules }
      - { qty: 1, measure: tbsp, ingredient: Italian seasoning, note: dried }
      - { qty: 1, measure: tbsp, ingredient: House seasoning }
      - { qty: 1, measure: tbsp, ingredient: Seasoned salt, note: plus extra }
      - { qty: 1, measure: tbsp, ingredient: Worcestershire sauce }
      - { qty: 1, measure: tsp, ingredient: Celery salt }
      - { qty: 1, measure: tsp, ingredient: Garlic powder }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: "freshly ground, plus extra" }
      - { qty: 2, ingredient: Bay leaf }
      - { qty: 1, measure: cup, ingredient: Carrot, note: thinly sliced }
      - { qty: 1, measure: cup, ingredient: Celery, note: diced }
      - { qty: 1, measure: cup, ingredient: Green bean, note: "sliced, fresh or canned" }
      - { qty: 1, measure: cup, ingredient: Black-eyed pea, note: frozen }
      - { qty: 1, measure: cup, ingredient: Lima beans, note: frozen butter beans }
      - { qty: 1, measure: cup, ingredient: Okra, note: "cut, fresh or frozen" }
      - { qty: 1, measure: cup, ingredient: Corn, note: "kernels, fresh or canned" }
      - { qty: 1, measure: cup, ingredient: Potato, note: diced }
      - { qty: "1/2", measure: cup, ingredient: Elbow macaroni, note: uncooked }
    directions:
      - If using chuck, brown it in the oil in a large skillet over medium heat, about 5 minutes per side, then cut into 1 1/2- to 2-inch cubes and discard the fat. Short ribs go straight into the pot.
      - Put the beef in a large stockpot with the water, tomatoes, onions, dried parsley, bouillon, Italian seasoning, House Seasoning, seasoned salt, Worcestershire, celery salt, garlic powder, pepper and bay leaves. Bring to a boil, then cover and simmer 1 1/2 to 2 hours, until the meat is very tender.
      - If using short ribs, cut the meat off the bones, discard the bones and fat and return the meat.
      - Add the remaining vegetables and the macaroni, return to a boil, then simmer 45 minutes. Season and add fresh parsley just before serving.

