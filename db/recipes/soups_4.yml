  - name: Tuscan Tomato and Bread Soup (Pappa al Pomodoro)
    categories: [Soups]
    servings: 6
    description:
      - Recipe courtesy Anne Burrell. When blending hot soup, let it cool 5 minutes, fill the blender no more than halfway and vent the lid under a towel.
    ingredients:
      - { ingredient: Olive oil, note: "extra-virgin, plus high-quality finishing oil for garnish" }
      - { qty: 1, ingredient: Red onion, note: "large, diced" }
      - { ingredient: Kosher salt }
      - { qty: 1, measure: pinch, ingredient: Red pepper flakes, note: crushed }
      - { qty: 3, measure: clove, ingredient: Garlic, note: smashed and finely chopped }
      - { qty: 1, measure: cup, ingredient: White wine }
      - { qty: 2, measure: lb, ingredient: Tomato, note: "ripe summer tomatoes, diced" }
      - { qty: 10, measure: leaf, ingredient: Basil, note: "half whole, half in chiffonade" }
      - { qty: 2, measure: cup, ingredient: Tomato juice }
      - { qty: 2, measure: cup, ingredient: Bread, note: "day-old Italian, crusts removed, cubed" }
      - { qty: "1/2", measure: cup, ingredient: Parmesan, note: "Parmigiano-Reggiano, grated" }
    directions:
      - Coat a large wide pot with olive oil over medium heat. Cook the onions with salt and red pepper until soft and very aromatic, 8 to 10 minutes. Add the garlic for 2 to 3 minutes.
      - Add the wine and reduce by half. Stir in the tomatoes, season and cook until really soft and juicy, 12 to 15 minutes. Toss in the whole basil leaves.
      - Puree in batches and return to the pot with the tomato juice and bread. Cook over medium heat until the bread loses its shape and the soup is really thick, about 20 minutes. Adjust the seasoning.
      - Serve garnished with cheese, basil chiffonade and a big drizzle of finishing oil.

  - name: Mario Batali's Chilled Tomato and Bread Soup
    categories: [Soups]
    servings: 8
    ingredients:
      - { qty: 5, measure: lb, ingredient: Tomato, note: "overripe heirloom, cored" }
      - { qty: 3, measure: cup, ingredient: Bread, note: "day-old Italian or country, torn" }
      - { qty: "1/2", measure: cup, ingredient: Basil, note: fresh leaves }
      - { qty: 2, measure: tbsp, ingredient: Thyme, note: "fresh leaves, chopped" }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1/4", measure: cup, ingredient: Olive oil, note: extra-virgin }
      - { qty: 2, ingredient: Lemon, note: zest and juice }
      - { qty: 2, measure: tsp, ingredient: Red pepper flakes, note: hot }
      - { qty: 4, ingredient: Green onion, note: "whites and 2 inches of greens, thinly sliced" }
      - { qty: 8, measure: slice, ingredient: Baguette, note: "1/2 inch thick, toasted and cooled" }
    directions:
      - Blend the tomatoes in a food processor until liquid. Add the bread, basil and thyme, season aggressively and blend. Thin with water if too thick. Chill 1 hour.
      - Gently mix the olive oil, lemon zest and juice, red pepper flakes and scallions and season lightly with salt.
      - Divide the soup among 8 bowls, float a toast in each and top the toast with the scallion mixture.

  - name: Michael Symon's Turkey Dumpling Soup
    categories: [Soups, Poultry, Thanksgiving]
    ingredients:
      - { qty: 1, ingredient: Onion, note: "quartered, for the stock" }
