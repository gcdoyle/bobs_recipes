      - { qty: 4, measure: sprig, ingredient: Thyme, note: for the stock }
      - { qty: 1, ingredient: Bay leaf, note: for the stock }
      - { qty: 1, measure: tbsp, ingredient: Black peppercorns, note: for the stock }
      - { ingredient: Turkey, note: "carcass and wings, for the stock" }
      - { qty: 2, measure: gal, ingredient: Water, note: for the stock }
      - { qty: 1, measure: cup, ingredient: Flour, note: for the dumplings }
      - { qty: 2, ingredient: Egg, note: for the dumplings }
      - { qty: "1/4", measure: cup, ingredient: Milk, note: for the dumplings }
      - { qty: "1/4", measure: tsp, ingredient: Nutmeg, note: for the dumplings }
      - { qty: "1/4", measure: cup, ingredient: Chives, note: "chopped, for the dumplings" }
      - { ingredient: Turkey, note: "8 to 10 pounds, roasted, meat pulled and roughly chopped" }
      - { qty: 2, measure: tbsp, ingredient: Unsalted butter }
      - { qty: 1, ingredient: Onion, note: "large, diced" }
      - { qty: 2, ingredient: Carrot, note: "large, diced" }
      - { qty: 1, measure: bunch, ingredient: Celery, note: diced }
      - { qty: 2, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 1, measure: cup, ingredient: Tarragon, note: chopped }
      - { ingredient: Salt }
    directions:
      - "Stock: combine the stock ingredients in a large stockpot, bring to a boil, then simmer 5 hours, skimming impurities. Strain. You need 1 1/2 gallons."
      - "Dumplings: make a well in the flour. Whisk the eggs and milk, pour into the well with the nutmeg and chives and whisk until smooth."
      - "Soup: heat the butter in a large stockpot over medium heat and sweat the vegetables with a large pinch of salt until translucent. Add the turkey and 1 1/2 gallons stock, cover, bring to a simmer and simmer 45 minutes."
      - Bring to a boil. Spread the batter on a damp cutting board and cut off bite-size dumplings with a bench scraper or knife into the boiling soup. When they all float, boil 1 minute more, add the tarragon and serve.

