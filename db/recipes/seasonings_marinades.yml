  - name: Sofrito
    categories: [Seasonings]
    description:
      - Keeps in the refrigerator for up to 3 days, and freezes beautifully.
    ingredients:
      - { qty: 2, ingredient: Onion, note: "medium Spanish onions (about 12 ounces), cut into large chunks" }
      - { qty: 3, ingredient: Cubanelle pepper, note: "3 to 4, or Italian frying peppers; cored, seeded and cut into large chunks" }
      - { qty: 16, measure: clove, ingredient: Garlic, note: "16 to 20, peeled" }
      - { qty: 1, measure: bunch, ingredient: Cilantro, note: "large, washed" }
      - { qty: 7, ingredient: Aji dulce, note: "7 to 10, optional" }
      - { qty: 4, measure: leaf, ingredient: Culantro, note: optional }
      - { qty: 3, ingredient: Plum tomatoes, note: "3 to 4 ripe (about 1 pound), cored and cut into chunks" }
      - { qty: 1, ingredient: Red bell pepper, note: "large, cored, seeded and cut into large chunks" }
    directions:
      - Chop the onion and Cubanelle or Italian peppers in the work bowl of a food processor until coarsely chopped. With the motor running, add the remaining ingredients 1 at a time and process until smooth.
    notes:
      - "Cook's note: ajices dulces are little sweet peppers that look similar to the fiery hot Scotch bonnet or habanero peppers, only smaller. They have a wonderful fresh herbal flavor, almost like cilantro, but only a tiny bit of heat. Culantro is an herb with broad, round-tipped leaves. Its flavor is similar to cilantro, but much more intense. Both are available in Latin markets. If you cannot find them, simply increase the amount of cilantro to 1 1/2 bunches."
