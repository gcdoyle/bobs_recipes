  - name: BBQ Chicken Seasoning
    categories: [Seasonings, Marinades]
    description:
      - A honey-salt brine followed by a curry, chili and cocoa spice coating for a whole cut-up chicken.
    ingredients:
      - { qty: 1, ingredient: Chicken, note: "4 to 5-pound broiler fryer, cut into pieces" }
      - { qty: 1, measure: qt, ingredient: Water }
      - { qty: "1/2", measure: cup, ingredient: Honey }
      - { qty: "3 1/2", measure: oz, ingredient: Kosher salt, note: approximately 3/4 cup }
      - { qty: 1, measure: tbsp, ingredient: Curry powder }
      - { qty: 1, measure: tbsp, ingredient: Chili powder }
      - { qty: 2, measure: tsp, ingredient: Cocoa powder }
      - { qty: 1, measure: tsp, ingredient: Adobo seasoning, note: without pepper }
      - { qty: 1, measure: tsp, ingredient: Ground cumin }
      - { qty: 1, measure: tsp, ingredient: Smoked paprika, note: hot }
    directions:
      - Put the chicken pieces in a 1-gallon resealable plastic bag with the water, honey, and salt. Seal the bag and move around vigorously for 1 to 2 minutes to distribute the honey and dissolve the salt. Set the bag in a leak-proof container and refrigerate for 1 1/2 hours.
      - Meanwhile, combine the curry powder, chili powder, cocoa powder, adobo powder, cumin, and hot smoked paprika in a 1-gallon resealable bag.
      - Pat the chicken with paper towels until very dry. Do not rinse.
      - Put the chicken in the bag with the spice mixture and shake to thoroughly coat the chicken. Lay the pieces on a cooling rack set inside a half sheet pan. Rest for 30 minutes.

