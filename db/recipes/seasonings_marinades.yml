      - { qty: 5, ingredient: Allspice, note: berries }
      - { qty: 4, ingredient: Clove, note: whole }
    directions:
      - Bring the mixture to a boil, then let cool completely in the refrigerator or an ice chest.
      - When cold (to avoid salmonella), immerse the turkey for 6 to 8 hours, keeping the brining vessel cold in the refrigerator or an ice chest filled with ice and water.
      - Remove, rinse and pat dry.

