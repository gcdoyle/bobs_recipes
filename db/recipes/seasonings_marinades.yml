    categories: [Marinades]
    ingredients:
      - { qty: 4, measure: cup, ingredient: White wine vinegar }
      - { qty: 2, measure: tbsp, ingredient: Sugar }
      - { qty: "1/2", measure: tsp, ingredient: Red pepper flakes }
      - { qty: 1, measure: tsp, ingredient: White peppercorns }
