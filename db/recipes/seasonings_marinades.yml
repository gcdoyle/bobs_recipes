  - name: Rub for Steaks or Grilled Onions
    categories: [Seasonings]
    ingredients:
      - { qty: 2, measure: tbsp, ingredient: Paprika }
      - { qty: 1, measure: tbsp, ingredient: Ancho chili powder }
      - { qty: 2, measure: tsp, ingredient: Ground cumin }
      - { qty: 2, measure: tsp, ingredient: Ground coriander }
      - { qty: 2, measure: tsp, ingredient: Kosher salt }
      - { qty: 1, measure: tsp, ingredient: Cayenne pepper }
      - { qty: 1, measure: tsp, ingredient: Dry mustard }
      - { qty: 1, measure: tsp, ingredient: Oregano, note: dried }
      - { qty: 1, measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: 4, ingredient: Vidalia onion, note: "peeled and sliced 1/4 inch thick" }
      - { ingredient: Canola oil }
    directions:
      - Heat the grill to high.
      - Whisk together all the spices in a small bowl until combined. Brush the onions with oil on both sides. Rub 1 side of each onion with some of the spice mixture and place rub side down on the grill. Grill until golden brown and a crust has formed. Turn the onions over and continue grilling until just cooked through.
      - For steaks, rub the steaks with oil and the spice rub before grilling.

