      - { qty: 3, measure: tbsp, ingredient: Dill, note: "fresh, coarsely chopped" }
      - { qty: 3, measure: tbsp, ingredient: Cilantro, note: "fresh leaves, coarsely chopped" }
      - { qty: 6, ingredient: Cucumber, note: "kirby, washed and sliced crosswise 1/2 inch thick" }
    directions:
      - Combine the first 9 ingredients in a medium saucepan and bring to a boil. Let boil for 2 minutes, remove from the heat and let sit until cooled to room temperature. Add the dill and cilantro.
      - Place the cucumbers into a large Mason jar, pour the cooled vinegar mixture over them, cover and refrigerate for at least 24 hours or up to 4 days.

