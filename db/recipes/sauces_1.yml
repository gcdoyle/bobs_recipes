  - name: Anne Burrell's Bearnaise
    categories: [Sauces, Beef]
    description:
      - Recipe courtesy Anne Burrell. It should be full flavored, foamy and yellow - serve it on a big fat steak.
    ingredients:
      - { qty: 2, ingredient: Butter, note: sticks }
      - { qty: "1/4", measure: cup, ingredient: Tarragon vinegar }
      - { qty: "1/4", measure: cup, ingredient: White wine, note: dry }
      - { qty: 1, measure: tsp, ingredient: Black peppercorns, note: crushed }
      - { qty: 1, ingredient: Shallot, note: "small, finely chopped" }
      - { qty: 3, ingredient: Egg yolk, note: large }
      - { qty: 2, measure: tbsp, ingredient: Tarragon, note: "fresh leaves, finely chopped" }
      - { qty: 1, measure: pinch, ingredient: Cayenne pepper }
      - { ingredient: Kosher salt }
    directions:
      - Gently melt the butter over low heat and simmer about 15 minutes, skimming off the froth. Cool and ladle off the clear butterfat, leaving the milk solids - that's clarified butter.
      - Cook the vinegar, wine, peppercorns and shallot in a small saute pan over medium heat until almost all the liquid is gone. Off the heat add 1 large ice cube and let it melt.
      - Strain into a medium metal bowl, add the yolks and whisk vigorously.
      - Set the bowl over barely simmering water and whisk until fluffy, about 5 minutes. Slowly drizzle in the clarified butter, a couple of drops at first, pulling the pan off the heat if the eggs cook too fast.
      - Once all the butter is in, add the tarragon and cayenne and season with salt.

  - name: Black-Eyed Pea Salad
    categories: [Salads, Beans, Cajun]
    description:
      - Recipe courtesy Emeril Lagasse. Refrigerate at least 4 hours, preferably overnight, and let it sit at room temperature 30 minutes before serving.
    ingredients:
      - { qty: 5, measure: cup, ingredient: Black-eyed pea, note: cooked and drained }
      - { qty: 4, measure: slice, ingredient: Bacon, note: "cooked crisp and crumbled, fat reserved" }
      - { qty: "1/2", measure: cup, ingredient: Red wine vinegar, note: plus 2 tablespoons }
      - { qty: "1/2", measure: cup, ingredient: Olive oil }
      - { qty: "1/2", measure: cup, ingredient: Red onion, note: "finely chopped (1/2 medium)" }
      - { qty: "1/2", measure: cup, ingredient: Red bell pepper }
      - { qty: 3, measure: tbsp, ingredient: Green onion, note: finely chopped }
      - { qty: 2, measure: tbsp, ingredient: Jalapeno, note: finely chopped }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: "fresh leaves, finely chopped" }
      - { qty: "1 1/2", measure: tsp, ingredient: Garlic, note: minced }
      - { qty: "1 1/2", measure: tsp, ingredient: Emeril's Essence Creole Seasoning }
      - { qty: "3/4", measure: tsp, ingredient: Salt }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: freshly ground }
    directions:
      - In a large bowl toss the peas, bacon and 3 tablespoons of the reserved bacon fat with all the remaining ingredients.
      - Cover and refrigerate at least 4 hours or overnight, stirring occasionally. Toss well just before serving.

  - name: Bleu Cheese Dressing
    categories: [Sauces, Salads]
    description:
      - Served over a wedge salad with grape tomatoes, a drizzle of extra-virgin olive oil and chives.
    ingredients:
      - { qty: "1 1/2", measure: cup, ingredient: Mayonnaise }
      - { qty: "1 1/2", measure: cup, ingredient: Sour cream }
      - { qty: 1, measure: tbsp, ingredient: Lemon juice, note: fresh }
      - { qty: 6, measure: oz, ingredient: Blue cheese, note: "mild, crumbled (3/4 cup)" }
      - { qty: 2, measure: tbsp, ingredient: Chives, note: "fresh, chopped" }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
    directions:
      - Combine the mayonnaise and sour cream in a large bowl. Squeeze in the lemon juice, fold in the blue cheese and chives and season with salt and pepper.

  - name: Tyler Florence's Caesar Salad
    categories: [Salads]
    servings: 4
    description:
      - Recipe courtesy Tyler Florence. Serves 4 to 6. The dressing uses raw egg yolks.
    ingredients:
      - { qty: 1, measure: clove, ingredient: Garlic, note: smashed with a pinch of salt and a little olive oil }
      - { qty: 4, ingredient: Anchovy, note: fillets }
      - { qty: 2, ingredient: Egg yolk }
      - { qty: 1, measure: tbsp, ingredient: Dijon mustard }
      - { qty: 2, ingredient: Lemon, note: juiced }
      - { qty: 2, measure: tbsp, ingredient: Water }
      - { qty: "1/2", measure: cup, ingredient: Olive oil, note: extra-virgin }
      - { qty: "1/4", measure: cup, ingredient: Parmesan, note: "freshly grated, plus extra for garnish" }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 2, measure: head, ingredient: Romaine lettuce }
    directions:
      - Smear the garlic paste over the inside of the salad bowl.
      - Blend the anchovies, yolks, mustard, lemon juice and water 30 seconds until smooth. With the blender running, slowly pour in the oil to emulsify. Stir in the Parmesan, a pinch of salt and some pepper.
      - Tear the lettuce into the bowl, add dressing to taste and extra Parmesan, toss well and serve immediately.

