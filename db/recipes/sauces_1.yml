# Recipes from "Sauces & Dressings.txt", part 1. Already imported from other
# files and skipped: Bob's BBQ Sauce (Bourbon or Rum, twice), Neelys BBQ Sauce,
# Mango Barbecue Sauce, Mama T's Puttanesca Sauce, Classic BBQ Rub, Emeril's
# Essence, and three sauces already part of their main recipes - Spicy
# Cilantro Sauce (Black Bean Cakes), Horseradish Cream (Classic Standing Prime
# Rib) and Horseradish Sauce (Oven-Roasted Prime Rib).
recipes:
  - name: Garlic Aioli
    categories: [Sauces]
    description:
      - Made with raw egg yolks.
    ingredients:
      - { qty: 3, measure: clove, ingredient: Garlic }
      - { qty: "1/2", measure: cup, ingredient: Red wine vinegar }
      - { qty: 2, ingredient: Egg yolk }
      - { qty: 1, measure: cup, ingredient: Peanut oil, note: or other neutral oil }
      - { ingredient: Kosher salt }
    directions:
      - Put the garlic, vinegar and egg yolks in a food processor and turn it on.
      - With the machine running, add the oil drop by drop until it thickens. Once it looks smooth and homogeneous, add the rest in a slow thin stream. Thin with a few drops of water if too thick.
      - Season with salt and taste.

