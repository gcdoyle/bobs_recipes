  - name: Bob's Hot Sauce
    categories: [Sauces]
    description:
      - "Bob's notes for next time: less or no mustard, peaches in lite syrup, honey instead of molasses, a dash of liquid smoke, and garlic cloves."
    ingredients:
      - { qty: 12, ingredient: Habanero chili, note: seeded and chopped }
      - { qty: 1, measure: can, ingredient: Peach, note: "15.5-ounce sliced in heavy syrup" }
      - { qty: "1/2", measure: cup, ingredient: Molasses, note: dark }
      - { qty: "1/2", measure: cup, ingredient: Yellow mustard }
      - { qty: "1/2", measure: cup, ingredient: Light brown sugar }
      - { qty: 1, measure: cup, ingredient: Distilled white vinegar }
      - { qty: 2, measure: tbsp, ingredient: Salt }
      - { qty: 2, measure: tbsp, ingredient: Paprika }
      - { qty: 1, measure: tbsp, ingredient: Black pepper }
      - { qty: 1, measure: tbsp, ingredient: Ground cumin }
      - { qty: "1/2", measure: tsp, ingredient: Ground coriander }
      - { qty: "1/2", measure: tsp, ingredient: Ground ginger }
      - { qty: "1/2", measure: tsp, ingredient: Allspice, note: ground }
    directions:
      - Put the peppers, peaches, molasses, mustard, brown sugar and vinegar in a food processor or blender. Add the salt, paprika, pepper, cumin, coriander, ginger and allspice.
      - Blend until liquefied. Pour into clean jars and refrigerate overnight before using.

  - name: Sawmill Gravy
    categories: [Sauces, Pork]
    description:
      - Recipe courtesy Alton Brown. Makes 2 1/2 cups. Serve over toast or biscuits.
    ingredients:
      - { qty: 1, measure: lb, ingredient: Breakfast sausage, note: bulk }
      - { qty: "1/4", measure: cup, ingredient: Flour }
      - { qty: 2, measure: cup, ingredient: Milk }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
    directions:
      - Cook the sausage in a cast iron skillet. Remove it and pour off all but 2 tablespoons fat.
      - Whisk the flour into the fat and cook over low heat 5 minutes.
      - Off the heat whisk in the milk a little at a time. Return to medium-high heat and stir occasionally as it simmers and thickens, scraping up the brown bits.
      - Season, add the crumbled sausage and serve.

  - name: Anne Burrell's Tartar Sauce
    categories: [Sauces, Seafood]
    servings: 6
    description:
      - Recipe courtesy Anne Burrell. Serves 6 to 8. Made with raw egg yolks.
    ingredients:
      - { qty: 3, ingredient: Egg yolk }
      - { qty: "1/4", measure: cup, ingredient: Malt vinegar }
      - { qty: "1 1/2", measure: cup, ingredient: Peanut oil, note: or vegetable oil }
      - { qty: 2, ingredient: Shallot, note: finely diced }
      - { qty: "3/4", measure: cup, ingredient: Cornichons, note: finely chopped }
      - { qty: "1/2", measure: cup, ingredient: Whole grain mustard }
      - { qty: 1, measure: tsp, ingredient: Celery salt }
      - { qty: 1, measure: pinch, ingredient: Cayenne pepper }
      - { ingredient: Kosher salt }
    directions:
      - Combine the yolks and vinegar in a food processor. With it running, add the oil drop by drop until it looks thick and silky, then a bit faster until it's all in.
      - Add the remaining ingredients, taste and season with salt. Refrigerate in a lidded container until ready to use.

  - name: Creole Tartar Sauce
    categories: [Sauces, Cajun, Seafood]
    description:
      - Emeril Lagasse's sauce for Crawfish Boulettes. Made with a raw egg. Best used within 24 hours.
    ingredients:
      - { qty: 1, ingredient: Egg }
      - { qty: 2, measure: tsp, ingredient: Garlic, note: minced }
      - { qty: 2, measure: tbsp, ingredient: Lemon juice, note: fresh }
      - { qty: 1, measure: tbsp, ingredient: Parsley, note: chopped }
      - { qty: 1, measure: tbsp, ingredient: Green onion, note: chopped }
      - { qty: 1, measure: cup, ingredient: Olive oil }
      - { qty: "1/4", measure: tsp, ingredient: Cayenne pepper }
      - { qty: 1, measure: tbsp, ingredient: Creole mustard, note: or whole-grain mustard }
      - { qty: 1, measure: tsp, ingredient: Kosher salt }
    directions:
      - Puree the egg, garlic, lemon juice, parsley and green onions in a food processor for 15 seconds.
      - With the processor running, pour the oil through the feed tube in a slow, steady stream. Add the cayenne, mustard and salt and pulse once or twice.
      - Cover and refrigerate 1 hour before using.

  - name: Alfredo Sauce
    categories: [Sauces, Pasta]
    ingredients:
      - { qty: 1, measure: pt, ingredient: Heavy cream }
      - { qty: "1/2", measure: cup, ingredient: Butter, note: "1 stick, unsalted, softened" }
      - { qty: 1, measure: cup, ingredient: Parmesan, note: "Parmigiano-Reggiano, freshly grated, plus more for topping" }
      - { ingredient: Black pepper, note: freshly cracked }
      - { ingredient: Parsley, note: "fresh flat-leaf, chopped, for garnish" }
    directions:
      - Heat the cream over low-medium heat in a deep saute pan. Whisk in the butter gently to melt, then stir in the cheese and season with pepper.
      - Cook fresh pasta in plenty of boiling salted water for 3 minutes, drain quickly and toss in the sauce.
      - Transfer to a warm bowl, top with more cheese and parsley and serve immediately.

  - name: Homemade Applesauce
    categories: [Sauces, Desserts]
    description:
      - Recipe by Ina Garten, 2007. Makes 2 1/2 quarts. Baked in the oven.
    ingredients:
      - { qty: 2, ingredient: Orange, note: "large navel, zested and juiced" }
      - { qty: 1, ingredient: Lemon, note: zested and juiced }
      - { qty: 3, measure: lb, ingredient: Granny Smith apple, note: about 6 to 8 }
      - { qty: 3, measure: lb, ingredient: Apple, note: "sweet red, such as Macoun, McIntosh or Winesap, about 6 to 8" }
      - { qty: "1/2", measure: cup, ingredient: Light brown sugar, note: packed }
      - { qty: 4, measure: tbsp, ingredient: Butter, note: unsalted }
      - { qty: 2, measure: tsp, ingredient: Cinnamon, note: ground }
      - { qty: "1/2", measure: tsp, ingredient: Allspice, note: ground }
    directions:
      - Preheat the oven to 350 degrees F. Put the orange and lemon zest and juice in a large bowl.
      - Peel, quarter and core the apples, saving the peel of 2 red apples, and toss them in the juice.
      - Pour the apples, reserved peel and juice into a nonreactive Dutch oven or enameled iron pot. Add the brown sugar, butter, cinnamon and allspice, cover and bake 1 1/2 hours, until the apples are soft.
      - Discard the red peel and whisk until smooth. Serve warm or at room temperature.

  - name: Joseph Realmuto's BBQ Sauce
    categories: [Sauces, BBQ]
    description:
      - Recipe by Joseph Realmuto, 2009. Makes 4 quarts.
    ingredients:
      - { qty: "1/4", measure: lb, ingredient: Butter }
      - { qty: "3/4", measure: cup, ingredient: Onion, note: minced }
      - { qty: "1/2", measure: cup, ingredient: Garlic, note: minced }
      - { qty: 2, ingredient: Lemon, note: zested }
      - { qty: 5, measure: tbsp, ingredient: Lemon juice, note: freshly squeezed }
      - { qty: "4 1/4", measure: cup, ingredient: Ketchup }
      - { qty: 1, measure: cup, ingredient: Tomato juice }
      - { qty: "3/4", measure: cup, ingredient: Light brown sugar }
      - { qty: 6, measure: tbsp, ingredient: Molasses }
      - { qty: "1/2", measure: cup, ingredient: Worcestershire sauce }
      - { qty: "1/2", measure: cup, ingredient: Chili powder }
      - { qty: 4, measure: tbsp, ingredient: White wine vinegar }
      - { qty: "1 1/2", measure: tbsp, ingredient: Chipotle, note: puree }
      - { qty: 1, measure: pinch, ingredient: Kosher salt }
      - { qty: 3, measure: cup, ingredient: Water }
    directions:
      - Melt the butter in a large heavy pot or Dutch oven over medium heat. Cook the onion 5 minutes, then the garlic 5 minutes more.
      - Stir in everything else with the 3 cups water and bring to a boil. Lower the heat and simmer 30 minutes, stirring frequently.

  - name: Honey Hoisin Barbecue Sauce
    categories: [Sauces, BBQ]
    description:
      - Use right away or store in the refrigerator.
    ingredients:
      - { qty: "1 1/2", measure: cup, ingredient: Onion, note: "yellow, chopped (1 large)" }
      - { qty: 1, measure: tbsp, ingredient: Garlic, note: "minced (3 cloves)" }
      - { qty: "1/2", measure: cup, ingredient: Vegetable oil }
      - { qty: 1, measure: cup, ingredient: Tomato paste, note: 10 ounces }
      - { qty: 1, measure: cup, ingredient: Cider vinegar }
      - { qty: 1, measure: cup, ingredient: Honey }
      - { qty: "1/2", measure: cup, ingredient: Worcestershire sauce }
      - { qty: 1, measure: cup, ingredient: Dijon mustard }
      - { qty: "1/2", measure: cup, ingredient: Soy sauce }
      - { qty: 1, measure: cup, ingredient: Hoisin sauce }
      - { qty: 2, measure: tbsp, ingredient: Chili powder }
      - { qty: 1, measure: tbsp, ingredient: Ground cumin }
      - { qty: "1/2", measure: tbsp, ingredient: Red pepper flakes }
    directions:
      - Saute the onions and garlic in the oil in a large saucepan on low heat 10 to 15 minutes, until translucent but not browned.
      - Add everything else and simmer uncovered on low heat 30 minutes.

