# Recipes from "Casseroles, Ragus'.txt", part 1. Already imported from other
# files and skipped here: Brussels Sprouts Gratin, Crab and Ricotta Cannelloni,
# Corned Beef and Cabbage, Tyler's Eggplant Parmesan, Paula Deen's Green Bean
# Casserole, Portuguese Sausage and Bean Stew, Michael Symon's Orecchiette,
# Alton Brown's Paella, Hurry Up Chicken Pot Pie and Sweet Potato Casserole.
# "Not Your Mama's Green Bean Casserole" is the same Alton Brown recipe as
# Best Ever Green Bean Casserole, so it is imported once.
recipes:
  - name: Mama's Black-Eyed Pea Casserole
    categories: [Casseroles, Beef, Beans]
    description:
      - Recipe courtesy Chris Owens.
    ingredients:
      - { qty: 1, measure: lb, ingredient: Ground beef }
      - { qty: 1, ingredient: Onion, note: "medium yellow, diced" }
      - { qty: 2, measure: clove, ingredient: Garlic, note: chopped }
      - { qty: 3, measure: cup, ingredient: Black-eyed pea, note: cooked }
      - { qty: 1, ingredient: Jalapeno, note: "medium, diced" }
      - { qty: 1, measure: can, ingredient: Diced tomatoes, note: "10-ounce, recommended Ro-tel" }
      - { qty: 1, measure: can, ingredient: Cream of mushroom soup, note: 10-ounce }
      - { qty: 1, measure: can, ingredient: Cream of chicken soup, note: 10-ounce }
      - { qty: 1, measure: can, ingredient: Enchilada sauce, note: "10-ounce, mild" }
      - { ingredient: Hot sauce, note: "a few dashes, Louisiana" }
      - { qty: 2, measure: tbsp, ingredient: Creole seasoning, note: "Emeril's Essence" }
      - { qty: 1, ingredient: Corn tortilla, note: package }
      - { ingredient: Butter }
      - { qty: 2, measure: cup, ingredient: Cheddar, note: grated }
      - { ingredient: Green onion, note: "chopped, for garnish" }
    directions:
      - Brown the ground beef in a large skillet and drain the excess grease. Add the onion, garlic, jalapeno and Essence and cook 3 to 5 minutes, until the onion softens.
      - Add the peas, tomatoes, mushroom soup, chicken soup, enchilada sauce and a few dashes of hot sauce. Simmer until warm, about 10 minutes.
      - Preheat the oven to 350 degrees F. Tear the tortillas into large pieces, butter a large casserole dish and line the bottom with tortilla pieces.
      - Spoon on a thin layer of the beef mixture, then a layer of cheese. Repeat with tortillas, beef and cheese, finishing with cheese.
      - Cover with foil and bake 35 to 45 minutes. Cut into 2-inch squares and garnish with green onion.

  - name: Paula Deen's Broccoli Casserole
    categories: [Casseroles, Vegetables]
    servings: 8
    description:
      - Recipe courtesy Paula Deen. Serves 8 to 10.
    ingredients:
      - { qty: 2, ingredient: Broccoli, note: "10-ounce packages frozen chopped, cooked and drained" }
      - { qty: 1, measure: cup, ingredient: Mayonnaise }
      - { qty: 1, measure: cup, ingredient: Cheddar, note: "sharp, grated" }
      - { qty: 1, measure: can, ingredient: Cream of mushroom soup, note: 10 3/4-ounce condensed }
      - { qty: 2, ingredient: Egg, note: lightly beaten }
      - { qty: 2, measure: cup, ingredient: Ritz crackers, note: "or other crackers, crushed" }
      - { qty: 2, measure: tbsp, ingredient: Butter, note: melted }
    directions:
      - Preheat the oven to 350 degrees F and spray a 13 by 9-inch baking dish with cooking spray.
      - In a large bowl combine the broccoli, mayonnaise, cheese, soup and eggs and mix well. Spread in the baking dish.
      - Top with the crushed crackers, pour the melted butter evenly over them and bake 35 minutes, until set and browned.

  - name: Cauliflower Gratin
    categories: [Casseroles, Vegetables]
    ingredients:
      - { qty: 1, measure: head, ingredient: Cauliflower, note: sliced }
      - { qty: 4, measure: tbsp, ingredient: Butter }
      - { qty: 3, measure: tbsp, ingredient: Flour }
      - { qty: 2, measure: cup, ingredient: Milk, note: hot }
      - { qty: "1/8", measure: tsp, ingredient: Nutmeg, note: freshly ground }
      - { qty: "1/2", measure: cup, ingredient: Gruyere cheese, note: plus more for garnish }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
    directions:
      - Preheat the oven to 400 degrees F. Blanch the cauliflower in a large pot of boiling salted water for 5 minutes, until still crisp, then drain into an ice bath.
      - Melt the butter in a saucepot over medium heat. Once it foams and subsides, add the flour and cook, whisking, 3 minutes. Add the hot milk and whisk constantly as it comes to a boil and thickens.
      - Off the heat, add a pinch of salt, a few cracks of pepper, the nutmeg and the cheese and stir until melted.
      - Pour 1/3 of the sauce into a lightly greased 9 by 9 casserole, add a layer of cauliflower and more sauce, then another layer and the rest of the sauce. Top with more cheese.
      - Bake 30 minutes, until golden brown and bubbling.

  - name: Cheesy Cauliflower Gratin
    categories: [Casseroles, Vegetables]
    ingredients:
      - { qty: 10, measure: oz, ingredient: Cauliflower, note: "frozen florets, recommended Pictsweet" }
      - { qty: 1, measure: can, ingredient: Cheddar cheese soup, note: "10.75-ounce condensed, recommended Campbell's" }
      - { qty: "1/4", measure: tsp, ingredient: Cayenne pepper }
      - { qty: "1/4", measure: tsp, ingredient: Salt }
      - { qty: "1/2", measure: cup, ingredient: Cheese, note: Mexican style shredded }
      - { qty: 2, measure: tbsp, ingredient: Parmesan, note: grated }
      - { qty: 2, measure: tbsp, ingredient: Bread crumbs, note: Italian style }
      - { qty: 1, measure: tsp, ingredient: Olive oil, note: extra-virgin }
    directions:
      - Preheat the broiler.
      - In a microwave-safe casserole stir together the cauliflower, soup, cayenne, salt and shredded cheese. Cover with plastic wrap and microwave on high 6 minutes.
      - Combine the Parmesan, bread crumbs and olive oil. Uncover the cauliflower, spoon the crumbs over and broil 1 to 2 minutes, until golden.

  - name: Chicken & Broccoli Alfredo
    categories: [Casseroles, Poultry, Pasta]
    description:
      - "From Campbell's Kitchen, made with Campbell's Condensed Cream of Mushroom Soup."
    ingredients:
      - { qty: "1/2", measure: lb, ingredient: Linguine, note: half of a 1-pound package }
      - { qty: 1, measure: cup, ingredient: Broccoli, note: fresh or frozen florets }
      - { qty: 2, measure: tbsp, ingredient: Butter }
      - { qty: "1 1/4", measure: lb, ingredient: Chicken breast, note: "skinless, boneless, cut into 1 1/2-inch pieces" }
      - { qty: 1, measure: can, ingredient: Cream of mushroom soup, note: 10 3/4-ounce condensed }
      - { qty: "1/2", measure: cup, ingredient: Milk }
      - { qty: "1/2", measure: cup, ingredient: Parmesan, note: "grated, plus more for serving" }
      - { qty: "1/4", measure: tsp, ingredient: Black pepper }
    directions:
      - Cook the linguine according to the package directions in a 3-quart saucepan, adding the broccoli for the last 4 minutes. Drain well.
      - Heat the butter in a 10-inch skillet over medium-high heat. Cook the chicken until well browned and cooked through, stirring often.
      - Stir in the soup, milk, cheese, pepper and linguine mixture and cook until hot and bubbling, stirring occasionally. Serve with more Parmesan.

  - name: Best Ever Green Bean Casserole
    categories: [Casseroles, Vegetables, Thanksgiving]
    servings: 4
    description:
      - "Recipe courtesy Alton Brown, 2007. Serves 4 to 6. The file also has it as \"Not Your Mama's Green Bean Casserole\"."
    ingredients:
      - { qty: 2, ingredient: Onion, note: "medium, thinly sliced, for the topping" }
      - { qty: "1/4", measure: cup, ingredient: Flour, note: for the topping }
      - { qty: 2, measure: tbsp, ingredient: Panko, note: for the topping }
      - { qty: 1, measure: tsp, ingredient: Kosher salt, note: for the topping }
      - { ingredient: Cooking spray }
      - { qty: 2, measure: tbsp, ingredient: Kosher salt, note: "plus 1 teaspoon, divided" }
      - { qty: 1, measure: lb, ingredient: Green bean, note: "fresh, trimmed and halved" }
      - { qty: 2, measure: tbsp, ingredient: Butter, note: unsalted }
      - { qty: 12, measure: oz, ingredient: Mushroom, note: "trimmed, 1/2-inch pieces" }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: 2, measure: clove, ingredient: Garlic, note: minced }
      - { qty: "1/4", measure: tsp, ingredient: Nutmeg, note: freshly ground }
      - { qty: 2, measure: tbsp, ingredient: Flour }
      - { qty: 1, measure: cup, ingredient: Chicken broth }
      - { qty: 1, measure: cup, ingredient: Half-and-half }
    directions:
      - Preheat the oven to 475 degrees F. Toss the onions with the 1/4 cup flour, panko and 1 teaspoon salt, spread on a sprayed sheet pan and bake until golden, about 30 minutes, tossing 2 to 3 times. Set aside and lower the oven to 400 degrees F.
      - Meanwhile bring a gallon of water and 2 tablespoons salt to a boil in an 8-quart saucepan. Blanch the beans 5 minutes, drain and plunge into ice water. Drain.
      - Melt the butter in a 12-inch cast iron skillet over medium-high heat. Add the mushrooms, 1 teaspoon salt and the pepper and cook until they give up some liquid, 4 to 5 minutes. Add the garlic and nutmeg and cook 1 to 2 minutes.
      - Sprinkle with the 2 tablespoons flour and cook 1 minute. Add the broth and simmer 1 minute, then lower to medium-low, add the half-and-half and cook until thickened, 6 to 8 minutes.
      - Off the heat stir in 1/4 of the onions and all of the beans. Top with the remaining onions and bake until bubbly, about 15 minutes.

  - name: Clinton Kelly's Green Bean Casserole with Caramelized Onions and Puff Pastry
    categories: [Casseroles, Vegetables, Thanksgiving]
    ingredients:
      - { qty: "1 1/2", measure: lb, ingredient: Green bean, note: "trimmed, cut into 1-inch pieces" }
      - { qty: 2, ingredient: Onion, note: "large sweet yellow, halved and sliced" }
      - { qty: 1, measure: clove, ingredient: Garlic, note: minced }
      - { qty: "1/2", measure: cup, ingredient: White wine }
      - { qty: 3, measure: tbsp, ingredient: Butter, note: divided }
      - { qty: 2, measure: tbsp, ingredient: Flour, note: plus more for rolling }
      - { qty: "1 3/4", measure: cup, ingredient: Milk, note: whole }
      - { qty: 8, measure: oz, ingredient: Cheddar, note: "high quality shredded blend" }
      - { qty: 1, measure: tbsp, ingredient: Dijon mustard }
      - { qty: 3, measure: dash, ingredient: Hot sauce }
      - { qty: "1/4", measure: cup, ingredient: Parmesan, note: divided }
      - { qty: 1, ingredient: Puff pastry, note: "sheet, frozen, thawed" }
      - { qty: 1, ingredient: Egg, note: beaten }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly cracked }
    directions:
      - Melt 1 tablespoon butter in a large saute pan over medium heat, add the onions and salt and cook until brown and caramelized. Add the garlic and cook 1 minute. Deglaze with the wine and reduce by half.
      - Blanch the beans in salted boiling water, plunge into ice water and drain. Toss them in the pan with the onions, then transfer to a 9 by 13 casserole.
      - For the sauce, melt the remaining 2 tablespoons butter in a saucepan, whisk in the flour and cook over medium heat until golden. Slowly whisk in the milk and cook until thickened. Add the mustard, cheddar and 2 tablespoons Parmesan and stir until melted. Season with salt, pepper and hot sauce.
      - Pour the sauce over the beans and press into an even layer. Roll the puff pastry on a floured surface to the size of the dish and lay it over, folding the edges over the sides.
      - Brush with egg wash and sprinkle with the remaining Parmesan and pepper. Set on a baking sheet and bake at 400 degrees F for 20 to 25 minutes, until golden.

  - name: Sausage and Pepper Frittata
    categories: [Casseroles, Eggs, Sausage]
    servings: 4
    description:
      - Recipe courtesy Anne Burrell.
    ingredients:
      - { ingredient: Olive oil, note: extra-virgin }
      - { qty: 3, ingredient: Italian sausage, note: "hot links, removed from the casing and crumbled" }
      - { qty: 1, ingredient: Red bell pepper, note: 1/4-inch dice }
      - { qty: 1, ingredient: Yellow bell pepper, note: 1/4-inch dice }
      - { qty: 1, measure: cup, ingredient: Parmesan, note: "Parmigiano-Reggiano, grated" }
      - { qty: 12, ingredient: Egg, note: beaten with 1/4 cup water }
      - { ingredient: Salt }
    directions:
      - Preheat the oven to 350 degrees F.
      - Coat a nonstick 10-inch saute pan with olive oil. Brown the sausage, then add the peppers and saute until soft.
      - Stir the Parmigiano into the beaten eggs and season lightly with salt. With a heat-proof spatula stir the eggs into the pan to distribute the sausage and peppers.
      - Once the eggs set on the bottom and sides, bake 7 to 8 minutes, until cooked through. Cut into wedges and serve hot or at room temperature.

  - name: Eggplant and Sweet Sausage Bake
    categories: [Casseroles, Vegetables, Sausage]
    description:
      - Recipe courtesy Emeril Lagasse.
    ingredients:
      - { qty: "1/4", measure: cup, ingredient: Olive oil }
      - { qty: "1/2", measure: lb, ingredient: Italian sausage, note: "sweet, removed from the casing" }
      - { qty: 1, ingredient: Eggplant, note: "medium, peeled, 1-inch cubes (about 1 pound)" }
      - { qty: "1 1/2", measure: tsp, ingredient: Salt }
      - { qty: "1/2", measure: tsp, ingredient: Cayenne pepper }
      - { qty: "1/4", measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: 1, measure: cup, ingredient: Onion, note: chopped }
      - { qty: "1/4", measure: cup, ingredient: Bell pepper, note: chopped }
      - { qty: "1/4", measure: cup, ingredient: Celery, note: chopped }
      - { qty: "1/2", measure: tsp, ingredient: Thyme, note: dried }
      - { qty: "1/2", measure: tsp, ingredient: Oregano, note: dried }
      - { qty: 2, measure: tbsp, ingredient: Garlic, note: minced }
      - { qty: 2, measure: cup, ingredient: Chicken stock }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: chopped }
      - { qty: 1, measure: cup, ingredient: Bread crumbs, note: fine dried }
      - { qty: "1/2", measure: cup, ingredient: Parmesan, note: grated }
    directions:
      - Preheat the oven to 375 degrees F.
      - Heat the oil in a large skillet over medium-high heat and brown the sausage. Add the eggplant, salt, cayenne and black pepper and saute 2 to 3 minutes, until slightly soft.
      - Add the onions, bell peppers and celery and saute 2 to 3 minutes. Add the thyme, oregano and garlic and cook about 1 minute.
      - Add the stock and parsley and cook about 3 minutes, stirring. Off the heat mix in the bread crumbs and cheese.
      - Spoon into a casserole dish and bake about 45 minutes, until bubbly and golden brown.

  - name: Cheesy Squash Casserole
    categories: [Casseroles, Vegetables]
    servings: 6
    description:
      - Serves 6 to 8. It appears twice in the file.
    ingredients:
      - { qty: 1, measure: tbsp, ingredient: Vegetable oil }
      - { qty: 6, ingredient: Yellow squash, note: "medium, thinly sliced" }
      - { qty: 1, ingredient: Vidalia onion, note: "large, thinly sliced" }
      - { qty: 1, measure: tbsp, ingredient: Butter }
      - { qty: "1/2", measure: cup, ingredient: Parmesan, note: grated }
      - { qty: 1, measure: cup, ingredient: Cheddar, note: "sharp, shredded" }
      - { qty: "1/2", measure: cup, ingredient: Sour cream }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 1, ingredient: Ritz crackers, note: "sleeve, crushed medium to fine" }
    directions:
      - Preheat the oven to 350 degrees F and grease a 2-quart casserole.
      - Heat the oil in a large skillet over medium heat and saute the squash, onion and butter until soft.
      - Transfer to a bowl and stir in the Parmesan, Cheddar and sour cream. Season with salt and pepper.
      - Spread in the dish, sprinkle the cracker crumbs evenly over the top and bake 20 minutes, until golden and bubbly.

  - name: Galumkis
    categories: [Casseroles, Pork, Beef]
    description:
