      - { qty: 1, measure: splash, ingredient: Red wine }
      - { ingredient: Allspice }
      - { ingredient: Nutmeg }
      - { ingredient: Parsley }
      - { ingredient: Sauerkraut }
      - { ingredient: Sugar }
      - { ingredient: Tomato juice }
    notes:
      - Ingredients only; the file has no directions for this one.

  - name: Bob's Stuffed Cabbage (Golumkis)
    categories: [Casseroles, Pork, Beef]
    description:
      - Bob's own method. Try to balance the size of the dish, the amount of filling and the tomato mixture to keep it moist.
    ingredients:
      - { qty: 1, measure: head, ingredient: Cabbage }
      - { ingredient: Vinegar, note: for the parboiling water }
      - { qty: 2, ingredient: Onion, note: chopped }
      - { qty: 1, measure: lb, ingredient: Bacon, note: diced }
      - { qty: 8, measure: clove, ingredient: Garlic, note: chopped }
      - { qty: 1, measure: bunch, ingredient: Celery, note: chopped }
      - { qty: 1, measure: bunch, ingredient: Parsley, note: chopped }
      - { qty: 1, measure: lb, ingredient: Ground pork, note: or 1 1/2 lb each pork and beef and no veal }
      - { qty: 1, measure: lb, ingredient: Ground beef }
      - { qty: 1, measure: lb, ingredient: Ground veal }
      - { qty: 2, measure: cup, ingredient: Rice, note: parboiled and strained }
      - { qty: "1/3", measure: tsp, ingredient: Cinnamon }
      - { qty: "1/3", measure: tsp, ingredient: Nutmeg, note: ground }
      - { qty: 2, measure: tsp, ingredient: Paprika }
      - { qty: 4, ingredient: Egg }
      - { ingredient: Sauerkraut, note: drained }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
      - { qty: 1, measure: can, ingredient: Tomato, note: "large can tomato puree" }
      - { qty: 3, measure: tbsp, ingredient: Sugar }
      - { qty: 8, ingredient: Clove, note: whole }
      - { qty: 1, measure: can, ingredient: Tomato juice, note: large can tomato or V8 juice }
    directions:
      - Parboil the cabbage in water with vinegar added.
      - Saute the onions and bacon. Add the garlic, celery and parsley, then the ground pork, beef and veal. Let cool.
      - Add the rice, cinnamon, nutmeg, paprika and eggs and mix.
      - Stuff and roll the wilted cabbage leaves and arrange in layers in a casserole dish. Cover each layer with a mixture of the chopped remaining cabbage leaves and hearts, sauerkraut, salt and pepper, and the tomato puree - lightly over each layer and heavy on top.
      - Sprinkle the top with the sugar and whole cloves and pour in the tomato or V8 juice.
      - Cover and bring to a boil in a 500 degree oven, then reduce to 350 degrees and bake 2 1/2 hours, uncovering at the end to brown.

  - name: Stuffed Cabbage
    categories: [Casseroles, Beef]
    servings: 8
    description:
      - Recipe courtesy Wayne Harley Brachman.
    ingredients:
      - { qty: 2, measure: head, ingredient: Cabbage, note: "large; outer leaves for rolling, inside leaves shredded" }
      - { qty: "1 1/2", measure: lb, ingredient: Ground beef, note: for the stuffing }
      - { qty: "1 1/2", measure: cup, ingredient: Barley, note: "cooked in beef stock per the package, for the stuffing" }
      - { qty: 1, ingredient: Onion, note: "large, minced, for the stuffing" }
      - { qty: 4, measure: clove, ingredient: Garlic, note: "minced, for the stuffing" }
      - { qty: 1, measure: tsp, ingredient: Ground cumin, note: for the stuffing }
      - { qty: 1, measure: tsp, ingredient: Paprika, note: "sweet, for the stuffing" }
      - { qty: 1, ingredient: Egg, note: "large, for the stuffing" }
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: for the sauce }
      - { qty: 1, measure: tbsp, ingredient: Canola oil, note: for the sauce }
      - { qty: 1, ingredient: Onion, note: "large, coarsely chopped, for the sauce" }
      - { qty: 3, measure: clove, ingredient: Garlic, note: "minced, for the sauce" }
      - { qty: 2, measure: cup, ingredient: Beef stock, note: strong }
      - { qty: 1, measure: cup, ingredient: Tomato sauce }
      - { qty: 1, measure: tbsp, ingredient: Paprika, note: "sweet, for the sauce" }
    directions:
      - If the leaves don't peel off, blanch the whole head in boiling water until each layer strips off. You need 16 big leaves. Cook them 2 minutes until pliable, drain and cut out the thick part of the stem.
      - Mix the stuffing ingredients, form 1/4 cup into an oval and place in the center of a leaf. Roll once from the stem end, tuck in the sides and roll up.
      - Preheat the oven to 325 degrees F.
      - Saute the onion in the oils until golden, then the garlic for 1 more minute. Add the tomato sauce and stock and whisk in the paprika.
      - Spread the shredded remaining cabbage in a large baking dish, arrange the rolls seam side down on top and cover with the sauce.
      - Bake covered 1 hour, adding liquid as needed to keep the cabbage moist, then uncover and bake another hour.

  - name: Anne Burrell's Lasagna
    categories: [Casseroles, Pasta, Sausage]
    servings: 6
    description:
      - Recipe courtesy Anne Burrell. Serves 6 to 8. For the best slicing, make and bake it the day before and reheat before slicing.
    ingredients:
      - { ingredient: Kosher salt }
      - { qty: 24, measure: oz, ingredient: Lasagna noodles, note: 1 1/2 (16-ounce) boxes }
      - { ingredient: Olive oil }
      - { qty: 1, measure: lb, ingredient: Italian sausage, note: bulk }
      - { qty: 4, measure: clove, ingredient: Garlic, note: "smashed, divided" }
      - { ingredient: Red pepper flakes }
      - { qty: 12, measure: oz, ingredient: Cremini mushroom, note: "stems removed, caps sliced" }
      - { qty: 1, ingredient: Zucchini, note: halved lengthwise and cut on the bias }
      - { qty: 2, measure: cup, ingredient: Ricotta }
      - { qty: 2, measure: cup, ingredient: Parmesan, note: "Parmigiano-Reggiano, grated, divided" }
      - { qty: 2, ingredient: Egg }
      - { qty: 7, measure: leaf, ingredient: Basil, note: "6 to 7, chiffonade" }
      - { ingredient: "Anne Burrell's Marinara Sauce", note: 1 recipe }
      - { qty: 1, measure: lb, ingredient: Mozzarella, note: grated }
    directions:
      - Cook the noodles in batches in a large pot of well-salted boiling water until soft and pliable but not limp, 6 to 7 minutes. Lay flat on a sheet tray to cool.
      - Coat a large saute pan with olive oil over medium-high heat and cook the sausage until brown and crumbly. Drain on paper towels.
      - Wipe out the pan, add fresh oil, 2 cloves garlic and a pinch of red pepper. When the garlic is golden, discard it, add the mushrooms, season with salt and cook until soft and dark brown, 4 to 5 minutes. Remove, then repeat with the remaining garlic and the zucchini.
      - Combine the ricotta, half the Parmigiano, the eggs and basil and season with salt. Preheat the oven to 350 degrees F.
      - Spread a couple of ladles of sauce in a deep 9 by 13-inch dish and cover with noodles. Spread 1/3 of the ricotta mixture, then a layer of noodles going the other direction.
      - Spread with sauce, then 1/3 of the sausage, mushrooms and zucchini, then mozzarella and Parmigiano. Repeat until the pan is full, ending with noodles, sauce, mozzarella and Parmigiano.
      - Cover with foil, set on a baking sheet and bake until hot and bubbly, about 1 hour 15 minutes, uncovering for the last 15 minutes. Let cool 20 minutes before slicing.

  - name: Lasagna al Forno
    categories: [Casseroles, Pasta, Beef]
    servings: 12
    description:
      - Recipe courtesy Tyler Florence.
    ingredients:
      - { qty: 1, measure: lb, ingredient: Lasagna noodles, note: dried }
      - { ingredient: Olive oil }
      - { qty: 1, ingredient: Onion, note: chopped }
      - { qty: 2, measure: clove, ingredient: Garlic, note: sliced }
      - { qty: 2, measure: tbsp, ingredient: Basil, note: "fresh, chopped" }
      - { qty: 2, measure: tbsp, ingredient: Oregano, note: "fresh, chopped, for the meat" }
      - { qty: 3, ingredient: Bay leaf }
      - { qty: "1 1/2", measure: lb, ingredient: Ground beef }
      - { qty: 1, measure: lb, ingredient: Italian sausage, note: ground }
      - { qty: 6, measure: oz, ingredient: Tomato paste, note: 1 can }
      - { qty: 30, measure: oz, ingredient: Ricotta, note: 2 containers }
      - { qty: "1/4", measure: cup, ingredient: Parsley, note: "Italian flat-leaf, finely chopped" }
      - { qty: 2, measure: tbsp, ingredient: Oregano, note: "fresh, chopped, for the ricotta" }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
      - { qty: 2, ingredient: Egg, note: lightly beaten }
      - { qty: "1/2", measure: cup, ingredient: Parmesan, note: "grated, plus more for topping" }
      - { qty: 4, measure: cup, ingredient: Tomato sauce, note: prepared }
      - { qty: 1, measure: lb, ingredient: Mozzarella, note: "shredded, plus more for topping" }
    directions:
      - Cook the noodles in plenty of boiling salted water until pliable and barely tender, about 10 minutes, stirring to prevent sticking. Drain and coat with olive oil.
      - Coat a large skillet with olive oil and saute the onion, garlic, basil, oregano and bay leaves over medium heat for 5 minutes. Brown the beef and sausage, about 15 minutes, and drain the fat. Stir in the tomato paste and let cool.
      - Combine the ricotta, parsley and oregano, stir in the eggs and Parmesan and season with salt and pepper.
      - Coat the bottom of a 13 by 9-inch pan with a ladle of sauce. Arrange 4 noodles lengthwise, slightly overlapping, and line each end of the pan with a noodle to hold in the corners.
      - Spread half the meat, then half the ricotta, then half the mozzarella and a ladle of sauce. Repeat, then top with noodles, sauce, mozzarella and Parmesan. Tap the pan to release air bubbles.
      - Bake at 350 degrees F for 1 hour. Let rest 30 minutes, then cut into 2-inch squares.

  - name: Mirliton, Shrimp and Crabmeat Casserole
    categories: [Casseroles, Seafood, Cajun]
    servings: 8
    description:
      - Recipe courtesy Emeril Lagasse, 2003. Serves 8 to 10.
    ingredients:
      - { qty: 1, measure: tsp, ingredient: Butter, note: "unsalted, for the dish" }
      - { qty: 7, measure: lb, ingredient: Mirliton, note: "peeled, 1-inch thick slices, or 1 (7-pound) green pumpkin" }
      - { qty: "1/4", measure: cup, ingredient: Vegetable oil }
      - { qty: "1 1/4", measure: cup, ingredient: Onion, note: "yellow, finely chopped" }
      - { qty: "1/3", measure: cup, ingredient: Garlic, note: finely chopped }
      - { qty: "2 1/2", measure: tsp, ingredient: Salt }
      - { qty: 2, measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: 2, measure: lb, ingredient: Shrimp, note: peeled and deveined }
      - { qty: "1/2", measure: lb, ingredient: Crab, note: "lump crabmeat, picked over" }
      - { qty: "1/4", measure: cup, ingredient: Green onion, note: finely chopped }
      - { qty: "1/4", measure: cup, ingredient: Parsley, note: "fresh, finely chopped" }
      - { qty: 1, measure: lb, ingredient: Gruyere cheese, note: "or mozzarella, finely grated" }
    directions:
      - Put the mirlitons in a large pot with water 1 inch up the sides. Cover, bring to a boil and cook over medium-high heat until very tender, 40 to 45 minutes. Drain in a colander, pressing out as much liquid as possible.
      - Heat the oil in a large pot over medium-high heat and cook the onion until soft, about 4 minutes. Add the garlic and cook 1 minute.
      - Add the mirliton, salt and pepper and cook, stirring often, until very thick and most of the liquid has evaporated, 30 to 40 minutes. Watch near the end that it doesn't burn.
      - Preheat the broiler. Gently stir in the shrimp, crabmeat, green onions and parsley and adjust the seasoning.
      - Transfer to the buttered dish, spread the cheese over the top and broil until bubbly and lightly browned, about 5 minutes. Serve immediately.
    notes:
      - Any bland squash can stand in for the mirliton or green pumpkin - yellow squash, zucchini or long green Italian squash. Big bland Jack o'lantern pumpkins work too, but not butternut or acorn squash.

  - name: Paula Deen's Stuffed Red Peppers
    categories: [Casseroles, Beef, Pork]
    description:
      - Recipe courtesy Paula Deen.
    ingredients:
      - { qty: 4, ingredient: Red bell pepper, note: large }
      - { qty: "3/4", measure: lb, ingredient: Ground chuck }
      - { qty: "1/2", measure: lb, ingredient: Ground pork }
      - { qty: 1, ingredient: Onion, note: "medium, chopped" }
      - { qty: 2, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 2, measure: tsp, ingredient: Beef bouillon, note: "granules, divided" }
      - { qty: 2, measure: tsp, ingredient: House seasoning, note: "Paula Deen's" }
      - { qty: 1, measure: cup, ingredient: Cooked rice }
      - { qty: "1/2", measure: cup, ingredient: Salsa, note: jarred cheese and salsa }
      - { qty: "1/2", measure: cup, ingredient: Sour cream }
      - { qty: 1, measure: cup, ingredient: Diced tomatoes }
      - { qty: "1/2", measure: cup, ingredient: Green onion, note: "tops, chopped" }
      - { qty: 1, measure: tbsp, ingredient: Soy sauce }
      - { qty: 1, measure: cup, ingredient: Water, note: hot }
    directions:
      - Preheat the oven to 350 degrees F. Halve the peppers lengthwise, leaving the stems on, and remove the seeds and ribs.
      - In a hot skillet saute the beef, pork, onion, garlic, 1 teaspoon bouillon and the house seasoning until the onions are translucent. Drain the fat.
      - Mix in the rice, cheese and salsa, sour cream, tomatoes, green onion and soy sauce, and stuff the peppers.
      - Mix the hot water with the remaining bouillon and pour into a shallow casserole. Add the peppers, cover with foil and bake 25 to 35 minutes.
      - Uncover, spoon the juices over the peppers and bake 10 to 15 minutes more.

  - name: Cajun Stuffed Peppers
    categories: [Casseroles, Cajun, Sausage]
    servings: 4
    ingredients:
      - { qty: 1, measure: cup, ingredient: Brown rice, note: long-grain }
      - { qty: "1/3", measure: cup, ingredient: Quinoa }
      - { qty: 2, ingredient: Bell pepper, note: "large green, halved lengthwise and seeded" }
      - { qty: 1, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, ingredient: Onion, note: "medium, chopped" }
      - { qty: "1/4", measure: lb, ingredient: Andouille sausage, note: finely chopped }
      - { qty: 3, measure: clove, ingredient: Garlic, note: chopped }
      - { qty: "1/2", measure: tsp, ingredient: Thyme, note: dried }
      - { qty: 1, measure: pinch, ingredient: Allspice, note: "large pinch, optional" }
      - { ingredient: Kosher salt }
      - { qty: 1, measure: can, ingredient: Diced tomatoes, note: "14-ounce, low-sodium" }
      - { qty: 1, measure: bunch, ingredient: Kale, note: "small, stems removed, leaves chopped" }
      - { ingredient: Parsley, note: "fresh, chopped, optional for topping" }
    directions:
      - Boil the brown rice in a saucepan of water for 10 minutes, then stir in the quinoa and cook until both are tender, about 15 more minutes. Drain well.
      - Meanwhile drizzle the peppers with 1 tablespoon water in a microwave-safe bowl, cover and microwave 10 minutes.
      - Heat the oil in a wide saucepan over medium-high heat and cook the onion until golden, about 5 minutes. Add the sausage, garlic, thyme, allspice and 1/2 teaspoon salt and cook until the sausage is crisp, about 3 minutes.
      - Add the tomatoes and 1 cup water, pile the kale on top, cover and cook until wilted, about 2 minutes. Stir in and bring to a simmer.
      - Arrange the peppers on top, cover and simmer until the kale is tender, about 8 minutes.
      - Divide the peppers among plates, stir the grains into the kale mixture, season with salt and spoon into the peppers. Top with parsley.

  - name: Chipotle Tamale Pie
    categories: [Casseroles, Mexican, Poultry]
    ingredients:
      - { qty: 1, measure: tbsp, ingredient: Butter, note: "unsalted, room temperature" }
      - { qty: 1, measure: tbsp, ingredient: Olive oil }
      - { qty: 1, measure: lb, ingredient: Turkey, note: "lean ground, or ground beef" }
      - { qty: 1, ingredient: Onion, note: "medium yellow, chopped" }
      - { qty: 1, ingredient: Bell pepper, note: "green, diced" }
      - { qty: 2, measure: clove, ingredient: Garlic, note: finely minced }
      - { qty: 2, measure: tsp, ingredient: Ground cumin }
      - { qty: 1, measure: can, ingredient: Pinto beans, note: "15-ounce, drained and rinsed" }
      - { qty: 1, measure: can, ingredient: Diced tomatoes, note: 8-ounce }
      - { qty: 2, ingredient: Chipotle in adobo, note: "chiles, plus 1 teaspoon adobo sauce" }
      - { qty: 1, measure: cup, ingredient: Cheddar, note: grated }
      - { qty: "1/2", measure: cup, ingredient: Cilantro, note: "fresh, chopped" }
      - { qty: 8.5, measure: oz, ingredient: Cornbread mix, note: 1 package }
      - { qty: 1, ingredient: Egg }
      - { qty: "1/3", measure: cup, ingredient: Milk }
    directions:
      - Preheat the oven to 400 degrees F and grease an 8-inch baking dish with the butter.
      - Heat the oil in a nonstick skillet over medium heat. Cook the turkey, onion, green pepper and garlic until the turkey is cooked through, about 8 minutes. Drain the fat and sprinkle with the cumin.
      - Add the beans, tomatoes, chiles and adobo sauce and bring to a boil, then simmer over medium heat until slightly thickened, about 5 minutes. Off the heat stir in the cheese and cilantro.
      - Press the mixture into an even, compact layer in the dish.
      - Mix the cornbread mix with the milk and egg per the package and spread over the filling. Bake until golden brown, 20 to 25 minutes. Let stand 5 minutes before cutting.
