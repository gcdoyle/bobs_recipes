  - name: Mango Barbecue Sauce
    categories: [BBQ, Sauces]
    ingredients:
      - { qty: 2, measure: tbsp, ingredient: Olive oil }
      - { qty: 1, ingredient: Onion, note: "diced (about 1 cup)" }
      - { qty: 1, ingredient: Red bell pepper, note: "diced (about 1 cup)" }
      - { qty: 3, measure: clove, ingredient: Garlic, note: coarsely chopped }
      - { qty: 1, measure: tsp, ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1/2", measure: tsp, ingredient: Allspice, note: ground }
      - { qty: "1/3", measure: cup, ingredient: Red wine vinegar }
      - { qty: 3, measure: tbsp, ingredient: Molasses }
      - { qty: 2, measure: tbsp, ingredient: Worcestershire sauce }
      - { qty: 2, measure: tbsp, ingredient: Lime juice }
      - { qty: "1/4", measure: cup, ingredient: Tomato sauce, note: low-sodium }
      - { qty: 1, ingredient: Mango, note: "diced (about 1 1/2 cups)" }
      - { qty: 2, ingredient: Jalapeno, note: "2 to 3, minced" }
    directions:
      - Heat the oil in a medium skillet over medium-high heat. Add the onions and cook until translucent, about 2 minutes.
      - Add the red peppers, garlic, salt and pepper, and allspice and cook for 2 minutes more. Stir in the vinegar, molasses, Worcestershire sauce, lime juice and tomato sauce and cook for 1 minute more.
      - Transfer the mixture to a blender, add the mango and jalapeno, and blend until smooth.
