  - name: Apple City Barbecue Sauce
    categories: [BBQ, Sauces]
    description:
      - Mike Mills' sauce. Refrigerate for up to 2 weeks. For a hotter sauce, add another 1/4 to 1/2 teaspoon cayenne; a little goes a long way.
    ingredients:
      - { qty: 1, measure: cup, ingredient: Ketchup }
      - { qty: "2/3", measure: cup, ingredient: Rice vinegar, note: seasoned }
      - { qty: "1/2", measure: cup, ingredient: Apple juice, note: or cider }
      - { qty: "1/4", measure: cup, ingredient: Cider vinegar }
      - { qty: "1/2", measure: cup, ingredient: Brown sugar, note: packed }
      - { qty: "1/4", measure: cup, ingredient: Soy sauce, note: or Worcestershire sauce }
      - { qty: 2, measure: tsp, ingredient: Yellow mustard, note: prepared }
      - { qty: "3/4", measure: tsp, ingredient: Garlic powder }
      - { qty: "1/4", measure: tsp, ingredient: White pepper, note: ground }
      - { qty: "1/4", measure: tsp, ingredient: Cayenne pepper }
      - { qty: "1/3", measure: cup, ingredient: Bacon bits, note: ground in a spice grinder }
      - { qty: "1/3", measure: cup, ingredient: Apple, note: peeled and grated }
      - { qty: "1/3", measure: cup, ingredient: Onion, note: grated }
      - { qty: 2, measure: tsp, ingredient: Green bell pepper, note: grated }
    directions:
      - Combine the ketchup, rice vinegar, apple juice, cider vinegar, brown sugar, soy or Worcestershire sauce, mustard, garlic powder, white pepper, cayenne, and bacon bits in a large saucepan. Bring to a boil over medium-high heat.
      - Stir in the apple, onion, and bell pepper. Reduce the heat and simmer, uncovered, 10 to 15 minutes or until it thickens slightly, stirring often.
      - Allow to cool, then pour into sterilized glass bottles or a clean jar and refrigerate.

  - name: Mike Mills' Beef Ribs
    categories: [BBQ, Beef]
    prep_time: 25
    cooking_time: 90
    servings: 4
    description:
      - Recipe courtesy Mike Mills. Serves 4 very hungry people, or cut the racks in half to serve 6 to 8. Uses Magic Dust and Apple City Barbecue Sauce (their own recipes).
      - "Inactive prep: 1 hour."
    ingredients:
      - { qty: 4, measure: rack, ingredient: Beef ribs, note: "center cut, 2 1/4 to 2 1/2 pounds each" }
      - { qty: 3, measure: cup, ingredient: Wood chips, note: "3 to 4 cups apple wood (hickory, pecan, sweet maple or cherry also work, but won't taste as sweet)" }
      - { ingredient: BBQ seasoning, note: Magic Dust }
      - { ingredient: Barbecue sauce, note: Apple City Barbecue Sauce }
      - { qty: 4, measure: cup, ingredient: Apple juice, note: in a spray bottle }
    directions:
      - "Prepping the meat: there is a skin-like membrane on the back of the ribs. Start in the middle of the rack and work a table knife or screwdriver underneath it, going all the way across and teasing it up. Slide your forefinger under it and pull the membrane straight up; it will peel from the middle."
      - Once you start cooking, don't leave the pit or grill unattended for more than about 20 minutes. Keep the temperature between 250 and 275 degrees F. If it gets too hot, shut the top and bottom drafts. Avoid cooking directly over glowing-red hot spots; if the temperature dips too low, move the ribs to a hotter spot and add some hot coals.
      - Sprinkle the ribs liberally with Magic Dust on both sides. Put them in a shallow pan, cover with plastic wrap, and refrigerate for at least 1 hour (up to a day ahead).
      - Place the ribs on the grill and cook for 1 1/2 to 2 hours. About 10 minutes before removing them, mop with sauce. When you take them off, mop again with sauce and sprinkle with more Magic Dust. Serve immediately.

  - name: Bob's Black-Eyed Peas
    categories: [Beans]
    description:
