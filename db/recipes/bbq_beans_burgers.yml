# Recipes from "BBQ,Beans & Burgers.txt". Classic BBQ Rub, Quickie Rub, Bob's Rub
# and Emeril's Essence are already in from the seasonings file.
recipes:
  - name: Kansas City-Style Rib Rub
    categories: [BBQ, Seasonings]
    description:
      - Makes about 2 cups. Use for meats and seafood to be grilled, and for making barbecue sauce. Keeps in an airtight container in a cool, dry place for up to 6 weeks. Uses Emeril's Essence Creole Seasoning (its own recipe).
    ingredients:
      - { qty: "1/3", measure: cup, ingredient: Light brown sugar }
      - { qty: "1/3", measure: cup, ingredient: Sugar }
      - { qty: "1/4", measure: cup, ingredient: Paprika }
      - { qty: 2, measure: tbsp, ingredient: Creole seasoning, note: Emeril's Essence }
      - { qty: 6, measure: tbsp, ingredient: Kosher salt }
      - { qty: 2, measure: tbsp, ingredient: Onion powder }
      - { qty: 1, measure: tbsp, ingredient: Garlic salt }
      - { qty: 1, measure: tbsp, ingredient: Black pepper, note: freshly ground }
      - { qty: 1, measure: tbsp, ingredient: Chili powder }
      - { qty: 1, measure: tsp, ingredient: Mustard powder }
      - { qty: "1/2", measure: tsp, ingredient: Poultry seasoning }
      - { qty: "1/2", measure: tsp, ingredient: Ground ginger }
      - { qty: "1/4", measure: tsp, ingredient: Allspice, note: ground }
      - { qty: "1/4", measure: tsp, ingredient: Cayenne pepper }
    directions:
      - Combine all the ingredients in a medium bowl and stir to combine, crumbling any lumps that form with the sugar or spices.

  - name: Black Bean Cakes with Spicy Cilantro Sauce
    categories: [Beans]
    servings: 4
    description:
      - Makes 8 (4-inch) cakes.
    ingredients:
      - { qty: 2, measure: tbsp, ingredient: Unsalted butter }
      - { qty: "1/2", measure: cup, ingredient: Onion, note: finely chopped }
      - { qty: "1/2", measure: cup, ingredient: Green bell pepper, note: finely chopped }
      - { qty: 2, measure: clove, ingredient: Garlic, note: "large, minced" }
      - { qty: "1 2/3", measure: cup, ingredient: Black beans, note: cooked }
      - { qty: "2/3", measure: cup, ingredient: Bread crumbs, note: fine dry }
      - { qty: "1/3", measure: cup, ingredient: Cilantro, note: "fresh leaves, chopped fine" }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 2, ingredient: Egg, note: "large, lightly beaten" }
      - { qty: 1, measure: cup, ingredient: Cornmeal, note: yellow }
      - { ingredient: Vegetable oil, note: for frying }
      - { qty: "3/4", measure: cup, ingredient: Cilantro, note: "fresh leaves, chopped, for the sauce" }
      - { qty: "1/3", measure: cup, ingredient: Vegetable oil, note: for the sauce }
      - { qty: 3, measure: tbsp, ingredient: Soy sauce, note: for the sauce }
      - { qty: 1, measure: clove, ingredient: Garlic, note: "minced, for the sauce" }
      - { qty: 1, measure: tbsp, ingredient: Lime juice, note: "fresh, for the sauce" }
      - { qty: "1/2", ingredient: Jalapeno, note: "minced, for the sauce" }
    directions:
      - Heat the butter in a small skillet over medium heat. Add the onion, bell pepper, and garlic and cook, stirring occasionally, until softened.
      - In a bowl, mash 1/3 of the beans with a fork and stir in the remaining beans, the onion mixture, bread crumbs, and cilantro and season with salt and pepper. Stir in the eggs.
      - Form the bean mixture into 8 (4-inch) patties (the mixture will be wet and soft). Gently dredge the patties in cornmeal and transfer to a large plate lined with plastic wrap. Refrigerate for 30 minutes and up to 12 hours.
      - Pour enough oil into a heavy skillet to reach 1/4 inch up the side. Heat over medium heat until hot but not smoking. Working in batches, cook the patties, turning once, until well browned, about 1 1/2 minutes per side. Drain on paper towels.
      - "For the spicy cilantro sauce: stir together the cilantro, oil, soy sauce, garlic, lime juice and jalapeno, and chill. Season with salt and pepper."
      - Divide the cakes among plates and serve with the sauce.

  - name: White Beans and Mushrooms
    categories: [Beans]
    description:
      - The source gives directions only; ingredients are taken from them.
    ingredients:
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { ingredient: Garlic }
      - { ingredient: Red pepper flakes }
      - { ingredient: Mushroom }
      - { ingredient: Cannellini beans }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
      - { ingredient: Vinegar }
      - { qty: "1/2", measure: cup, ingredient: Chicken stock }
    directions:
      - Heat a medium skillet over medium heat. Add the olive oil, then the garlic, red pepper flakes and mushrooms and cook 5 minutes to deepen the color.
      - Stir in the cannellini beans and season with salt and pepper, to taste. When the beans heat through, a minute or 2, add the vinegar and stir to cook it out, then add 1/2 cup stock to deglaze the pan. Turn off the heat and serve.

  - name: Smoked Turkey and White Bean Casserole with Herbed Crumb Topping
    categories: [Beans, Poultry]
    description:
      - Recipe courtesy Emeril Lagasse. Uses Emeril's Essence Creole Seasoning (its own recipe). Ham hocks can be used instead of turkey.
    ingredients:
      - { qty: "2 1/4", measure: lb, ingredient: Smoked turkey, note: legs or thighs }
      - { qty: 8, measure: cup, ingredient: Chicken broth }
      - { qty: "1 1/2", measure: tsp, ingredient: Creole seasoning, note: Emeril's Essence }
      - { qty: "1/4", measure: tsp, ingredient: Cayenne pepper }
      - { qty: 2, ingredient: Bay leaf }
      - { qty: "1/4", measure: cup, ingredient: Olive oil, note: plus 3 tablespoons }
      - { qty: 2, measure: cup, ingredient: Onion, note: chopped }
      - { qty: 1, measure: cup, ingredient: Celery, note: chopped }
      - { qty: "1/2", measure: cup, ingredient: Green bell pepper, note: chopped }
      - { qty: 2, measure: tbsp, ingredient: Garlic, note: minced }
      - { qty: 1, measure: tbsp, ingredient: Thyme, note: "fresh leaves, minced, plus 1 teaspoon" }
      - { qty: 1, measure: lb, ingredient: White beans, note: "dried, such as navy or cannellini, soaked overnight and drained" }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1 1/4", measure: cup, ingredient: Bread crumbs, note: dried }
      - { qty: "1/2", measure: cup, ingredient: Parmesan, note: finely grated }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: "fresh leaves, chopped" }
      - { qty: 1, measure: tbsp, ingredient: Chives, note: "fresh, chopped" }
      - { qty: 1, measure: tbsp, ingredient: Basil, note: "fresh leaves, chopped" }
    directions:
      - Using a sharp knife, score the turkey pieces about 1/4 inch deep in several places. Place the turkey in a large stockpot and add the chicken broth, Essence, cayenne and bay leaves. Add 2 cups of water and bring to a boil. Reduce to a simmer and cook, covered, until falling-from-the-bone tender, 2 1/2 to 3 hours. When cool enough to handle, remove the meat from the bones, discarding the skin and bones. Tear the meat into bite-size pieces and set aside. Reserve the stock separately.
      - In a large Dutch oven, heat 3 tablespoons of the oil until hot. Add the onions, celery, and bell pepper and cook, stirring, until softened, 4 to 6 minutes. Add the garlic and 2 teaspoons of the thyme and cook for 1 minute.
      - Add the beans and 6 cups of the reserved stock (add water if needed to make 6 cups) and return to a boil. Reduce to a simmer and cook, partially covered, until the beans are tender but still hold their shape, about 1 1/2 hours. The beans should be moist but not soupy. (If too soupy, strain the beans and reduce the cooking liquid to a thick sauce, then return it to the beans.)
      - Stir in the reserved turkey and season with salt and pepper, to taste. Transfer to a large ovenproof casserole dish. Preheat the oven to 375 degrees F.
      - In a small bowl combine the remaining thyme, bread crumbs, Parmesan, parsley, chives, and basil. Add the remaining 1/4 cup of olive oil and stir with a fork until well blended. Season with salt and pepper. Sprinkle evenly over the beans.
      - Bake for 25 to 30 minutes, or until the topping is golden brown and the beans are bubbly around the edges.

  - name: Gigante Beans
    categories: [Beans]
    description:
      - Recipe courtesy Anne Burrell. Because of the soaking time, this is definitely a plan-ahead recipe.
    ingredients:
      - { qty: 1, measure: lb, ingredient: Gigante beans, note: or corona beans }
      - { qty: 1, ingredient: Onion, note: "large, skin removed, root end left on, cut in half" }
      - { qty: 1, ingredient: Carrot, note: "large (or 2 small), peeled and halved" }
      - { qty: 2, measure: rib, ingredient: Celery, note: broken in half }
      - { qty: 3, measure: clove, ingredient: Garlic }
      - { qty: 1, measure: bunch, ingredient: Thyme, note: bundle }
      - { qty: 3, ingredient: Bay leaf }
      - { qty: 1, measure: piece, ingredient: Bacon, note: "slab bacon skin or prosciutto skin, or a couple slices of bacon" }
      - { ingredient: Kosher salt }
    directions:
      - "Soak the beans in water overnight. (Quick soak if you forgot: cover the beans with at least 2 inches of water, bring to a boil, turn off the heat and let the pot cool down naturally, then continue as if soaked overnight.)"
      - Strain the beans from the soaking water. Put the beans in a large pot and cover generously with water. Add the onion, carrot, celery, garlic, thyme, bay leaves and bacon skin.
      - Bring to a boil over medium heat. Reduce the heat and simmer until all the beans are soft, about 1 hour, adding more water if it reduces too much. Test for doneness with the 5-bean test; beans don't all cook at the same rate, so bite 5 beans and if they are all soft they are done.
      - Remove the pot from the heat. Season the water generously with salt and let sit for 15 minutes. Transfer the beans to a serving bowl and serve. If not using right away, store them in the refrigerator in their liquid.

