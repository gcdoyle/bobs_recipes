      - { qty: "1/4", measure: cup, ingredient: Ground cumin }
      - { qty: 2, measure: tbsp, ingredient: Black pepper, note: ground }
      - { qty: "1/4", measure: cup, ingredient: Granulated garlic }
      - { qty: 2, measure: tbsp, ingredient: Cayenne pepper }
    directions:
