  - name: Barbecue Baked Beans
    categories: [Beans, BBQ]
    prep_time: 5
    cooking_time: 50
    servings: 8
    description:
      - Recipe courtesy The Neelys. Uses Neelys BBQ Seasoning and Neelys BBQ Sauce (their own recipes).
    ingredients:
      - { qty: 1, measure: tbsp, ingredient: Olive oil }
      - { qty: 1, ingredient: Red bell pepper, note: chopped }
      - { qty: "1/2", ingredient: Onion, note: chopped }
      - { qty: 2, measure: clove, ingredient: Garlic, note: chopped }
      - { qty: 2, measure: can, ingredient: Baked beans, note: 28-ounce }
      - { qty: "1/2", measure: cup, ingredient: Brown sugar }
      - { qty: "1/3", measure: cup, ingredient: BBQ seasoning, note: Neelys BBQ Seasoning }
      - { qty: "1/4", measure: cup, ingredient: Molasses }
      - { qty: 1, measure: cup, ingredient: BBQ sauce, note: Neelys BBQ Sauce }
      - { qty: "3/4", measure: cup, ingredient: Beef brisket, note: "or pork, chopped" }
    directions:
      - Preheat the oven to 275 degrees F.
      - In a large Dutch oven, heat the oil over medium heat. Saute the red pepper, onion and garlic until softened, about 2 minutes.
      - Add the baked beans and remaining ingredients and bring to a low simmer. Cover and bake for 45 minutes.

  - name: Spicy Black Beans
    categories: [Beans]
    ingredients:
      - { qty: 2, measure: cup, ingredient: Black beans, note: "dried (about 1 pound), picked over, soaked overnight" }
      - { qty: 3, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: "1/2", ingredient: Onion, note: "medium, diced" }
      - { qty: 1, ingredient: Jalapeno, note: chopped }
      - { qty: 2, measure: clove, ingredient: Garlic, note: chopped }
      - { qty: 1, ingredient: Bay leaf }
      - { ingredient: Kosher salt }
      - { ingredient: Black pepper, note: freshly ground }
    directions:
      - In a large pot, soak the beans overnight covered in water by 2 inches. Drain and set aside.
      - In the same pot, heat the olive oil. Add the onion, jalapeno, garlic, and bay leaf and cook until the vegetables begin to soften, about 5 minutes.
      - Add the beans and cover with water by about 1 inch. Bring to a boil, reduce the heat, cover, and simmer for 1 to 1 1/2 hours, or until the beans are tender. Remove and discard the bay leaf. Taste and season with salt and pepper.

  - name: Yellow Rice
    categories: [Rice]
    ingredients:
      - { qty: 2, measure: cup, ingredient: Long grain rice }
      - { qty: 4, measure: cup, ingredient: Water }
      - { qty: 2, measure: clove, ingredient: Garlic, note: smashed }
      - { qty: 1, measure: tbsp, ingredient: Turmeric }
      - { qty: 1, measure: tsp, ingredient: Kosher salt }
      - { qty: 1, ingredient: Bay leaf }
    directions:
      - Put all the ingredients into a heavy-bottomed pot, stir well, and bring to a boil over medium-high heat.
      - Reduce the heat to a simmer, cover, and cook over low heat until the rice has absorbed the water, about 15 to 20 minutes. Remove from the heat and let sit, covered, for 5 minutes.
      - Discard the garlic and bay leaf, fluff with a fork, and serve.

  - name: Sauteed White Beans
    categories: [Beans]
    prep_time: 10
    cooking_time: 25
    servings: 4
    description:
      - Recipe courtesy Melissa d'Arabian. Makes 1 1/2 cups.
    ingredients:
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: "1/2", ingredient: Onion, note: "white or yellow, finely chopped" }
      - { ingredient: Kosher salt }
      - { qty: 1, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 1, measure: tsp, ingredient: Ground cumin }
      - { qty: "1/2", measure: cup, ingredient: White wine }
      - { qty: "1 1/2", measure: cup, ingredient: Navy beans, note: cooked }
      - { qty: 2, measure: tbsp, ingredient: Oregano, note: "fresh leaves, chopped (or 2 teaspoons dried)" }
      - { ingredient: Black pepper, note: freshly ground }
    directions:
      - In a small pan over medium heat, add the oil. When hot, add the onion with a pinch of salt and saute until soft, about 5 minutes. Add the garlic and cumin and cook until fragrant, about 2 minutes.
      - Raise the heat and add the white wine. Cook until reduced by half.
      - Stir in the beans and oregano and season with salt and pepper, to taste. Cook gently for 15 minutes. Transfer to a serving bowl and serve.

