  - name: Rachael Ray's Red White Beans
    categories: [Beans]
    prep_time: 5
    cooking_time: 15
    servings: 4
    description:
      - Recipe courtesy Rachael Ray. Serves 4 to 6.
    ingredients:
      - { qty: 2, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, ingredient: Onion, note: "medium to large, chopped" }
      - { qty: 2, measure: sprig, ingredient: Rosemary, note: leaves finely chopped }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: "1/4", measure: cup, ingredient: Tomato paste }
      - { qty: 1, measure: cup, ingredient: Chicken stock }
      - { qty: 2, measure: can, ingredient: Cannellini beans, note: "15-ounce, drained" }
    directions:
      - Heat the olive oil in a skillet over medium heat. Add the onions, rosemary and salt and pepper, to taste. Cook the onions until sweet and soft, 8 to 10 minutes.
      - Stir in the tomato paste for 1 minute. Add the stock, then stir in the beans and reduce the heat to low. Adjust the seasoning and turn out into a serving bowl. Keep warm until ready to serve.

  - name: Bob's Baked Beans
    categories: [Beans, BBQ]
    ingredients:
      - { qty: 42, measure: oz, ingredient: Baked beans, note: "Van Camp's: one 28-ounce can plus one 14-ounce can (or 3 14-ounce cans)" }
      - { qty: 1, ingredient: Onion, note: "large (or 2 medium), diced" }
      - { qty: 1, ingredient: Green bell pepper, note: "medium, diced" }
      - { qty: "1/4", measure: cup, ingredient: Mustard, note: brown }
      - { qty: "1/4", measure: cup, ingredient: Molasses, note: Grandma's }
      - { qty: "1/2", measure: cup, ingredient: Ketchup }
      - { qty: "1/4", measure: cup, ingredient: Rum, note: Captain Morgan's spiced }
      - { qty: "1/3", measure: tsp, ingredient: Granulated garlic }
      - { qty: 1, measure: tsp, ingredient: Liquid smoke }
      - { ingredient: Bacon, note: "diced bacon or salt pork (optional), plus strips for the top" }
      - { qty: "1/4", measure: cup, ingredient: Water, note: "or so, so the mixture is not too dry" }
    directions:
      - In a bowl, gently fold the ingredients together so as not to bruise or break up the beans.
      - Put in a baking dish, top with strips of bacon and bake at 350 degrees F until the pepper and onions are soft.

  - name: Rockin' Baked Beans
    categories: [Beans]
    prep_time: 30
    cooking_time: 60
    servings: 6
    description:
      - Recipe courtesy Anne Burrell. Serves 6 to 8.
    ingredients:
      - { ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, ingredient: Onion, note: "large, cut into 1/2-inch dice" }
      - { qty: 1, ingredient: Green bell pepper, note: "stem, seeds and pith removed, cut into 1/4-inch dice" }
      - { qty: 1, measure: pinch, ingredient: Red pepper flakes, note: "large pinch, crushed" }
      - { ingredient: Kosher salt }
      - { qty: 4, measure: clove, ingredient: Garlic, note: smashed and finely chopped }
      - { qty: 2, ingredient: Italian sausage, note: "links, casing removed and crumbled" }
      - { qty: "1/2", measure: cup, ingredient: Tomato paste }
      - { qty: 1, measure: tsp, ingredient: Cumin seeds, note: toasted and ground }
      - { qty: 2, measure: tbsp, ingredient: Dijon mustard }
      - { qty: 2, measure: tbsp, ingredient: Cider vinegar, note: apple cider vinegar }
      - { qty: 2, measure: tbsp, ingredient: Molasses }
      - { qty: 2, measure: can, ingredient: Navy beans, note: 28-ounce }
      - { qty: "2 1/2", measure: cup, ingredient: Water, note: "1 1/2 cups, plus 1 cup" }
      - { qty: 5, measure: slice, ingredient: Bacon }
    directions:
      - Coat an oven-safe pot with olive oil and put over medium-high heat. Add the onions, peppers and crushed red pepper. Season with salt and cook until the onions and peppers are soft and aromatic, about 8 to 10 minutes. Add the garlic and cook for another 2 to 3 minutes.
      - Preheat the oven to 375 degrees F.
      - Add the sausage and break it apart with a spoon. When the sausage is brown, add the tomato paste and cumin and cook for 4 to 5 minutes. Stir in the Dijon, vinegar, and molasses, then add the beans and 1 1/2 cups of water. Taste and season with salt, if needed. Bring to a boil, then reduce the heat and simmer until thick and tasty, about 15 to 20 minutes. Add the remaining cup of water.
      - Top the beans with the bacon slices. Bake until the beans are thick and the bacon is crispy, about 25 to 30 minutes. Remove from the oven and serve.

