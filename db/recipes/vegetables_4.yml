# Recipes from "Vegetables.txt", part 4 (potato salad through zucchini).
# Already in from other files: Bob's Candied Sweet Potatoes, Ellie Krieger's
# Sweet Potato-Pecan Casserole (it appears twice here), Yucca with Cuban Mojo.
recipes:
  - name: Bob's Potato Salad
    categories: [Vegetables, Salads]
    ingredients:
      - { qty: 2, measure: lb, ingredient: Red potatoes, note: "or Yukon gold, halved or quartered depending on size" }
      - { qty: 4, ingredient: Egg, note: hard-cooked }
      - { qty: "2/3", measure: cup, ingredient: Celery, note: "1 large rib, thinly sliced (1/2 to 2/3 cup)" }
      - { qty: "2/3", measure: cup, ingredient: Red onion, note: "1/2 to 2/3 cup, chopped" }
      - { qty: 2, ingredient: Pickles, note: "1 or 2 spears, diced (Claussen)" }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: "fresh flat-leaf, chopped" }
      - { qty: 1, measure: tbsp, ingredient: Dill seeds }
      - { qty: 2, measure: tbsp, ingredient: Pickle relish, note: 1 or 2 tablespoons }
      - { qty: 2, measure: tbsp, ingredient: Mustard, note: brown }
      - { qty: 1, measure: cup, ingredient: Mayonnaise }
      - { qty: "1/4", measure: cup, ingredient: Olive oil, note: extra-virgin }
      - { ingredient: Red wine vinegar }
      - { ingredient: Paprika }
    directions:
      - Start the potatoes in cold water and cook until just tender. Drain in a colander, return immediately to the warm pot and sprinkle with red wine vinegar while warm.
      - Beat the mayonnaise and olive oil together in a large bowl. Add everything else except the eggs and mix, then fold in the potatoes to coat.
      - Slice or chop the eggs, fold them in and sprinkle with paprika.

  - name: Emeril's Favorite Potato Salad
    categories: [Vegetables, Salads]
    description:
      - Recipe courtesy Emeril Lagasse, 2003. Refrigerate several hours before serving so the flavors blend.
    ingredients:
      - { qty: 14, ingredient: Red potatoes, note: "small boiling potatoes such as red bliss, about 2 1/2 pounds, scrubbed" }
      - { qty: 6, measure: slice, ingredient: Bacon, note: "cooked crisp, crumbled" }
      - { qty: 6, ingredient: Egg, note: "hard-boiled, roughly chopped" }
      - { qty: "1/3", measure: cup, ingredient: Red onion, note: finely chopped }
      - { qty: "1/3", measure: cup, ingredient: Celery, note: finely chopped }
      - { qty: 1, measure: cup, ingredient: Ranch dressing }
      - { qty: 2, measure: tbsp, ingredient: Parsley, note: "leaves, chopped" }
      - { qty: 1, measure: tsp, ingredient: Salt }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper }
    directions:
      - Cover the potatoes with water by 1 inch, bring to a boil over high heat and cook until just tender, 15 to 20 minutes. Drain, cool and halve.
      - Gently toss with the remaining ingredients and refrigerate several hours.

  - name: Deluxe Twice Baked Potatoes with Shrimp
    categories: [Vegetables, Seafood]
    servings: 4
    description:
      - Recipe courtesy Paula Deen (DFC, page 72).
    ingredients:
      - { qty: 4, ingredient: Russet potatoes, note: "6 to 8 ounces each, scrubbed and pricked all over" }
      - { ingredient: Vegetable oil, note: to coat }
      - { qty: 4, measure: slice, ingredient: Bacon }
      - { qty: 1, measure: lb, ingredient: Shrimp, note: "large, peeled, deveined, tails removed" }
      - { qty: "1 1/2", measure: tsp, ingredient: Cajun seasoning }
      - { qty: 1, measure: tsp, ingredient: Salt, note: plus a pinch }
      - { qty: 4, ingredient: Green onion, note: "white and light green thinly sliced; dark green chopped for garnish" }
      - { qty: 1, measure: cup, ingredient: Cheddar, note: grated }
      - { qty: 6, measure: tbsp, ingredient: Butter, note: softened }
      - { qty: "1/3", measure: cup, ingredient: Sour cream }
      - { qty: 4, measure: tbsp, ingredient: Mayonnaise }
      - { qty: "3/4", measure: tsp, ingredient: Black pepper, note: freshly ground }
    directions:
      - Preheat the oven to 450 degrees F. Rub the potatoes with oil and bake on a baking sheet until tender, about 1 hour.
      - Meanwhile, cook the bacon in a skillet over medium-high heat until crisp, about 7 minutes. Drain and crumble. Pour off all but 3 tablespoons of fat.
      - Cut the shrimp in thirds. Reheat the fat and cook the shrimp with the Cajun seasoning and a pinch of salt, stirring, until opaque, 2 to 3 minutes.
      - Let the potatoes cool slightly (leave the oven on). Slice off the top third of each, scoop the flesh from both parts into a bowl leaving a 1/4-inch shell, and discard the tops' skins.
      - Mash the flesh with 1 teaspoon salt, the green onion, cheese, butter, sour cream, mayonnaise and pepper. Stuff the shells, mounding the extra on top.
      - Top with the shrimp and bacon and bake until heated through, about 15 minutes. Sprinkle with the reserved green onions and serve.

  - name: Ratatouille
    categories: [Vegetables]
    description:
      - Recipe courtesy Emeril Lagasse. Serve hot or at room temperature. Bob's notes - add anchovies with the onions, and a splash of white wine.
    ingredients:
      - { qty: "1/4", measure: cup, ingredient: Olive oil, note: plus more as needed }
      - { qty: "1 1/2", measure: cup, ingredient: Yellow onion, note: small diced }
      - { qty: 1, measure: tsp, ingredient: Garlic, note: minced }
      - { qty: 2, measure: cup, ingredient: Eggplant, note: "medium diced, skin on" }
      - { qty: "1/2", measure: tsp, ingredient: Thyme, note: fresh leaves }
      - { qty: 1, measure: cup, ingredient: Green bell pepper, note: diced }
      - { qty: 1, measure: cup, ingredient: Red bell pepper, note: diced }
      - { qty: 1, measure: cup, ingredient: Zucchini, note: diced }
      - { qty: 1, measure: cup, ingredient: Yellow squash, note: diced }
      - { qty: "1 1/2", measure: cup, ingredient: Tomato, note: "peeled, seeded and chopped" }
      - { qty: 1, measure: tbsp, ingredient: Basil, note: "fresh leaves, thinly sliced" }
      - { qty: 1, measure: tbsp, ingredient: Parsley, note: "fresh leaves, chopped" }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
    directions:
      - Heat the olive oil in a large 12-inch saute pan over medium heat. Cook the onions and garlic, stirring occasionally, until wilted and lightly caramelized, 5 to 7 minutes.
      - Add the eggplant and thyme and cook until the eggplant is partially cooked, about 5 minutes.
      - Add the peppers, zucchini and squash and cook 5 minutes more. Add the tomatoes, basil, parsley, salt and pepper and cook a final 5 minutes. Stir well and serve.

  - name: Wild Rice with Wild Mushrooms
    categories: [Vegetables, Rice]
    servings: 6
    description:
      - From Bon Appetit, November 1995. Wild rice (actually a grass seed) is a New World native that pairs well with earthy mushrooms. The porcini and rice can be prepared a day ahead and refrigerated separately.
    ingredients:
      - { qty: "1 1/2", measure: cup, ingredient: Chicken broth, note: canned }
      - { qty: "3/4", measure: oz, ingredient: Dried porcini, note: rinsed under cold water }
      - { qty: "1 1/4", measure: cup, ingredient: Wild rice, note: rinsed under cold water }
      - { qty: 1, measure: tsp, ingredient: Salt }
      - { qty: "1 1/2", ingredient: Bay leaf }
      - { qty: 3, measure: tbsp, ingredient: Butter }
      - { qty: "3/4", measure: cup, ingredient: Onion, note: finely chopped }
      - { qty: "1/2", measure: cup, ingredient: Carrot, note: finely chopped }
      - { qty: 2, measure: clove, ingredient: Garlic, note: minced }
      - { qty: "3/4", measure: tsp, ingredient: Marjoram, note: dried }
      - { qty: "1/2", measure: tsp, ingredient: Dried thyme }
      - { qty: 9, ingredient: Cremini mushroom, note: "medium (or button), sliced" }
      - { ingredient: Black pepper }
    directions:
      - Bring the broth to a boil in a small saucepan. Off the heat, add the porcini and let stand until soft, about 30 minutes. Drain, reserving the liquid, and finely chop.
      - Cook the rice with the salt and bay leaves in a medium saucepan of boiling water over medium heat until almost tender, about 45 minutes. Drain and discard the bay leaves.
      - Melt the butter in a large nonstick skillet over medium heat. Saute the onion, carrot, garlic, marjoram, thyme and porcini 5 minutes. Add the cremini and saute until tender, about 7 minutes.
      - Add the rice and the porcini liquid (leave the sediment behind) and simmer until almost all the liquid is absorbed but it's still moist, about 10 minutes. Season with salt and pepper.

  - name: Rum Mashed Sweet Potatoes
    categories: [Vegetables, Thanksgiving]
    ingredients:
      - { qty: 2, measure: lb, ingredient: Sweet potato }
      - { qty: "1/2", measure: cup, ingredient: Heavy cream }
      - { qty: "1/4", measure: cup, ingredient: Rum, note: dark }
      - { qty: 3, measure: tbsp, ingredient: Light brown sugar, note: packed }
      - { qty: 1, measure: tbsp, ingredient: Molasses }
      - { qty: "1/8", measure: tsp, ingredient: Salt }
    directions:
      - Preheat the oven to 425 degrees F. Bake the potatoes on a foil-lined baking sheet until tender and starting to ooze, 50 minutes to 1 hour. Let cool enough to handle.
      - Peel and beat the flesh with the cream, rum, brown sugar, molasses and salt on high speed until smooth.

  - name: Bourbon-Mashed Sweet Potatoes
    categories: [Vegetables, Thanksgiving]
    ingredients:
      - { qty: 2, measure: lb, ingredient: Sweet potato, note: 1 3/4 to 2 pounds }
      - { qty: "1/2", measure: cup, ingredient: Heavy cream }
      - { qty: "1/4", measure: cup, ingredient: Bourbon whiskey }
      - { qty: 3, measure: tbsp, ingredient: Light brown sugar }
      - { qty: 2, measure: tbsp, ingredient: Molasses }
      - { qty: "1/8", measure: tsp, ingredient: Salt }
    directions:
      - Preheat the oven to 350 degrees F. Bake the potatoes on a foil-lined baking sheet until tender and oozing syrup, about 1 hour 15 minutes. Let cool enough to handle.
      - Slit each potato and scoop the flesh into a large bowl. Beat with the cream, bourbon, brown sugar, molasses and salt on high speed until smooth. Keep warm or reheat gently.

  - name: Baked Sweet Potato Fries
    categories: [Vegetables]
    ingredients:
      - { qty: 4, ingredient: Sweet potato }
      - { qty: 3, measure: tbsp, ingredient: Canola oil }
      - { qty: 1, measure: tsp, ingredient: Granulated garlic }
      - { qty: 1, measure: tsp, ingredient: Onion powder, note: granulated onion }
      - { qty: "1/2", measure: tsp, ingredient: Paprika }
      - { qty: 1, measure: tsp, ingredient: Ground cumin }
      - { qty: 1, measure: tbsp, ingredient: Seasoned salt, note: "recommended: Lawry's" }
      - { ingredient: Black pepper }
    directions:
      - Preheat the oven to 350 degrees F. Peel the potatoes and cut into 3/4 by 1/4-inch wedges.
      - Toss with the oil on a baking sheet and spread out without overlapping. Mix the seasonings and dust over the top.
      - Bake 20 minutes, turn and bake 15 minutes more. Move the wedges off the sheet and let sit uncovered 10 minutes, then reheat in the oven 3 minutes. Serve immediately.

  - name: Emeril's Sweet Potato Fries
    categories: [Vegetables]
    description:
      - Recipe courtesy Emeril Lagasse, 2003. Twice-fried.
    ingredients:
      - { qty: 3, measure: lb, ingredient: Sweet potato, note: 2 large }
      - { qty: 2, measure: qt, ingredient: Vegetable oil }
      - { qty: 1, measure: tbsp, ingredient: Brown sugar }
      - { qty: "1/2", measure: tsp, ingredient: Salt }
      - { qty: 1, measure: pinch, ingredient: Cayenne pepper }
      - { qty: 1, measure: pinch, ingredient: Cinnamon }
    directions:
      - Boil the potatoes in water to cover 10 minutes and let cool. Peel and cut into 1/4 by 1/4-inch batons.
      - Heat the oil to 300 degrees F in a 5-quart pot or deep fryer, with at least 3 inches of space above the oil.
      - Raise to medium-high and fry a handful at a time, stirring occasionally, until soft and just beginning to brown, 3 to 4 minutes. Drain on paper towels and rest at least 10 minutes or up to 2 hours.
      - Reheat the oil to 350 degrees F and fry again, stirring often, until browned and puffed, about 1 minute. Drain.
      - Toss with the brown sugar, salt, cayenne and cinnamon and serve immediately.

  - name: Grilled Sweet Potato Fries
    categories: [Vegetables]
    servings: 4
    description:
      - Recipe courtesy Jenss Chang. Serve as is, or with mint and cumin aioli (not in the file).
    ingredients:
      - { qty: "1 1/2", measure: tsp, ingredient: Salt, note: plus more for the water }
      - { qty: 2, ingredient: Sweet potato, note: "large, washed" }
      - { qty: 2, measure: tbsp, ingredient: Olive oil }
      - { qty: 3, measure: tbsp, ingredient: Brown sugar }
      - { qty: 1, measure: tsp, ingredient: Cayenne pepper, note: plus more if desired }
      - { qty: "1 1/2", measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: 1, measure: tsp, ingredient: Cinnamon, note: ground }
      - { qty: "1/4", measure: tsp, ingredient: Clove, note: ground }
    directions:
      - Preheat a grill to medium-high and oil the grates.
      - Cover the potatoes with cold salted water, bring to a boil over medium heat and simmer until a paring knife goes in with little resistance, 25 to 30 minutes. Don't overcook.
      - Cool them in cold water and drain. Peel and cut lengthwise into about 6 thick wedges each.
      - Coat with the olive oil, then toss with the sugar and spices. Grill until heated through and caramelized, 3 to 4 minutes per side.

  - name: Creamed Spinach
    categories: [Vegetables]
    description:
      - Recipe courtesy Anne Burrell.
    ingredients:
      - { ingredient: Olive oil, note: extra-virgin }
      - { qty: "2 1/2", measure: lb, ingredient: Baby spinach, note: washed }
      - { qty: "1/2", ingredient: Onion, note: "small, finely diced" }
      - { ingredient: Kosher salt }
      - { qty: 2, measure: clove, ingredient: Garlic, note: smashed }
      - { qty: 2, measure: tbsp, ingredient: Butter }
      - { qty: 2, measure: tbsp, ingredient: Flour, note: all-purpose }
      - { qty: 1, measure: cup, ingredient: Milk }
      - { qty: 1, measure: pinch, ingredient: Cayenne pepper }
      - { qty: "1/4", measure: cup, ingredient: Parmesan, note: "Parmigiano, grated" }
    directions:
      - Coat a large straight-sided saute pan with olive oil over medium heat. Add the spinach, cover and saute until gently wilted. Drain and cool in a colander over a bowl.
      - Pour off any liquid and lightly coat the pan with oil. Cook the onions with salt over medium heat until translucent and very aromatic, 5 to 7 minutes. Add the garlic for 2 to 3 minutes.
      - Melt in the butter, stir in the flour and cook until it looks like wet sand, 5 to 6 minutes. Whisk in the milk, cayenne and cheese and season (it will need salt).
      - Bring to a boil, then simmer 5 to 6 minutes, stirring so the milk doesn't scorch. Stir in the spinach, adjust the seasoning and serve.

  - name: Creamed Spinach with Nutmeg
    categories: [Vegetables]
    ingredients:
      - { ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, measure: tbsp, ingredient: Unsalted butter }
      - { qty: 1, ingredient: Onion, note: minced }
      - { qty: 2, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 2, measure: lb, ingredient: Baby spinach, note: "fresh, stemmed" }
      - { qty: "1/2", measure: cup, ingredient: Heavy cream }
      - { qty: "1/2", measure: tsp, ingredient: Nutmeg, note: freshly grated }
      - { ingredient: Sea salt }
      - { ingredient: Black pepper, note: freshly ground }
    directions:
      - Heat a large pot over medium heat, add a drizzle of oil and melt in the butter. Saute the onion and garlic until soft, about 5 minutes.
      - Add the spinach in batches, pushing it down to wilt and adding more as there's room. Cook until dry.
      - Lower the heat, add the cream and nutmeg and cook 10 minutes, stirring. Season and serve hot.

  - name: Pickled Squash
    categories: [Vegetables]
    description:
      - Recipe courtesy Emeril Lagasse, 2001. Refrigerate any jars that don't seal and eat within 2 weeks.
    ingredients:
      - { qty: 10, measure: cup, ingredient: Zucchini, note: "sliced squash - zucchini and yellow summer squash" }
      - { qty: 2, measure: cup, ingredient: Onion, note: sliced }
      - { ingredient: Kosher salt, note: for sprinkling }
      - { qty: 2, measure: cup, ingredient: White vinegar }
      - { qty: 3, measure: cup, ingredient: Sugar }
      - { qty: "1 1/2", measure: tbsp, ingredient: Pickling spice }
      - { qty: "1/2", measure: tsp, ingredient: Red pepper flakes, note: "crushed, optional" }
    directions:
      - Layer the squash and onions in a large pot or bowl, salting each layer generously, and let sit 1 hour. Drain well.
      - Bring the vinegar, sugar, pickling spice and red pepper to a boil in a large nonreactive pot. Add the vegetables and return to a boil.
      - Divide among sterilized jars and ladle in liquid to within 1/2 inch of the top. Wipe the rims, put on the lids and process in a hot water bath 10 minutes. Cool; the jars should seal as they cool.

  - name: Baked Acorn Squash Filled with Italian Sausage and Rigatoni
    categories: [Vegetables, Pasta, Sausage]
    servings: 8
    ingredients:
      - { qty: 4, ingredient: Acorn squash, note: "medium, halved and cleaned" }
      - { ingredient: Olive oil }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly ground }
      - { qty: 1, measure: lb, ingredient: Italian sausage, note: "casings removed, 1/2-inch pieces" }
      - { qty: 1, measure: cup, ingredient: Red onion, note: sliced }
      - { qty: "1/2", measure: lb, ingredient: Rigatoni, note: "cooked tender, tossed in olive oil and cooled" }
      - { qty: "1/2", measure: lb, ingredient: Mozzarella, note: cut into 1/2-inch cubes }
      - { qty: 1, measure: tbsp, ingredient: Parsley, note: "fresh leaves, finely chopped" }
      - { qty: 1, measure: tbsp, ingredient: Olive oil, note: for the tomato sauce }
      - { qty: "1/2", measure: cup, ingredient: Onion, note: "chopped, for the tomato sauce" }
      - { qty: 2, measure: tbsp, ingredient: Garlic, note: "finely chopped, for the tomato sauce" }
      - { qty: 2, measure: tsp, ingredient: Salt, note: for the tomato sauce }
      - { qty: "1/2", measure: tsp, ingredient: White pepper, note: for the tomato sauce }
      - { qty: "2 1/2", measure: cup, ingredient: Tomato, note: "chopped, peeled, with juice, for the tomato sauce" }
      - { qty: "1/4", measure: cup, ingredient: Basil, note: "fresh, chopped, for the tomato sauce" }
      - { qty: "1/2", measure: cup, ingredient: Chicken stock, note: for the tomato sauce }
      - { qty: 1, measure: pinch, ingredient: Sugar, note: for the tomato sauce }
    directions:
      - "Tomato sauce: heat the oil in a large skillet and saute the onions, garlic, salt and white pepper 3 minutes. Add the tomatoes and basil and cook, stirring, 3 minutes. Stir in the stock and 18 turns of black pepper and simmer 2 minutes. Add sugar if acidic and cook 1 minute. The recipe calls for 4 cups; this makes about 3, so double it if you like more sauce."
      - Preheat the oven to 350 degrees F. Season the squash with olive oil, salt and pepper, set flesh side up on a baking sheet with 1/2 cup water, cover with foil and bake until tender, about 1 hour. Cool completely.
      - Brown the sausage and onions in a large saute pan over medium heat, 6 to 8 minutes.
      - Toss the sausage and onions with the tomato sauce, pasta and cheese and season.
      - Fill the squash cavities and bake on a baking sheet until heated through and the cheese melts, about 20 minutes. Garnish with parsley.

  - name: San Antonio Squash Casserole
    categories: [Vegetables, Casseroles]
    ingredients:
      - { qty: 2, measure: oz, ingredient: Butter, note: "divided, plus more for the pan" }
      - { qty: 2, measure: cup, ingredient: Yellow onion, note: diced }
      - { qty: 2, measure: lb, ingredient: Yellow squash, note: sliced }
      - { qty: 1, measure: lb, ingredient: American cheese, note: cubed }
      - { qty: 8, measure: oz, ingredient: Green chiles, note: "canned, diced" }
      - { qty: 10, measure: oz, ingredient: Cream of celery soup }
      - { qty: "3/4", measure: cup, ingredient: Bread crumbs }
    directions:
      - Preheat the oven to 350 degrees F.
      - Saute the onion in half the butter in a large skillet over medium heat until soft. In another skillet, saute the squash in the rest of the butter until soft (or microwave it). Drain the squash.
      - Combine the onion, squash, cheese, chiles and soup in a buttered casserole and bake until heated through and the cheese is melted.
      - Stir, sprinkle with the bread crumbs and bake 5 minutes more, until golden.

  - name: Yellow Squash Casserole
    categories: [Vegetables, Casseroles]
    ingredients:
      - { qty: "1 3/4", measure: lb, ingredient: Yellow squash, note: crookneck or other summer squash }
      - { qty: "1/4", measure: lb, ingredient: Zucchini, note: or more yellow squash }
      - { qty: "1/2", measure: cup, ingredient: Carrot, note: coarsely chopped }
      - { qty: 4, measure: tbsp, ingredient: Unsalted butter, note: "1/2 stick, divided, plus more for the dish" }
      - { qty: 1, ingredient: Onion, note: "large, preferably yellow, chopped" }
      - { qty: 1, measure: clove, ingredient: Garlic, note: "plump, minced" }
      - { qty: "1 1/4", measure: cup, ingredient: Saltine crackers, note: "or Ritz, crumbs, divided" }
      - { qty: "1/2", measure: cup, ingredient: Cheddar, note: "mild to medium, grated" }
      - { ingredient: Hot sauce, note: "such as Tabasco" }
      - { ingredient: Salt }
      - { ingredient: Black pepper, note: freshly milled }
      - { qty: 2, ingredient: Egg, note: lightly beaten }
    directions:
      - Preheat the oven to 350 degrees F and butter a medium baking dish.
      - Quarter the squash and zucchini lengthwise and cut into 1/2-inch wedges. Barely cover with well-salted water in a saucepan with the carrots, bring to a boil, cover and cook over medium about 20 minutes, until very soft.
      - Meanwhile, cook the onion slowly in 3 tablespoons butter over medium-low heat until very soft, 6 to 8 minutes. Add the garlic for 1 minute and scrape into a mixing bowl. Melt the last tablespoon of butter and toast 1/2 cup of the crumbs until golden; reserve.
      - Drain the squash, mashing it a bit, and add to the bowl with the remaining 3/4 cup crumbs, the cheese, a good splash or two of hot sauce, and plenty of salt and pepper. Stir in the eggs.
      - Spoon into the dish, scatter the toasted crumbs on top and bake uncovered about 30 minutes, until golden and lightly firm in the center.

  - name: Bob's Squash
    categories: [Vegetables, Casseroles]
    description:
      - Instead of bread crumbs, try crumbled Ritz or club crackers dotted with butter.
    ingredients:
      - { qty: 2, measure: tbsp, ingredient: Butter }
      - { qty: 1, measure: tbsp, ingredient: Olive oil }
      - { qty: "1/2", ingredient: Onion, note: diced }
      - { qty: 4, measure: clove, ingredient: Garlic, note: minced }
      - { qty: "1/2", measure: can, ingredient: Cheddar cheese soup, note: "Campbell's" }
      - { qty: 1, measure: can, ingredient: Cream of celery soup }
      - { qty: 4, measure: tbsp, ingredient: White wine }
      - { qty: 4, measure: tbsp, ingredient: Milk }
      - { qty: 3, ingredient: Yellow squash, note: 2 or 3 depending on size }
      - { qty: 3, ingredient: Zucchini, note: 2 or 3 depending on size }
      - { ingredient: Salt }
      - { ingredient: Black pepper }
      - { ingredient: Parmesan }
      - { ingredient: Bread crumbs }
      - { ingredient: Paprika }
    directions:
      - Melt the butter with the olive oil in a saucepan and sweat the onion. Add the garlic and cook until fragrant.
      - Over low heat, blend in both soups, the wine and milk to make a sauce.
      - Cut the squash and zucchini into 1/4-inch rounds and lay in a buttered 9 by 9-inch baking dish. Season, cover with plastic wrap and microwave about 3 minutes.
      - Pour the sauce over, cover with a layer of Parmesan and bread crumbs and sprinkle with paprika. Bake at 350 degrees F about 15 minutes, until bubbly.

  - name: Pappardelle with Summer Vegetables and Ricotta
    categories: [Vegetables, Pasta]
    ingredients:
      - { qty: 1, ingredient: Zucchini, note: medium }
      - { qty: 1, ingredient: Yellow squash, note: medium }
      - { qty: 1, ingredient: Shallot, note: minced }
      - { qty: 2, measure: clove, ingredient: Garlic, note: minced }
      - { qty: 1, measure: pt, ingredient: Cherry tomato, note: halved }
      - { qty: 3, measure: tbsp, ingredient: Olive oil, note: extra-virgin }
      - { qty: 1, measure: tbsp, ingredient: Salt, note: divided }
      - { qty: 1, measure: tsp, ingredient: Black pepper, note: fresh cracked }
      - { qty: "1/4", measure: cup, ingredient: White wine, note: Sauvignon Blanc or other }
      - { qty: 3, measure: tbsp, ingredient: Butter }
      - { qty: 2, measure: tsp, ingredient: Tarragon, note: "fresh, chopped" }
      - { qty: 4, measure: oz, ingredient: Baby arugula, note: fresh }
      - { qty: 1, measure: lb, ingredient: Pappardelle, note: fresh }
      - { qty: "1/2", measure: cup, ingredient: Ricotta, note: fresh }
      - { ingredient: Nutmeg, note: "freshly grated, to taste" }
    directions:
      - Bring a stockpot of water to a boil with 3 teaspoons of the salt.
      - Quarter the squash and zucchini lengthwise and cut into 1/4-inch slices.
      - Heat the olive oil in a large saute pan over medium-high heat and saute the shallot and garlic 1 to 2 minutes, until translucent. Add the squash, stir to coat, season with the remaining salt and the pepper and cook 2 to 3 minutes, until lightly golden but still crisp.
      - Slowly add the wine, scraping up the bits. Stir in the butter until melted, toss in the tarragon and turn the heat to low.
      - Cook the pasta 2 to 3 minutes and lift it straight into the pan with the tomatoes. Toss over medium heat, adding pasta water to loosen if you like.
      - Top with the arugula and big dollops of ricotta and garnish with nutmeg.

  - name: Grilled Yucca with Huancaina Sauce
    categories: [Vegetables]
    ingredients:
      - { qty: 1, ingredient: Cassava, note: "whole yucca" }
      - { ingredient: Salt }
      - { qty: 4, measure: tbsp, ingredient: Butter, note: melted }
      - { qty: 4, measure: tbsp, ingredient: Canola oil, note: divided }
      - { qty: "1/2", ingredient: Red onion, note: diced }
      - { qty: 1, ingredient: Aji amarillo, note: "rib and seeds removed, diced" }
      - { qty: 1, measure: clove, ingredient: Garlic }
      - { ingredient: Black pepper }
      - { qty: 5, measure: oz, ingredient: Mozzarella, note: fresh }
      - { qty: 1, ingredient: Egg, note: "hard-boiled, plus more chopped for garnish, optional" }
      - { qty: "1/2", measure: cup, ingredient: Heavy cream }
      - { ingredient: Kalamata olive, note: "Nicoise olives, for garnish, optional" }
      - { ingredient: Cilantro, note: "leaves, for garnish, optional" }
    directions:
      - Peel the yucca, cut into 4 cylinders, split in half and remove the root. Cover with salted water, bring to a boil and simmer until fork-tender, about 30 minutes. Let cool.
      - Brush with butter and grill 3 to 4 minutes per side. Season with salt.
      - Meanwhile, heat 2 tablespoons oil in a skillet over medium heat and saute the onion, aji and garlic with salt and pepper until translucent.
      - Blend with the cheese and egg, then slowly drizzle in the cream and remaining 2 tablespoons oil to sauce consistency. Adjust the salt.
      - Serve the yucca with the sauce, garnished with egg, olives and cilantro.

  - name: Zucchini Custard Bake
    categories: [Vegetables, Casseroles]
    description:
      - If refrigerated before baking, add about 10 minutes.
    ingredients:
      - { qty: 4, measure: tbsp, ingredient: Butter, note: "1/2 stick, melted" }
      - { qty: 2, measure: lb, ingredient: Zucchini, note: cut into small pieces }
      - { qty: 3, ingredient: Egg }
      - { qty: "1/2", measure: cup, ingredient: Evaporated milk, note: "undiluted, or light cream" }
      - { qty: 2, measure: tbsp, ingredient: Bread crumbs, note: fine dry }
      - { qty: "1/2", measure: cup, ingredient: Onion, note: diced }
      - { qty: 1, measure: tsp, ingredient: Worcestershire sauce }
      - { measure: dash, ingredient: Hot sauce }
      - { qty: 1, measure: tsp, ingredient: Salt }
      - { qty: "1/8", measure: tsp, ingredient: Black pepper }
      - { qty: "1/4", measure: cup, ingredient: Parmesan, note: "grated, divided" }
    directions:
      - Preheat the oven to 350 degrees F.
      - Cook the zucchini in the melted butter in a large covered saucepan over low heat, stirring occasionally, until tender, 5 to 7 minutes. Let cool so it doesn't scramble the eggs.
      - Beat the eggs with the milk and add the bread crumbs, onion, Worcestershire, hot sauce, salt, pepper and 2 tablespoons Parmesan. Stir into the zucchini.
      - Turn into a buttered 1 1/2-quart casserole, sprinkle with the remaining Parmesan and bake uncovered 35 to 40 minutes.

  - name: Zucchini Gratin
    categories: [Vegetables]
    ingredients:
      - { qty: 6, measure: tbsp, ingredient: Unsalted butter, note: "3/4 stick, plus 1 tablespoon for topping" }
      - { qty: 1, measure: lb, ingredient: Yellow onion, note: "3 large, halved and sliced" }
      - { qty: 2, measure: lb, ingredient: Zucchini, note: "4, sliced 1/4 inch thick" }
      - { qty: 2, measure: tsp, ingredient: Kosher salt }
      - { qty: 1, measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { qty: "1/4", measure: tsp, ingredient: Nutmeg, note: ground }
      - { qty: 2, measure: tbsp, ingredient: Flour, note: all-purpose }
      - { qty: 1, measure: cup, ingredient: Milk, note: hot }
      - { qty: "3/4", measure: cup, ingredient: Bread crumbs, note: fresh }
      - { qty: "3/4", measure: cup, ingredient: Gruyere cheese, note: grated }
    directions:
      - Preheat the oven to 400 degrees F.
      - Melt the butter in a very large (12-inch) saute pan and cook the onions over low heat 20 minutes, until tender but not browned.
      - Add the zucchini and cook covered 10 minutes, until tender. Add the salt, pepper and nutmeg and cook uncovered 5 minutes more.
      - Stir in the flour, add the hot milk and cook over low heat a few minutes into a sauce. Pour into an 8 by 10-inch baking dish.
      - Combine the bread crumbs and Gruyere and sprinkle on top. Dot with the tablespoon of butter in bits and bake 20 minutes, until bubbly and browned.

  - name: Zucchini Pancakes
    categories: [Vegetables]
    prep_time: 20
    cooking_time: 4
    description:
      - Recipe from Barefoot Contessa at Home, 2006. Makes 10 (3-inch) pancakes. They'll stay warm in the oven up to 30 minutes.
    ingredients:
      - { qty: 2, ingredient: Zucchini, note: "medium (about 3/4 pound)" }
      - { qty: 2, measure: tbsp, ingredient: Red onion, note: grated }
      - { qty: 2, ingredient: Egg, note: "extra-large, lightly beaten" }
      - { qty: 8, measure: tbsp, ingredient: Flour, note: "all-purpose, 6 to 8 tablespoons" }
      - { qty: 1, measure: tsp, ingredient: Baking powder }
      - { qty: 1, measure: tsp, ingredient: Kosher salt }
      - { qty: "1/2", measure: tsp, ingredient: Black pepper, note: freshly ground }
      - { ingredient: Unsalted butter, note: for frying }
      - { ingredient: Vegetable oil, note: for frying }
    directions:
      - Preheat the oven to 300 degrees F.
      - Grate the zucchini on the large holes of a box grater and immediately stir in the onion and eggs. Stir in 6 tablespoons of flour, the baking powder, salt and pepper; add the rest of the flour if the batter gets too thin.
      - Melt 1/2 tablespoon each butter and oil in a large saute pan over medium heat. When hot, lower to medium-low and drop in heaping soup spoons of batter. Cook about 2 minutes per side, until browned.
      - Keep warm on a sheet pan in the oven, wiping out the pan and adding more butter and oil for each batch. Serve hot.
